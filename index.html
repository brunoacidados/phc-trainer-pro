 reten\u00e7\u00e3o no documento).</li>\n</ul>\n<h3>6.6 Novas obriga\u00e7\u00f5es 2026 (vers\u00e3o 202601)</h3>\n<ul>\n<li><strong>SDR \u2014 Sistema de Dep\u00f3sito e Recolha</strong>: desde <strong>10 de abril de 2026</strong>, dep\u00f3sito de <strong>0,10 \u20ac/unidade</strong> em embalagens de bebidas de uso \u00fanico (at\u00e9 3 L). Configura\u00e7\u00e3o \u00fanica dos \"itens SDR\" no software; o dep\u00f3sito \u00e9 aplicado automaticamente em cada venda. Retorno de embalagens/vales gerido maioritariamente por RVM (m\u00e1quinas) \u2014 integra\u00e7\u00e3o ERP\u2194RVM para estabelecimentos \u2265400 m\u00b2 <strong>n\u00e3o \u00e9 standard</strong> (oportunidade de desenvolvimento!).</li>\n<li><strong>Seguran\u00e7a Social com 2FA</strong> obrigat\u00f3rio para empresas desde <strong>12 de maio de 2026</strong> (afeta comunica\u00e7\u00f5es do m\u00f3dulo Pessoal, mas o t\u00e9cnico deve conhecer).</li>\n</ul>\n<h3>6.7 RGPD</h3>\n<ul>\n<li>Aviso legal configur\u00e1vel e registo do tratamento de dados; direito ao esquecimento (anonimiza\u00e7\u00e3o/processamento de dados pessoais); hist\u00f3rico de utilizadores; log de atividade (Enterprise). Artigos oficiais: \"RGPD: Como o PHC CS o ajuda a cumprir a legisla\u00e7\u00e3o\".</li>\n</ul>\n<hr />\n<h2 id=\"cap-7\">7. Desenvolvimento e personaliza\u00e7\u00e3o (Framework PHC)</h2>\n<blockquote>\n<p>Aqui est\u00e1 o cora\u00e7\u00e3o do \"t\u00e9cnico que desenvolve solu\u00e7\u00f5es\". A plataforma tem <strong>duas frameworks</strong>: desktop (<strong>Xbase</strong>) e web (<strong>C#</strong>), mais a camada <strong>SQL Server</strong> (T-SQL) e a plataforma de integra\u00e7\u00e3o <strong>EyePeak</strong>.</p>\n</blockquote>\n<h3>7.1 Princ\u00edpios</h3>\n<ul>\n<li><strong>Tudo o que \u00e9 personaliza\u00e7\u00e3o fica gravado na base de dados</strong> (c\u00f3digo, regras, campos, ecr\u00e3s) \u2014 sobrevive a reinstala\u00e7\u00f5es do execut\u00e1vel, mas <strong>tem de ser validado a cada upgrade de vers\u00e3o</strong>.</li>\n<li>As ferramentas da framework ativam-se por <strong>par\u00e2metros</strong> (ex.: \"Utiliza campos do utilizador?\") e aparecem no menu <strong>Supervisor \u2192 Framework PHC</strong>.</li>\n<li>A disponibilidade depende da <strong>gama/plano</strong> (Corporate tem pouco; Advanced abre a personaliza\u00e7\u00e3o; Enterprise abre p\u00e1ginas/objetos/eventos completos e aprova\u00e7\u00f5es).</li>\n</ul>\n<h3>7.2 Ferramentas da Framework desktop (invent\u00e1rio completo)</h3>\n<table>\n<thead>\n<tr>\n<th>Ferramenta</th>\n<th>Para que serve</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Campos de Utilizador</strong></td>\n<td>Adicionar colunas a tabelas do software (com tipos, valida\u00e7\u00f5es) sem alterar o core</td>\n</tr>\n<tr>\n<td><strong>Tabelas de Utilizador</strong></td>\n<td>Criar tabelas novas da aplica\u00e7\u00e3o (ex.: a \"Zona\" do cliente \u00e9 um campo de tabela do utilizador)</td>\n</tr>\n<tr>\n<td><strong>\u00cdndices de Utilizador</strong></td>\n<td>Criar \u00edndices SQL sobre tabelas do software (incl. INCLUDED COLUMNS) para performance</td>\n</tr>\n<tr>\n<td><strong>Valores por Defeito</strong></td>\n<td>Preenchimento autom\u00e1tico de qualquer campo de qualquer tabela (com express\u00e3o)</td>\n</tr>\n<tr>\n<td><strong>Regras de Utilizador</strong> (+ Assistente)</td>\n<td>Valida\u00e7\u00f5es de neg\u00f3cio: obrigar campos, impedir grava\u00e7\u00e3o sem stock, validar NIF\u2026 com editor e assistente de constru\u00e7\u00e3o</td>\n</tr>\n<tr>\n<td><strong>Teclas de Utilizador</strong></td>\n<td>Atalhos de teclado personalizados (com descri\u00e7\u00e3o em rodap\u00e9)</td>\n</tr>\n<tr>\n<td><strong>Fun\u00e7\u00f5es de Utilizador</strong></td>\n<td>Fun\u00e7\u00f5es Xbase reutiliz\u00e1veis criadas pelo utilizador</td>\n</tr>\n<tr>\n<td><strong>Instru\u00e7\u00f5es Internas</strong></td>\n<td>Instru\u00e7\u00f5es/procedimentos escritos pelo utilizador associados a cada ecr\u00e3 principal (documenta\u00e7\u00e3o in-app e automa\u00e7\u00e3o)</td>\n</tr>\n<tr>\n<td><strong>Eventos de Utilizador</strong></td>\n<td>C\u00f3digo Xbase associado a eventos de objetos/ecr\u00e3s (ver 7.3)</td>\n</tr>\n<tr>\n<td><strong>P\u00e1ginas de Utilizador / Objetos de Ecr\u00e3</strong></td>\n<td>Acrescentar p\u00e1ginas (separadores) e objetos (campos, textos, bot\u00f5es, grelhas, campos de liga\u00e7\u00e3o, campos em \u00e1rvore\u2026) aos ecr\u00e3s standard</td>\n</tr>\n<tr>\n<td><strong>Ecr\u00e3s Personalizados (IDU)</strong></td>\n<td>Criar ecr\u00e3s novos de raiz (desenhador de ecr\u00e3s; em POS touch com drag-and-drop), com liga\u00e7\u00f5es entre IDUs, par\u00e2metros de ecr\u00e3 e bot\u00e3o personaliz\u00e1vel</td>\n</tr>\n<tr>\n<td><strong>Op\u00e7\u00f5es de Ecr\u00e3 / Menus</strong></td>\n<td>Acrescentar bot\u00f5es \u00e0s toolbars e criar menus para op\u00e7\u00f5es novas; Configura\u00e7\u00f5es de Menus</td>\n</tr>\n<tr>\n<td><strong>Consultas / An\u00e1lises de Utilizador</strong></td>\n<td>Consultas SQL do utilizador apresentadas como ecr\u00e3s de an\u00e1lise; base das An\u00e1lises Multidimensionais</td>\n</tr>\n<tr>\n<td><strong>Snapshots</strong></td>\n<td>Consultas T-SQL \"fotografadas\" com vari\u00e1veis (ex.: <code>#stamp#</code>), agrup\u00e1veis e coloridas</td>\n</tr>\n<tr>\n<td><strong>Monitores / Itens de Monitor</strong></td>\n<td>Apresenta\u00e7\u00f5es de dados sequenciais (colunas configur\u00e1veis) para operational dashboards</td>\n</tr>\n<tr>\n<td><strong>Alertas de Utilizador / Notifica\u00e7\u00f5es</strong></td>\n<td>Alertas autom\u00e1ticos (fun\u00e7\u00f5es internas como <code>CriaAvs(stamp, userAv, \u2026)</code>; novas fun\u00e7\u00f5es internas 202601: \"Enviar documentos de Compras/Vendas para o SII\"); aviso interno, PHC Notify, e-mail</td>\n</tr>\n<tr>\n<td><strong>Filtros de Utilizador</strong></td>\n<td>Filtros pr\u00f3prios para as tabelas/grelhas</td>\n</tr>\n<tr>\n<td><strong>Templates (B\u00e1sicos / de Tabela) / Defini\u00e7\u00e3o de Assinaturas</strong></td>\n<td>Modelos r\u00e1pidos de UI e assinaturas digitais em ecr\u00e3s (interven\u00e7\u00f5es, faturas, dossiers)</td>\n</tr>\n<tr>\n<td><strong>Multi-l\u00edngua</strong></td>\n<td>Tradu\u00e7\u00f5es de descri\u00e7\u00f5es (artigos, etc.)</td>\n</tr>\n<tr>\n<td><strong>Importa\u00e7\u00e3o/Exporta\u00e7\u00e3o</strong></td>\n<td>Importar Excel para linhas, exportar listagens xlsx/pdf, importa\u00e7\u00e3o de c\u00e2mbios via ODBC</td>\n</tr>\n<tr>\n<td><strong>Dicion\u00e1rio de Dados</strong></td>\n<td>Consulta da estrutura de <strong>qualquer tabela</strong> (campos, descri\u00e7\u00f5es, tipos, tamanhos) e <strong>rela\u00e7\u00f5es entre tabelas</strong> (desde a vers\u00e3o 2008) \u2014 acess\u00edvel por Supervisor \u2192 Tratamento da base de dados, ou pelo menu de op\u00e7\u00f5es de qualquer ecr\u00e3 (posiciona-se na tabela do ecr\u00e3). <strong>A ferramenta n\u00ba 1 do programador PHC.</strong></td>\n</tr>\n<tr>\n<td><strong>Simulador de SQL / Explorador de Dados</strong></td>\n<td>Executar consultas \u00e0 BD dentro da aplica\u00e7\u00e3o; explorar dados</td>\n</tr>\n<tr>\n<td><strong>An\u00e1lise Interna</strong></td>\n<td>Onde ficam gravados os <strong>erros de execu\u00e7\u00e3o dos eventos/c\u00f3digo do utilizador</strong> (linha do erro; express\u00f5es n\u00e3o t\u00eam n\u00ba de linha) \u2014 primeiro s\u00edtio a ver quando \"o evento n\u00e3o faz nada\"</td>\n</tr>\n</tbody>\n</table>\n<h3>7.3 Eventos e o objeto <code>ObjRecebido</code> (Xbase desktop)</h3>\n<p>Os eventos s\u00e3o express\u00f5es/programas em <strong>Xbase</strong> (sintaxe tipo Visual FoxPro) associados a objetos (Enterprise; alguns eventos de utilizador dispon\u00edveis desde Advanced). Lista oficial de eventos:</p>\n<ul>\n<li><strong>Init</strong>, <strong>Ativar</strong>, <strong>Desativar</strong>, <strong>Refrescar</strong></li>\n<li><strong>Clique</strong>, <strong>Duplo Clique</strong>, <strong>Clique Direito</strong></li>\n<li><strong>Ao Entrar</strong>, <strong>Ao Sair</strong>, <strong>Ap\u00f3s Atualizar</strong>, <strong>Ap\u00f3s n\u00e3o Atualizado</strong></li>\n<li><strong>Antes mudar Linha/Coluna</strong>, <strong>Depois mudar Linha/Coluna</strong></li>\n<li><strong>MouseEnter</strong>, <strong>MouseLeave</strong>, <strong>MouseMove</strong>, <strong>MouseWheel</strong></li>\n<li><strong>Tecla Pressionada</strong></li>\n</ul>\n<p>Em cada evento programado existe o objeto <strong><code>ObjRecebido</code></strong>, com:</p>\n<ul>\n<li><strong><code>ObjRecebido.Janela</code></strong> \u2014 apontador para o ecr\u00e3 (ex.: <code>ObjRecebido.Janela.Caption = \"Exemplo\"</code>; altera\u00e7\u00f5es n\u00e3o persistem \u2014 usar no evento Init para aplicar sempre).</li>\n<li><strong><code>ObjRecebido.Objecto</code></strong> \u2014 apontador para o pr\u00f3prio objeto (propriedades <code>Value</code>, <code>Parent</code>; em objetos compostos como o <strong>Campo de Liga\u00e7\u00e3o</strong>: <code>.Lista1</code>, <code>.Nossocampo1</code>, <code>.Procura</code>).</li>\n<li><strong><code>ObjRecebido.Objecto.MeusDados</code></strong> \u2014 reposit\u00f3rio chave/valor do utilizador para passar dados entre eventos: <code>AddParametro</code>, <code>GuardaParametro</code>, <code>ExisteParametro</code>, <code>GetNomeParametro</code>, <code>GetIndexParametro</code>, <code>TotalParametros</code> (leitura do valor: <code>MeusDados.CorFundoAntiga</code>).</li>\n<li><strong><code>Return .F.</code></strong> \u2014 cancela o comportamento de raiz do objeto para esse evento (ex.: impedir digita\u00e7\u00e3o, esconder calend\u00e1rio em campos de data). Sem <code>Return</code> em express\u00f5es simples (o valor \u00e9 retornado automaticamente).</li>\n<li>Debug: erros de eventos gravados na <strong>An\u00e1lise Interna</strong>.</li>\n</ul>\n<p><strong>Exemplo (guardar/rep\u00f4r cor de fundo entre eventos):</strong></p>\n<pre><code class=\"language-xbase\">* Evento Init (programa)\nObjRecebido.Objecto.MeusDados.GuardaParametro(&quot;CorFundoAntiga&quot;, ObjRecebido.Objecto.BackColor)\nObjRecebido.Objecto.BackColor = RGB(0,255,255)\n</code></pre>\n<p><strong>Fun\u00e7\u00f5es internas \u00fateis (exemplos documentados):</strong> <code>U_NAVEGA</code> (navegar para registos/ecr\u00e3s; o 2\u00ba par\u00e2metro interage com \"mostrar \u00faltimo registo\"), <code>CriaAvs</code> (criar avisos/avisos internos a utilizadores \u2014 par\u00e2metros incluem <code>stamp</code> do ecr\u00e3 e <code>userAv</code>), fun\u00e7\u00f5es de envio SII (202601), <code>PromptFunction()</code> (202601 \u2014 nova fun\u00e7\u00e3o da framework para invocar IA/Cegid Pulse a partir de c\u00f3digo; base dos <strong>Smart Tools</strong> que os parceiros podem configurar/monetizar).</p>\n<h3>7.4 Framework PHC CS Web (C#)</h3>\n<p>No lado web (inclu\u00eddo no Evolution), a framework oferece (lista oficial do manual \"Framework PHC CS Web\"):</p>\n<ul>\n<li><strong>Editor de C\u00f3digo</strong> (C#) para eventos e regras</li>\n<li><strong>Eventos</strong> (ex.: enviar e-mail com o material quando algu\u00e9m introduz uma encomenda)</li>\n<li><strong>Regras</strong> (valida\u00e7\u00f5es de neg\u00f3cio: obrigar campos, impedir grava\u00e7\u00e3o sem stock\u2026)</li>\n<li><strong>Ecr\u00e3s de Utilizador</strong> (novos ecr\u00e3s \u00e0 medida), <strong>Objetos de Ecr\u00e3</strong> (acrescentar campos a p\u00e1ginas existentes), <strong>Objetos Internos</strong> (campos novos em objetos existentes), <strong>Objetos da Framework</strong> (lista de todos os objetos do ecr\u00e3)</li>\n<li><strong>Op\u00e7\u00f5es de Ecr\u00e3</strong> (bot\u00f5es novos em toolbars), <strong>Menus</strong></li>\n<li><strong>Scripts</strong> (programa executado por URL \u2014 endpoints pr\u00f3prios!)</li>\n<li><strong>Monitores</strong> e <strong>Itens de Monitor</strong>, <strong>Templates B\u00e1sicos</strong>, <strong>Templates de Tabela</strong>, <strong>Defini\u00e7\u00e3o de Assinaturas</strong></li>\n<li><strong>Valores por Defeito</strong>, <strong>Filtros do Utilizador</strong>, <strong>RSS do Utilizador</strong></li>\n<li><strong>Par\u00e2metros</strong> (configura\u00e7\u00e3o das aplica\u00e7\u00f5es autorizadas)</li>\n<li><strong>Log de C\u00f3digo</strong> (diagn\u00f3stico da execu\u00e7\u00e3o do c\u00f3digo de utilizador)</li>\n<li><strong>Dicion\u00e1rio de dados</strong> (web)</li>\n</ul>\n<p>Relat\u00f3rios web usam <strong>DevExpress</strong> (\"Relat\u00f3rios DevExpress no PHC CS Web\", cobrindo Gest\u00e3o: Clientes, Fatura\u00e7\u00e3o, Recibos de Adiantamento\u2026).</p>\n<h3>7.5 Camada SQL Server (T-SQL)</h3>\n<ul>\n<li>Consultas diretas para an\u00e1lises/snapshots/relat\u00f3rios externos (com <code>WITH (NOLOCK)</code> para leituras, e aten\u00e7\u00e3o a <code>ref</code>/<code>stamp</code>).</li>\n<li><strong>\u00cdndices de utilizador</strong> via framework (evitar criar \u00edndices \"\u00e0 m\u00e3o\" sem documentar).</li>\n<li>Views/procedures: poss\u00edveis, mas <strong>a PHC atualiza o esquema entre vers\u00f5es</strong> \u2014 nunca alterar tabelas/colunas do core; usar campos/tabelas de utilizador.</li>\n<li><strong>Desfragmenta\u00e7\u00e3o</strong> e manuten\u00e7\u00e3o (cap\u00edtulo 3).</li>\n</ul>\n<h3>7.6 Receitas pr\u00e1ticas (padr\u00f5es que vai usar sempre)</h3>\n<ol>\n<li><strong>Validar NIF portugu\u00eas ao gravar cliente</strong> \u2192 Regra de utilizador no ecr\u00e3 Clientes (com assistente ou c\u00f3digo Xbase), mensagem via aviso.</li>\n<li><strong>Impedir fatura\u00e7\u00e3o sem stock</strong> \u2192 Regra de utilizador no documento (gama Advanced+) ou evento Ap\u00f3s Atualizar nas linhas.</li>\n<li><strong>Campo extra \"N\u00ba de contrato\" na fatura</strong> \u2192 Campo de utilizador na tabela FT + arrastar para p\u00e1gina de utilizador no ecr\u00e3 + valor por defeito.</li>\n<li><strong>Alerta de cr\u00e9dito excedido</strong> \u2192 Alerta de utilizador/<code>CriaAvs</code> no evento de grava\u00e7\u00e3o do documento + PHC Notify por e-mail.</li>\n<li><strong>An\u00e1lise de vendas por zona</strong> \u2192 An\u00e1lise de utilizador (SQL com join FT\u00d7CL\u00d7CL2) + filtro de utilizador; na gama Advanced, promover a <strong>An\u00e1lise Multidimensional</strong>.</li>\n<li><strong>Endpoint para loja online ler stock</strong> \u2192 PHC CS Web: <strong>Script</strong> por URL + (ou) sincroniza\u00e7\u00e3o <strong>EyePeak</strong>.</li>\n<li><strong>Assistente de IA para comerciais</strong> \u2192 Cegid Pulse: configurar assistente de neg\u00f3cio / Smart Tool com <code>PromptFunction()</code> (202601).</li>\n</ol>\n<h3>7.7 Boas pr\u00e1ticas de desenvolvimento PHC</h3>\n<ul>\n<li>Trabalhar sempre sobre <strong>clone da BD</strong> (detach/copy/attach) antes de personalizar em produ\u00e7\u00e3o.</li>\n<li><strong>Documentar cada personaliza\u00e7\u00e3o</strong> (onde, c\u00f3digo, motivo, vers\u00e3o) \u2014 os upgrades anuais obrigam a revalidar.</li>\n<li>Usar <strong>Dicion\u00e1rio de Dados</strong> para descobrir tabelas/rela\u00e7\u00f5es em vez de adivinhar nomes.</li>\n<li>Respeitar <code>stamp</code>/concorr\u00eancia otimista nas atualiza\u00e7\u00f5es por SQL; preferir a API de grava\u00e7\u00e3o da aplica\u00e7\u00e3o quando poss\u00edvel.</li>\n<li>Verificar a <strong>An\u00e1lise Interna</strong> (desktop) / <strong>Log de C\u00f3digo</strong> (web) ap\u00f3s cada altera\u00e7\u00e3o.</li>\n<li>N\u00e3o tocar em objetos certificados/fiscais sem validar SAF-T depois.</li>\n<li>Manter conven\u00e7\u00e3o de nomes nas entidades de utilizador (prefixo do parceiro/projeto).</li>\n</ul>\n<hr />\n<h2 id=\"cap-8\">8. Base de dados: estrutura e boas pr\u00e1ticas</h2>\n<h3>8.1 Conven\u00e7\u00f5es confirmadas</h3>\n<ul>\n<li><strong>SQL Server</strong> exclusivo (termos de licenciamento: 2008R2+; instala\u00e7\u00e3o t\u00edpica: 2012+; Express no Corporate).</li>\n<li><strong>Nomes de tabelas curtos (2 letras)</strong> + variantes numeradas para extens\u00f5es:</li>\n<li><code>CL</code> = Clientes; <code>CL2</code> = Clientes \u2013 Outros Dados (ex.: pa\u00eds da morada)</li>\n<li><code>FT</code> = Documentos de Fatura\u00e7\u00e3o (ex.: <code>ft.ndoc</code> = tipo de documento)</li>\n<li><code>BO</code> = Dossiers Internos</li>\n<li><code>RE</code> = Recibos</li>\n<li><code>TABOP</code> = Ordens de Fabrico (Manufactor)</li>\n<li>(as restantes \u2014 fornecedores, artigos/stocks, movimentos, C/C, tesouraria, pagamentos, compras \u2014 descobrem-se com o <strong>Dicion\u00e1rio de Dados</strong>, que mostra campos, descri\u00e7\u00f5es, tipos e rela\u00e7\u00f5es de qualquer tabela, ex.: pesquisar \"clientes\" ou \".CL\")</li>\n<li>Campos estruturais recorrentes: <strong><code>ref</code></strong> (identificador do registo), <strong><code>stamp</code></strong> (vers\u00e3o/concorr\u00eancia do registo \u2014 usado em snapshots com <code>#stamp#</code> e em navega\u00e7\u00e3o), <code>ndoc</code>/s\u00e9ries em documentos.</li>\n<li>Leituras pesadas com <code>WITH (NOLOCK)</code> (pr\u00e1tica comum nas an\u00e1lises/snapshots documentados pela PHC).</li>\n</ul>\n<h3>8.2 O Dicion\u00e1rio de Dados \u00e9 o seu melhor amigo</h3>\n<p>Dispon\u00edvel <strong>em todas as gamas</strong>: Supervisor \u2192 Tratamento da base de dados \u2192 Dicion\u00e1rio de dados (ou menu de op\u00e7\u00f5es de qualquer ecr\u00e3, ficando posicionado na tabela do ecr\u00e3). Mostra: campos, descri\u00e7\u00f5es, tipos, tamanhos e, desde a vers\u00e3o 2008, as <strong>express\u00f5es de rela\u00e7\u00e3o entre tabelas</strong> (duplo clique numa liga\u00e7\u00e3o salta para a tabela relacionada). Use-o para mapear qualquer processo antes de escrever SQL.</p>\n<h3>8.3 Dados por empresa e ciclo de vida</h3>\n<ul>\n<li>1 empresa = 1 BD; multiempresa = multiplas BDs no mesmo servidor.</li>\n<li><strong>Arquivo</strong>: passagem de dados antigos para BD de arquivo (performance + redu\u00e7\u00e3o do tamanho contratado nos planos 10 GB).</li>\n<li><strong>File Storage</strong>: anexos fora da BD (diretoria f\u00edsica) exceto fiscalmente relevantes.</li>\n</ul>\n<hr />\n<h2 id=\"cap-9\">9. Integra\u00e7\u00f5es e ecossistema</h2>\n<table>\n<thead>\n<tr>\n<th>Integra\u00e7\u00e3o</th>\n<th>O que faz</th>\n<th>Como se configura</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>EyePeak</strong></td>\n<td>Plataforma log\u00edstica/WMS/e-commerce (Cegid Primavera). Fluxos documentais ERP\u2194EyePeak (ex.: encomendas de fornecedor \u2192 guias; s\u00e9ries de fatura\u00e7\u00e3o sincronizadas)</td>\n<td>Monitor <strong>EyePeak Sincroniza\u00e7\u00e3o</strong> no menu Supervisor (desktop) / ecr\u00e3 Eye Peak Sincroniza\u00e7\u00e3o (web)</td>\n</tr>\n<tr>\n<td><strong>PHC CS Web / Front Web</strong></td>\n<td>Aplica\u00e7\u00f5es web sobre a mesma BD: Gest\u00e3o Web (fatura\u00e7\u00e3o, adiantamentos, recibos\u2026), Front Web (extranet para clientes/fornecedores consultarem documentos/dossiers)</td>\n<td>Package PHC CS Web; servidor IIS; utilizadores do desktop t\u00eam acesso</td>\n</tr>\n<tr>\n<td><strong>SaphetyDoc / Documentos Eletr\u00f3nicos</strong></td>\n<td>Fatura\u00e7\u00e3o eletr\u00f3nica (EDI, CIUS-PT) por webservice; c\u00f3digo EAN da empresa</td>\n<td>M\u00f3dulo Documentos Eletr\u00f3nicos + artigo oficial de configura\u00e7\u00e3o</td>\n</tr>\n<tr>\n<td><strong>Cegid Docs</strong></td>\n<td>Arquivo digital legal na cloud; faturas CIUS-PT anexadas em PDF e pr\u00e9-lan\u00e7adas; pesquisa na WebApp (Evolution)</td>\n<td>Configura\u00e7\u00e3o \"Arquivo Digital Legal com Cegid Docs\" (artigo oficial + FAQs)</td>\n</tr>\n<tr>\n<td><strong>Open Banking</strong></td>\n<td>Importa\u00e7\u00e3o de movimentos banc\u00e1rios, reconcilia\u00e7\u00e3o e previs\u00e3o de tesouraria (Evolution)</td>\n<td>Ativa\u00e7\u00e3o no plano Evolution; configura\u00e7\u00e3o de contas</td>\n</tr>\n<tr>\n<td><strong>SEPA / bancos</strong></td>\n<td>Ficheiros de d\u00e9bitos diretos e pagamentos; transfer\u00eancias de vencimentos; WebBanking</td>\n<td>Ecr\u00e3s de tesouraria/bancos + artigos oficiais</td>\n</tr>\n<tr>\n<td><strong>Multibanco / Unicre / PayPal</strong></td>\n<td>Refer\u00eancias MB, pagamentos online (web)</td>\n<td>M\u00f3dulos/par\u00e2metros pr\u00f3prios</td>\n</tr>\n<tr>\n<td><strong>SMS / e-mail (SMTP)</strong></td>\n<td>Envio de documentos e avisos (c\u00f3digo AT ao motorista, documentos por e-mail com idioma do cliente)</td>\n<td>M\u00f3dulo SMS; par\u00e2metros de envio de e-mail diretos por SMTP</td>\n</tr>\n<tr>\n<td><strong>TPA / POS / PDA</strong></td>\n<td>Terminais de pagamento, postos de retalho, terminais port\u00e1teis de stock</td>\n<td>Liga\u00e7\u00f5es/configura\u00e7\u00e3o POS e Stocks</td>\n</tr>\n<tr>\n<td><strong>Excel / ODBC</strong></td>\n<td>Importa\u00e7\u00e3o (c\u00e2mbios via ODBC, Excel para linhas), exporta\u00e7\u00e3o (xlsx/pdf)</td>\n<td>Nativo</td>\n</tr>\n<tr>\n<td><strong>Comunidade XML/B2B</strong></td>\n<td>Troca de documentos cliente-fornecedor em XML (eProcurement) \u2014 hist\u00f3rico da plataforma</td>\n<td>Documenta\u00e7\u00e3o da Comunidade</td>\n</tr>\n<tr>\n<td><strong>Cegid Pulse (IA)</strong></td>\n<td>Assistentes de neg\u00f3cio (comercial), Smart Tools configur\u00e1veis pelos parceiros, <code>PromptFunction()</code></td>\n<td>M\u00f3dulo Cegid Pulse + Cegid Account por utilizador (3 passos: acesso ao m\u00f3dulo, ativar Cegid Account na ficha, login)</td>\n</tr>\n<tr>\n<td><strong>Seguran\u00e7a Social Direta / AT</strong></td>\n<td>Comunica\u00e7\u00f5es oficiais (webservice AT, SSD com 2FA desde 05/2026)</td>\n<td>Par\u00e2metros + credenciais</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2 id=\"cap-10\">10. Opera\u00e7\u00e3o, suporte, diagn\u00f3stico e performance</h2>\n<h3>10.1 Diagn\u00f3stico (por onde come\u00e7ar quando algo falha)</h3>\n<ol>\n<li><strong>An\u00e1lise Interna</strong> \u2014 erros de eventos/c\u00f3digo Xbase do utilizador.</li>\n<li><strong>Log de C\u00f3digo</strong> (web) e <strong>Log de atividade</strong> (Enterprise v30+: quem consultou/alterou/apagou).</li>\n<li><strong>Hist\u00f3rico de utilizadores</strong> e tracking de a\u00e7\u00f5es.</li>\n<li><strong>Simulador de SQL / Explorador de dados</strong> \u2014 validar dados diretamente.</li>\n<li>Monitor de liga\u00e7\u00e3o ao SQL (quebras de rede), estado do ODBC.</li>\n<li>Documentos \"n\u00e3o processados\" \u2192 verificar <strong>processamento ass\u00edncrono</strong>.</li>\n<li>Impress\u00f5es bloqueadas \u2192 s\u00e9ries sem <strong>c\u00f3digo de valida\u00e7\u00e3o AT</strong> (ATCUD).</li>\n<li>SAF-T inv\u00e1lido \u2192 motivos de isen\u00e7\u00e3o fora de M01\u2013M99 com webservice ativo; tipos de documento mal mapeados na s\u00e9rie.</li>\n</ol>\n<h3>10.2 Performance</h3>\n<ul>\n<li>Ecr\u00e3s em mem\u00f3ria; desligar \"mostrar \u00faltimo registo ao arrancar\";</li>\n<li>\u00cdndices de utilizador (INCLUDED COLUMNS) para as consultas mais usadas;</li>\n<li>Desfragmenta\u00e7\u00e3o das tabelas principais + manuten\u00e7\u00e3o SQL;</li>\n<li>BD de arquivo para hist\u00f3ricos; File Storage para anexos;</li>\n<li>NOLOCK em leituras anal\u00edticas; snapshots bem desenhados;</li>\n<li>Monitorizar espa\u00e7o da BD (limites de plano).</li>\n</ul>\n<h3>10.3 Upgrades e migra\u00e7\u00f5es</h3>\n<ul>\n<li>Upgrade de vers\u00e3o: backup \u2192 ambiente de teste (clone) \u2192 upgrade \u2192 validar personaliza\u00e7\u00f5es (campos, regras, eventos, an\u00e1lises, templates de impress\u00e3o, integra\u00e7\u00f5es) \u2192 agendar produ\u00e7\u00e3o.</li>\n<li>Migra\u00e7\u00e3o <strong>PHC CS perp\u00e9tuo \u2192 Cegid PHC Evolution</strong>: diagn\u00f3stico, plano (escolher plano/m\u00f3dulos), migra\u00e7\u00e3o t\u00e9cnica (dados, configura\u00e7\u00f5es, integra\u00e7\u00f5es), suporte p\u00f3s-arranque \u2014 \u00e9 o processo standard dos parceiros; desenvolvimentos/addons existentes mant\u00eam-se.</li>\n</ul>\n<hr />\n<h2 id=\"cap-11\">11. Forma\u00e7\u00e3o, certifica\u00e7\u00e3o e recursos oficiais</h2>\n<h3>11.1 O que existe oficialmente</h3>\n<table>\n<thead>\n<tr>\n<th>Recurso</th>\n<th>O que \u00e9</th>\n<th>Acesso</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Help Center (helpcenter.phccs.net / phc.pt/portal)</strong></td>\n<td>Manuais completos (Gest\u00e3o, Stocks, Fatura\u00e7\u00e3o, Framework, Web\u2026), artigos \"como fazer\", Novidades por vers\u00e3o</td>\n<td><strong>P\u00fablico</strong></td>\n</tr>\n<tr>\n<td><strong>Manuais dentro da aplica\u00e7\u00e3o</strong></td>\n<td>Bot\u00e3o \"Ajuda\" em cada ecr\u00e3 \u2014 manuais atualizados com novas funcionalidades</td>\n<td>Instalado</td>\n</tr>\n<tr>\n<td><strong>Comunidade PHC (community.phcsoftware.com)</strong></td>\n<td>\u00c1rea t\u00e9cnica e comercial: not\u00edcias, ficheiros, downloads, documenta\u00e7\u00e3o de parceiro</td>\n<td>Login <strong>N\u00ba Cliente + ID T\u00e9cnico + password</strong></td>\n</tr>\n<tr>\n<td><strong>PHC On (on.phc.pt)</strong></td>\n<td>Forma\u00e7\u00e3o online, autoforma\u00e7\u00e3o em v\u00eddeo, truques e dicas, novidades, Calend\u00e1rio PHC de obriga\u00e7\u00f5es legais</td>\n<td>Acordo PHC On</td>\n</tr>\n<tr>\n<td><strong>Cegid Academy \u2014 PEP (Cegid PHC Evolution Program)</strong></td>\n<td>Programa intensivo pr\u00e1tico de <strong>140 h</strong>, online p\u00f3s-laboral (edi\u00e7\u00e3o com in\u00edcio a 17 de setembro; 1.650 \u20ac + IVA, pagamento faseado): configurar/administrar software e ambientes t\u00e9cnicos, BD e SQL (performance e seguran\u00e7a), processos e m\u00f3dulos do ERP (gest\u00e3o, tesouraria, contabilidade, vencimentos). Certifica\u00e7\u00e3o oficial Cegid PHC; os primeiros certificados podem integrar projetos do ecossistema</td>\n<td>Inscri\u00e7\u00e3o via phcsoftware.com/pt/formacao-pep</td>\n</tr>\n<tr>\n<td><strong>Certifica\u00e7\u00f5es PHC (hist\u00f3rico/atuais)</strong></td>\n<td>Certifica\u00e7\u00e3o PHC CS Desktop Corporate/Advanced/Enterprise + por m\u00f3dulos; \"bolsa de t\u00e9cnicos certificados\"; pr\u00e9-requisito para n\u00edveis de parceiro</td>\n<td>Via parceiro/Cegid</td>\n</tr>\n<tr>\n<td><strong>Microcredencia\u00e7\u00e3o IPT</strong></td>\n<td>Curso acad\u00e9mico \"Software Cegid PHC CS Advanced\" (Instituto Polit\u00e9cnico de Tomar)</td>\n<td>portal2.ipt.pt</td>\n</tr>\n<tr>\n<td><strong>PHC Hi, Tech</strong></td>\n<td>Forma\u00e7\u00e3o de 3 meses (h\u00edbrida) para entrada na carreira (ex.: Angola)</td>\n<td>phcsoftware.com/ao</td>\n</tr>\n<tr>\n<td><strong>Eventos de programadores</strong></td>\n<td>\"Coding PHC\" (evento anual de developers das frameworks) e hist\u00f3rico DevSummit</td>\n<td>Comunidade/site</td>\n</tr>\n<tr>\n<td><strong>YouTube (@SoftwarePHC) e blog</strong></td>\n<td>V\u00eddeos de produto, webinars, artigos</td>\n<td>P\u00fablico</td>\n</tr>\n<tr>\n<td><strong>Listagens de Novidades (PDF)</strong></td>\n<td>Por vers\u00e3o (v18\u2026v30, 202501, 202601\u2026) \u2014 os parceiros publicam (Arentia, Winsig, NSoft\u2026)</td>\n<td>P\u00fablico</td>\n</tr>\n<tr>\n<td><strong>Programa de Parceiros</strong></td>\n<td>Venda/implementa\u00e7\u00e3o exclusivamente via parceiros certificados (com especializa\u00e7\u00f5es setoriais); acesso a demos, NFR, forma\u00e7\u00e3o cont\u00ednua</td>\n<td>phcsoftware.com/pt/parceiros</td>\n</tr>\n</tbody>\n</table>\n<h3>11.2 O programa oficial da Certifica\u00e7\u00e3o PHC CS Desktop Advanced (o curr\u00edculo do expert)</h3>\n<p>Resumo fiel do conte\u00fado program\u00e1tico oficial \u2014 use-o como \u00edndice de estudo:</p>\n<ol>\n<li><strong>Plataforma client/server</strong>: caracter\u00edsticas da BD e performance; limites de GB; instala\u00e7\u00e3o (SQL Express; requisitos m\u00ednimos; HCL); passos de instala\u00e7\u00e3o; utilizadores/logins SQL; detach/attach; seguran\u00e7a; backups e recupera\u00e7\u00e3o.</li>\n<li><strong>Instala\u00e7\u00e3o do PHC Desktop</strong>: exe \u00fanico; instala\u00e7\u00e3o + attach + ODBC autom\u00e1tico; utilizadores e grupos; acessos; toolbars; barra de status estendida; barra de janelas; ecr\u00e3s em mem\u00f3ria; ecr\u00e3s personalizados; campos obrigat\u00f3rios; an\u00e1lise multidimensional; BD de arquivo; <strong>regras, campos de utilizador, valores por defeito e teclas de utilizador</strong>; painel de ecr\u00e3; Enciclop\u00e9dia PHC.</li>\n<li><strong>Navega\u00e7\u00e3o</strong>: organiza\u00e7\u00e3o de ecr\u00e3s e menus; l\u00f3gica de funcionamento; mapas definidos e filtros.</li>\n<li><strong>Gest\u00e3o \u2014 ficheiros</strong>: Clientes/Fornecedores (sede/estabelecimentos, tipos de desconto, condi\u00e7\u00f5es de pagamento); Stocks e Servi\u00e7os (refer\u00eancias alternativas, compostos, invent\u00e1rio f\u00edsico, <strong>PCMP</strong>, promo\u00e7\u00f5es, tabelas de pre\u00e7os com validade).</li>\n<li><strong>Gest\u00e3o \u2014 circuito documental</strong>: DI \u2194 Faturas/Compras (encomendas de cliente/a fornecedor, comprar a encomenda, faturar a encomenda, c\u00f3pias); tabela de c\u00f3digos de C/C; c\u00f3digos de tesouraria; c\u00f3digos de movimentos de stock; configura\u00e7\u00e3o de documentos de fatura\u00e7\u00e3o.</li>\n<li><strong>Tesouraria</strong>: contas, extratos, movimentos, t\u00edtulos.</li>\n<li><strong>Painel de bordo</strong>: monitor de d\u00edvidas, saldo de C/C por idades, rankings, an\u00e1lises de DI.</li>\n<li><strong>RGPD</strong>: aviso legal, esquecimento, registo de tratamento.</li>\n<li><strong>Dossiers especiais</strong>: stock inicial, transfer\u00eancia de armaz\u00e9m, pre\u00e7os, aven\u00e7as, composi\u00e7\u00e3o/produ\u00e7\u00e3o.</li>\n<li><strong>PHC CS Web</strong>: conceito, aplica\u00e7\u00f5es, Front Web e Gest\u00e3o Web.</li>\n<li><strong>Configura\u00e7\u00e3o de documentos</strong> (conceitos, campos obrigat\u00f3rios, grupos, acessos a reimprimir/totalizar/anexar, gr\u00e1ficos, \"imprimir quando\").</li>\n<li><strong>Contabilidade</strong>: conceitos, par\u00e2metros, abertura de ano, contas, di\u00e1rios, <strong>documentos pr\u00e9-definidos (incl. na Gest\u00e3o)</strong>, movimentos, centros anal\u00edticos, apuramento IVA, declara\u00e7\u00e3o peri\u00f3dica, CEVMC, resultados, <strong>integra\u00e7\u00f5es Gest\u00e3o\u2192Contabilidade (configura\u00e7\u00e3o + opera\u00e7\u00e3o)</strong>, mapas de gest\u00e3o, BD pronta, PHC XL, taxonomia.</li>\n<li><strong>Imobilizado</strong> e <strong>Pessoal</strong> (vis\u00e3o geral operacional completa).</li>\n<li><strong>POS</strong> e <strong>Suporte</strong> (circuitos completos).</li>\n<li><strong>T\u00e9cnico</strong>: instala\u00e7\u00e3o do software e do SQL Server; manuten\u00e7\u00e3o manual de BDs; <strong>PHC ON</strong>; <strong>Framework PHC (3 partes)</strong>; \u00e1rea t\u00e9cnica e comercial da <strong>Comunidade PHC</strong>.</li>\n<li><strong>Implementing SQL</strong> (labs) e prepara\u00e7\u00e3o de demonstra\u00e7\u00f5es.</li>\n</ol>\n<hr />\n<h2 id=\"cap-12\">12. Plano de estudos at\u00e9 ao n\u00edvel expert</h2>\n<h3>Fase 0 \u2014 Prepara\u00e7\u00e3o (semana 1)</h3>\n<ul>\n<li>[ ] Perceber o ecossistema (cap\u00edtulo 1): Evolution vs. GO vs. CS; planos vs. gamas; m\u00f3dulos.</li>\n<li>[ ] Ler as <strong>Novidades da vers\u00e3o atual</strong> (202601) e das 2\u20133 anteriores no Help Center.</li>\n<li>[ ] Criar contas/marcadores: Help Center, phcsoftware.com, YouTube @SoftwarePHC, blog, Comunidade PHC (se tiver credenciais de parceiro/cliente).</li>\n</ul>\n<h3>Fase 1 \u2014 Infraestrutura (semanas 2\u20133)</h3>\n<ul>\n<li>[ ] Montar laborat\u00f3rio: VM Windows Server + SQL Server Express + instala\u00e7\u00e3o de demonstra\u00e7\u00e3o do PHC (pedir a um parceiro ou usar licen\u00e7a NFR/eval da Cegid).</li>\n<li>[ ] Instalar, criar empresa de demo, fazer detach/attach, backup/restore, criar utilizadores/grupos/acessos.</li>\n<li>[ ] Atualizar o software; explorar o Supervisor e o Dicion\u00e1rio de Dados.</li>\n</ul>\n<h3>Fase 2 \u2014 Dom\u00ednio funcional do Gest\u00e3o (semanas 4\u20137)</h3>\n<ul>\n<li>[ ] Ficheiros: criar 20 clientes (com filiais, idiomas, zonas), 10 fornecedores, 50 artigos (fam\u00edlias, unidades alternativas, compostos/kits, lotes), armaz\u00e9ns, tabelas de pre\u00e7os, descontos, condi\u00e7\u00f5es/formas de pagamento, IVA.</li>\n<li>[ ] Vendas: configurar 5 s\u00e9ries (Fatura FT, Fatura Simplificada FS, Fatura-Recibo FR, Nota de Cr\u00e9dito NC, Guia tipo 4) e emitir o circuito completo: Or\u00e7amento \u2192 Encomenda \u2192 Guia (com comunica\u00e7\u00e3o de transporte simulada) \u2192 Fatura \u2192 Recibo \u2192 liquida\u00e7\u00e3o. Testar adiantamentos, reten\u00e7\u00e3o IRS, isen\u00e7\u00f5es (M08\u2026), vendas a dinheiro, emiss\u00e3o autom\u00e1tica.</li>\n<li>[ ] Compras: encomenda a fornecedor \u2192 rece\u00e7\u00e3o \u2192 fatura de compra \u2192 pagamento com aprova\u00e7\u00e3o; adiantamentos.</li>\n<li>[ ] Stocks: movimentos, transfer\u00eancia entre armaz\u00e9ns (dossier), contagem/invent\u00e1rio com acertos, an\u00e1lise de ruturas/m\u00e1x-m\u00edn, PCMP e valor de stock.</li>\n<li>[ ] Tesouraria: contas, extrato, reconcilia\u00e7\u00e3o, transfer\u00eancias, t\u00edtulos, previs\u00f5es; SEPA e refer\u00eancias MB (te\u00f3rico).</li>\n<li>[ ] C/C: aging, mailing, monitor de d\u00edvidas, incobr\u00e1veis.</li>\n<li>[ ] An\u00e1lises: mapas definidos, an\u00e1lises de utilizador (SQL), snapshot, ranking de vendas.</li>\n</ul>\n<h3>Fase 3 \u2014 Fiscalidade (semanas 8\u20139)</h3>\n<ul>\n<li>[ ] Exportar e validar <strong>SAF-T (PT)</strong> no validador da AT; inspecionar o XML (tipos de documento, motivos de isen\u00e7\u00e3o, MovementOfGoods).</li>\n<li>[ ] Simular o fluxo <strong>ATCUD/QR</strong>: comunica\u00e7\u00e3o de s\u00e9ries, c\u00f3digo de valida\u00e7\u00e3o, layouts, bloqueio de impress\u00e3o.</li>\n<li>[ ] Configurar comunica\u00e7\u00e3o de documentos de transporte (webservice vs. SAF-T resumido) e SMS ao motorista.</li>\n<li>[ ] Rever artigos oficiais: e-fatura, fatura\u00e7\u00e3o eletr\u00f3nica/SaphetyDoc/CIUS-PT, invent\u00e1rio \u00e0 AT, e-TaxFree, reten\u00e7\u00f5es, SDR 2026, RGPD.</li>\n<li>[ ] Integra\u00e7\u00e3o com Contabilidade: documentos pr\u00e9-definidos, contas de integra\u00e7\u00e3o, apuramento de IVA (lan\u00e7ar um m\u00eas completo).</li>\n</ul>\n<h3>Fase 4 \u2014 Desenvolvimento (semanas 10\u201314)</h3>\n<ul>\n<li>[ ] Estudar <strong>Xbase/VFP</strong> (sintaxe: comandos, cursores, fun\u00e7\u00f5es) e <strong>T-SQL</strong>.</li>\n<li>[ ] Framework desktop, por ordem: valores por defeito \u2192 campos de utilizador \u2192 regras (assistente e c\u00f3digo) \u2192 teclas \u2192 fun\u00e7\u00f5es de utilizador \u2192 alertas \u2192 instru\u00e7\u00f5es internas.</li>\n<li>[ ] Eventos: implementar os padr\u00f5es do \u00a77.6 (1\u20134) num clone; depurar com a An\u00e1lise Interna; usar <code>ObjRecebido</code> completo (Janela, Objecto, MeusDados, Return .F.).</li>\n<li>[ ] P\u00e1ginas/objetos de utilizador e <strong>IDUs</strong>: construir um ecr\u00e3 novo (ex.: \"Cr\u00e9dito do Cliente\" com dados de C/C + bot\u00f5es de a\u00e7\u00e3o) e lig\u00e1-lo a um menu.</li>\n<li>[ ] An\u00e1lises multidimensionais + snapshots com <code>#stamp#</code>; monitores.</li>\n<li>[ ] \u00cdndices de utilizador para otimizar as suas consultas; medir antes/depois.</li>\n<li>[ ] Framework <strong>Web (C#)</strong>: editor de c\u00f3digo, eventos, regras, <strong>scripts por URL</strong> (criar um endpoint de teste), monitores, templates.</li>\n<li>[ ] <strong>EyePeak</strong>: configurar o monitor de sincroniza\u00e7\u00e3o; desenhar um fluxo encomenda\u2192guia.</li>\n<li>[ ] <strong>Cegid Pulse</strong>: ativar (3 passos), explorar o assistente comercial, desenhar uma Smart Tool com <code>PromptFunction()</code>.</li>\n</ul>\n<h3>Fase 5 \u2014 N\u00edvel consultor/expert (semanas 15+)</h3>\n<ul>\n<li>[ ] Fazer o <strong>PEP (Cegid Academy)</strong> ou a certifica\u00e7\u00e3o PHC equivalente; entrar na bolsa de t\u00e9cnicos certificados.</li>\n<li>[ ] Implementar um ciclo completo num cliente real (ou demo avan\u00e7ada): diagn\u00f3stico \u2192 desenho \u2192 configura\u00e7\u00e3o \u2192 migra\u00e7\u00e3o de dados (importa\u00e7\u00e3o Excel/ODBC) \u2192 forma\u00e7\u00e3o \u2192 arranque \u2192 p\u00f3s-arranque.</li>\n<li>[ ] Dominar upgrades: fazer upgrade de vers\u00e3o ao laborat\u00f3rio validando todas as personaliza\u00e7\u00f5es.</li>\n<li>[ ] Especializar-se num vertical (retalho/POS, distribui\u00e7\u00e3o/log\u00edstica com EyePeak, servi\u00e7os/suporte, manufatura) \u2014 \u00e9 onde os parceiros monetizam.</li>\n<li>[ ] Acompanhar cada nova vers\u00e3o (202602\u2026) e o Calend\u00e1rio PHC de obriga\u00e7\u00f5es.</li>\n</ul>\n<h3>H\u00e1bitos do expert</h3>\n<ul>\n<li>Ler o <strong>manual in-app</strong> de cada ecr\u00e3 antes de responder a um ticket (a PHC documenta campo a campo).</li>\n<li>Usar o <strong>Dicion\u00e1rio de Dados</strong> para tudo o que envolva SQL.</li>\n<li>Testar sempre em <strong>clone</strong> antes de produ\u00e7\u00e3o.</li>\n<li>Documentar personaliza\u00e7\u00f5es num registo vivo (o upgrade anual agradece).</li>\n<li>Participar na <strong>Comunidade PHC</strong> e nos eventos <strong>Coding PHC</strong>.</li>\n</ul>\n<hr />\n<h2 id=\"cap-13\">13. Checklists de autoavalia\u00e7\u00e3o</h2>\n<p><strong>Funcional (Gest\u00e3o)</strong> \u2014 sabe fazer sem consultar?\n- [ ] Criar/configurar s\u00e9ries e tipos de documento e explicar o mapping SAF-T\n- [ ] Circuito completo venda (or\u00e7amento\u2192fatura\u2192recibo\u2192liquida\u00e7\u00e3o) e compra\n- [ ] Invent\u00e1rio f\u00edsico com acertos e valoriza\u00e7\u00e3o PCMP\n- [ ] Aging, mailing e monitor de cobran\u00e7as\n- [ ] Tesouraria real/previsional/or\u00e7amental e reconcilia\u00e7\u00e3o\n- [ ] Integra\u00e7\u00e3o Gest\u00e3o\u2192Contabilidade (documentos pr\u00e9-definidos, IVA)</p>\n<p><strong>Configura\u00e7\u00e3o</strong>\n- [ ] Par\u00e2metros gerais e de fatura\u00e7\u00e3o (os ~20 mais usados)\n- [ ] Utilizadores/grupos/perfis e acessos por opera\u00e7\u00e3o\n- [ ] Layouts de impress\u00e3o com QR/ATCUD\n- [ ] RGPD (aviso legal, esquecimento)</p>\n<p><strong>Fiscal</strong>\n- [ ] SAF-T fatura\u00e7\u00e3o + transporte (webservice e resumido)\n- [ ] ATCUD: comunica\u00e7\u00e3o de s\u00e9ries e c\u00f3digo de valida\u00e7\u00e3o\n- [ ] Motivos de isen\u00e7\u00e3o M01\u2013M99 e impacto do webservice\n- [ ] Reten\u00e7\u00f5es IRS/Imposto Selo; invent\u00e1rio \u00e0 AT; SDR 2026</p>\n<p><strong>Desenvolvimento</strong>\n- [ ] Escrever um evento Xbase com ObjRecebido e Return .F.\n- [ ] Criar campo/tabela/\u00edndice/regra de utilizador\n- [ ] Construir um IDU e lig\u00e1-lo a um menu\n- [ ] An\u00e1lise de utilizador + snapshot + an\u00e1lise multidimensional\n- [ ] Script web C# por URL; monitores\n- [ ] Sincroniza\u00e7\u00e3o EyePeak; PromptFunction/Cegid Pulse</p>\n<p><strong>Opera\u00e7\u00e3o</strong>\n- [ ] Instalar do zero (SQL + PHC + ODBC + licen\u00e7as)\n- [ ] Backup/restore, detach/attach, BD de arquivo\n- [ ] Diagnosticar com An\u00e1lise Interna / Log de C\u00f3digo / log de atividade\n- [ ] Upgrade de vers\u00e3o com valida\u00e7\u00e3o de personaliza\u00e7\u00f5es\n- [ ] Plano de performance (\u00edndices, desfragmenta\u00e7\u00e3o, par\u00e2metros)</p>\n<hr />\n<h2 id=\"cap-14\">14. Gloss\u00e1rio PHC</h2>\n<table>\n<thead>\n<tr>\n<th>Termo</th>\n<th>Significado</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Cegid PHC Evolution</strong></td>\n<td>ERP desktop+web sucessor do PHC CS (subscri\u00e7\u00e3o)</td>\n</tr>\n<tr>\n<td><strong>PHC CS</strong></td>\n<td>Nome hist\u00f3rico da plataforma (Client/Server)</td>\n</tr>\n<tr>\n<td><strong>Gamas</strong></td>\n<td>Corporate / Advanced / Enterprise (n\u00edveis funcionais)</td>\n</tr>\n<tr>\n<td><strong>Planos</strong></td>\n<td>Standard / Plus / Advanced / Premium / Ultimate (subscri\u00e7\u00e3o Evolution)</td>\n</tr>\n<tr>\n<td><strong>DI / Dossier Interno</strong></td>\n<td>Documento interno parametriz\u00e1vel (or\u00e7amentos, encomendas, folhas de obra\u2026) \u2014 tabela BO</td>\n</tr>\n<tr>\n<td><strong>FT</strong></td>\n<td>Documentos de Fatura\u00e7\u00e3o (tabela)</td>\n</tr>\n<tr>\n<td><strong>CL / CL2</strong></td>\n<td>Clientes / Clientes-Outros Dados (tabelas)</td>\n</tr>\n<tr>\n<td><strong>RE</strong></td>\n<td>Recibos (tabela)</td>\n</tr>\n<tr>\n<td><strong>ref / stamp</strong></td>\n<td>Identificador do registo / campo de vers\u00e3o-concorr\u00eancia</td>\n</tr>\n<tr>\n<td><strong>Xbase</strong></td>\n<td>Linguagem de personaliza\u00e7\u00e3o desktop (sintaxe VFP)</td>\n</tr>\n<tr>\n<td><strong>ObjRecebido</strong></td>\n<td>Objeto dispon\u00edvel nos eventos (Janela, Objecto, MeusDados)</td>\n</tr>\n<tr>\n<td><strong>IDU / Ecr\u00e3s Personalizados</strong></td>\n<td>Ecr\u00e3s desenhados pelo utilizador</td>\n</tr>\n<tr>\n<td><strong>Framework PHC</strong></td>\n<td>Conjunto de ferramentas de personaliza\u00e7\u00e3o (desktop e web)</td>\n</tr>\n<tr>\n<td><strong>Supervisor</strong></td>\n<td>Menu de administra\u00e7\u00e3o (framework, tratamento da BD, monitores)</td>\n</tr>\n<tr>\n<td><strong>PHC On</strong></td>\n<td>Acordo anual de atualiza\u00e7\u00f5es + portal de forma\u00e7\u00e3o/Calend\u00e1rio PHC</td>\n</tr>\n<tr>\n<td><strong>Comunidade PHC</strong></td>\n<td>Portal de parceiros/clientes (login N\u00ba Cliente + ID T\u00e9cnico)</td>\n</tr>\n<tr>\n<td><strong>Help Center</strong></td>\n<td>Manuais e artigos p\u00fablicos (helpcenter.phccs.net)</td>\n</tr>\n<tr>\n<td><strong>Dicion\u00e1rio de Dados</strong></td>\n<td>Consulta da estrutura/rela\u00e7\u00f5es de todas as tabelas</td>\n</tr>\n<tr>\n<td><strong>An\u00e1lise Interna</strong></td>\n<td>Log de erros do c\u00f3digo de utilizador (desktop)</td>\n</tr>\n<tr>\n<td><strong>SAF-T (PT)</strong></td>\n<td>Ficheiro de auditoria fiscal no var CARD_SESS={list:[],idx:0,rev:false,mode:""};
function cardSt(i){if(!S.cards[i])S.cards[i]={c:0,due:null};return S.cards[i]}
function dueCardsN(){var t=todayISO(),n=0;for(var i=0;i<DATA.cards.length;i++){var s=S.cards[i];if(s&&s.due&&s.due<=t&&s.c<CARD_TARGET)n++}return n}
function newCardsN(){var n=0;for(var i=0;i<DATA.cards.length;i++)if(!S.cards[i])n++;return n}
function startCards(mode){
  var list=[];
  if(mode==="due"){var t=todayISO();for(var i=0;i<DATA.cards.length;i++){var s=S.cards[i];if(s&&s.due&&s.due<=t&&s.c<CARD_TARGET)list.push(i)}}
  else if(mode==="new"){for(var j=0;j<DATA.cards.length&&list.length<20;j++)if(!S.cards[j])list.push(j)}
  else{var t2=todayISO();for(var k=0;k<DATA.cards.length;k++){var s2=S.cards[k];if(s2&&s2.due&&s2.due<=t2&&s2.c<CARD_TARGET)list.push(k)}
    for(var m=0;m<DATA.cards.length&&list.length<dueCardsN()+10;m++)if(!S.cards[m]&&list.indexOf(m)<0)list.push(m)}
  if(!list.length){MSG.info("Nenhuma carta para agora. Estude 'novas' ou volte amanhã!");return}
  CARD_SESS={list:list,idx:0,rev:false,mode:mode};renderTick();
}
function flipCard(){CARD_SESS.rev=true;renderTick()}
function rateCard(q){
  var gi=CARD_SESS.list[CARD_SESS.idx];
  mut(function(s){var c=cardSt(gi);var t=todayISO();
    if(q===0){c.due=addDays(t,1)}else if(q===1){c.due=addDays(t,2)}else{c.c++;c.due=addDays(t,LADDER[Math.min(c.c-1,LADDER.length-1)])}
    touchStreak();bumpDaily("cards")});
  CARD_SESS.idx++;CARD_SESS.rev=false;
  if(CARD_SESS.idx>=CARD_SESS.list.length){MascotBus.set("mood","cheer");say("Baralho do dia dominado! 🃏🚀","cheer",5000)}
  renderTick();
}

var QUIZ={lv:-1,ans:{}};
function startQuiz(lv){QUIZ={lv:lv,ans:{}};renderTick()}
function answerQ(qi,oi){
  if(QUIZ.ans[qi]!==undefined)return;
  QUIZ.ans[qi]=oi;
  var qz=null;for(var i=0;i<DATA.quizzes.length;i++)if(DATA.quizzes[i].lv===QUIZ.lv)qz=DATA.quizzes[i];
  var done=Object.keys(QUIZ.ans).length;
  if(qz&&done===qz.qs.length){
    var ok=0;for(var k in QUIZ.ans)if(QUIZ.ans[k]===qz.qs[k].a)ok++;
    var pct=Math.round(ok/qz.qs.length*100);
    mut(function(s){var prev=s.quiz[QUIZ.lv]||{best:0,passed:false,tries:0};
      s.quiz[QUIZ.lv]={best:Math.max(prev.best,pct),passed:prev.passed||pct>=80,tries:(prev.tries||0)+1};touchStreak()});
    if(pct>=80){MascotBus.set("mood","cheer");say("Aprovado! Nível concluído — avance com confiança.","cheer",7000)}
    else say("Abaixo de 80%: reveja os conceitos e refaça o teste.",7000);
  }
  renderTick();
}

async function gerarCursoIA(){
  WIZ.err=null;WIZ.gerando=true;renderTick();MascotBus.set("mood","think");
  try{
    var seg=segmentById(WIZ.segId);

    var usr="Crie um plano de curso personalizado para este aluno.\nPERFIL: interesses='"+(WIZ.interesses||"(não indicados)")+"'; objetivos="+JSON.stringify(WIZ.objetivos)+"; tempo/dia="+WIZ.minutos+" min; empresa-treino="+WIZ.nome+" (segmento: "+seg.nome+", "+seg.cidade+"); vende "+(WIZ.tipo==="ambos"?"produtos e serviços":WIZ.tipo)+"; dimensão "+WIZ.tam+".\nNECESSIDADES DO NEGÓCIO: "+seg.empresa.necessidades.join("; ")+".\nMISSÕES DISPONÍVEIS: "+ids+"\nResponda APENAS com JSON válido, sem texto à volta: {\"nota\":\"frase de foco do curso, máx 40 palavras\",\"destaques\":[\"L##\",... até 8 missões prioritárias para este negócio],\"ordem\":[\"L##\",... de 12 a 20 missões em sequência pedagógica]}";
    var out=await openAI([{role:"system",content:personaSys()},{role:"user",content:usr}],900);
    var jm=out.match(/\{[\s\S]*\}/);
    if(!jm)throw new Error("A IA não devolveu JSON — use o plano padrão.");
    var pl=JSON.parse(jm[0]);
    var valid={};DATA.labs.forEach(function(l){valid[l.id]=1});

    if(!pl.destaques.length)throw new Error("Destaques inválidos — use o plano padrão.");
    if(!pl.ordem.length)pl.ordem=pl.destaques;
    pl.nota=String(pl.nota||seg.plano.nota);pl.porIA=true;
    WIZ.plano=pl;
  }catch(e){WIZ.err=String(e.message||e)}
  WIZ.gerando=false;MascotBus.set("mood","idle");renderTick();
}

var DICT={q:"",tag:"Todos",open:{},ai:{},loading:null};
function DicionarioTab(){
  var _f=useStore();
  var tags=["Todos"];GLOSSARIO.forEach(function(g){if(tags.indexOf(g.tag)<0)tags.push(g.tag)});
  var q=DICT.q.toLowerCase();
  var list=GLOSSARIO.filter(function(g){

    var okQ=!q||g.t.toLowerCase().indexOf(q)>=0||g.d.toLowerCase().indexOf(q)>=0;
    return okT&&okQ});
  async function prof(term){
    var g=null;GLOSSARIO.forEach(function(x){if(x.t===term)g=x});
    DICT.loading=term;renderTick();MascotBus.set("mood","think");
    try{
      var out=await explainText("TERMO: "+g.t+" — "+g.d+(g.x?" DETALHE: "+g.x:""),"Dicionário: "+g.t);
      DICT.ai[term]=out;mut(function(s){s.stats.dict=(s.stats.dict||0)+1});
    }catch(e){DICT.ai[term]="⚠ "+String(e.message||e)}
    DICT.loading=null;MascotBus.set("mood","idle");renderTick();
    if(DICT.ai[term]&&S.settings.tts&&DICT.ai[term].indexOf("⚠")!==0)speak(DICT.ai[term]);
  }

          </Space>}>
          <p>{g.d}</p>
          {g.x?<div><Button size="small" type="link" style={{padding:0}} onClick={function(){DICT.open[g.t]=!DICT.open[g.t];renderTick()}}>{DICT.open[g.t]?"▲ ocultar detalhe":"▼ ver detalhe / na prática"}</Button>
            {DICT.open[g.t]?<Alert style={{marginTop:6}} type="info" message={g.x}/>:null}</div>:null}

function importTeam(ev){
  var files=ev.target.files;
  if(!files||!files.length)return;
  Array.prototype.forEach.call(files,function(f){
    var r=new FileReader();
    r.onload=function(){
      try{
        var o=JSON.parse(r.result);
        if(o&&o.app==="phc-trainer-pro"){
          mut(function(s){s.team=(s.team||[]).filter(function(x){return !(x.nome===o.nome&&x.data===o.data)});s.team.push(o);s.team.sort(function(a,b){return b.pct-a.pct})});
          MSG.success("Ficha importada: "+o.nome+" ("+o.pct+"%)");
        }else MSG.error("Ficheiro não é uma ficha de equipa: "+f.name);
      }catch(e){MSG.error("Inválido: "+f.name)}
    };
    r.readAsText(f);
  });
  ev.target.value="";
}

  if(cur.trim())out.push(cur);

function encContext(q){
  try{
    var low=String(q).toLowerCase();var out=[];var seen={};
    function tryMatch(list,tag){
      for(var i=0;i<list.length&&out.length<4;i++){
        var n=list[i][0]||"";var key=n.toLowerCase();
        if(key.length<4||seen[key])continue;
        var hit=low.indexOf(key)>=0;
        if(!hit){var bare=key.split(/[^a-z0-9_]+/);
          for(var j=0;j<bare.length;j++){if(bare[j].length>=5&&low.indexOf(bare[j])>=0){hit=true;break}}}
        if(hit){seen[key]=1;out.push(tag+" "+n+" — "+(list[i][1]||"(ver Enciclopédia)"))}
      }
    }
    tryMatch(ENC.funcoes,"[Função interna PHC]");
    tryMatch(ENC.vfp,"[Função Xbase]");
    return out.length?("REFERÊNCIAS DA ENCICLOPÉDIA PHC (use se relevante, cite como 'Enciclopédia PHC'):\n"+out.join("\n")):"";
  }catch(e){return ""}
}
function encSearchAll(q){
  var low=q.toLowerCase();var out=[];
  function scan(list,tag){
    for(var i=0;i<list.length;i++){
      var n=(list[i][0]||""),d=(list[i][1]||"");
      if(n.toLowerCase().indexOf(low)>=0||d.toLowerCase().indexOf(low)>=0){out.push({tag:tag,n:n,d:d})}
      if(out.length>=150)return;
    }
  }
  scan(ENC.funcoes,"Função PHC");scan(ENC.vfp,"Xbase");scan(ENC.dicas,"Dica");scan(ENC.erros,"Erro comum");
  scan(ENC.prog,"Programação");
  for(var m in ENC.artigos)scan(ENC.artigos[m].map(function(x){return [m+": "+x[0],x[1]]}),"Artigo");
  for(var s in ENC.manual){var t=ENC.manual[s];
    for(var k=0;k<t.length;k++){if(t[k].toLowerCase().indexOf(low)>=0){out.push({tag:"Manual · "+s,n:t[k],d:""})}if(out.length>=150)break}
    if(out.length>=150)break}

/* ============ v4.0 · Jornada guiada, Modo Foco, liberação progressiva ============ */
function journeyPath(){
  var base=(S.plan&&S.plan.ordem&&S.plan.ordem.length)?S.plan.ordem.slice():[];
  var seen={},out=[];
  base.forEach(function(id){if(!seen[id]&&labById(id)){seen[id]=1;out.push(id)}});
  DATA.labs.forEach(function(l){if(!seen[l.id]){seen[l.id]=1;out.push(l.id)}});
  return out;
}
function levelOpen(lv){
  if(S.settings.freeMode)return true;
  if(lv<=0)return true;
  var prev=DATA.labs.filter(function(l){return l.lv===lv-1});
  if(!prev.length)return true;
  var done=prev.filter(function(l){return S.labs[l.id]&&S.labs[l.id].c>0}).length;
  return done>=Math.ceil(prev.length*0.5);
}
function missionUnlocked(id){
  if(S.settings.freeMode)return true;
  var st=S.labs[id];if(st&&st.c>0)return true;
  var lab=labById(id);if(!lab)return false;
  if(!levelOpen(lab.lv))return false;
  var path=journeyPath().filter(function(x){var l=labById(x);return l&&l.lv===lab.lv});
  var i=path.indexOf(id);
  if(i<=0)return true;
  var ps=S.labs[path[i-1]];
  return !!(ps&&ps.c>0);
}
function bumpDaily(kind){
  var t=todayISO();
  if(!S.daily||S.daily.d!==t)S.daily={d:t,reps:0,cards:0,proofs:0,lessons:0};
  S.daily[kind]=(S.daily[kind]||0)+1;
}
function dailyToday(){
  var t=todayISO();
  return (S.daily&&S.daily.d===t)?S.daily:{reps:0,cards:0,proofs:0,lessons:0};
}
function xpTotal(){
  return totalReps()*10+labsMastered()*100+quizzesPassed()*50+(S.stats.lessons||0)*5+(S.stats.chats||0)*2+S.evid.length*2+cardsMastered()*3;
}

async function callProvider(id,messages,maxTokens,opts){
  var P=provById(id);if(!P){var e0=new Error("fornecedor desconhecido");e0.status=0;throw e0}
  var key=((P.keyf&&P.keyf())||"").trim();

    if(sys.length)gb.systemInstruction={parts:[{text:sys.join("\n")}]};

      {method:"POST",headers:{"x-goog-api-key":key,"Content-Type":"application/json"},body:JSON.stringify(gb)});

async function openAI(messages,maxTokens,opts){
  var order=providerOrder(opts);
  var tried=[],lastErr=null;
  for(var i=0;i<order.length;i++){
    var id=order[i];var P=provById(id);
    var key=P&&P.keyf?(P.keyf()||"").trim():"";
    if(!key&&!(id==="nvidia"&&hasProxy())){tried.push(id+"(sem chave)");continue}
    if(!provHealthy(id)){tried.push(id+"(em pausa)");continue}
    try{
      var out=await callProvider(id,messages,maxTokens,opts);
      if(!out){var ee=new Error("vazio");ee.status=0;throw ee}
      markOk(id);LAST_PROVIDER=id;
      return out;
    }catch(e){
      var st=(e&&e.status)||0;
      if(st===429){
        await new Promise(function(rs){setTimeout(rs,1600)});
        try{
          var out2=await callProvider(id,messages,maxTokens,opts);
          markOk(id);LAST_PROVIDER=id;return out2;
        }catch(e2){st=(e2&&e2.status)||0;e=e2}
      }
      markFail(id,st||599);
      lastErr=e;tried.push(id+"("+(st||"rede")+")");
    }
  }
  throw new Error("Todos os fornecedores falharam ["+(tried.join(", ")||"nenhum configurado")+"]. Adicione/verifique chaves em ⚙️ Definições. Último erro: "+((lastErr&&(lastErr.message||lastErr))||"?"));
}

  s+="## 3. columns of target tables\nselect table_name, column_name, data_type, character_maximum_length\nfrom information_schema.columns\nwhere table_name in ("+inList+")\norder by table_name, ordinal_position\n\n";
  s+="## 4. custom user columns (u_ prefix) on target tables\nselect table_name, column_name\nfrom information_schema.columns\nwhere table_name in ("+inList+") and column_name like 'u[_]%'\norder by table_name, column_name\n\n";
  s+="## 5. declared foreign keys (phc relations are usually logical via stamp - this may return zero rows)\nselect fk.name, tp.name as parent_table, cp.name as parent_col, tr.name as ref_table, cr.name as ref_col\nfrom sys.foreign_keys fk\njoin sys.foreign_key_columns fkc on fk.object_id = fkc.constraint_object_id\njoin sys.tables tp on fk.parent_object_id = tp.object_id\njoin sys.tables tr on fk.referenced_object_id = tr.object_id\njoin sys.columns cp on fkc.parent_object_id = cp.object_id and fkc.parent_column_id = cp.column_id\njoin sys.columns cr on fkc.referenced_object_id = cr.object_id and fkc.referenced_column_id = cr.column_id\nwhere tp.name in ("+inList+") or tr.name in ("+inList+")\n\n";
  s+="## 6. one sample row per target table\n";
  t.forEach(function(tb){s+="select top 1 * from "+tb.toLowerCase()+" with (nolock)\n"});
  s+="\n## 7. stored procedures and views (names)\nselect name from sys.procedures order by name\nselect table_name from information_schema.views order by table_name\n\n";
  s+="## 8. sql agent jobs (may fail without msdb permission - ignore the error if so)\nselect name from msdb.dbo.sysjobs order by name\n";
  return s;
}
function parseMeta(txt){
  var meta={conf:null,pend:[],estado:null,tabelas:[]};
  var src=String(txt);
  var m=src.match(/===META===([\s\S]*?)===FIM===/i);
  var blk=m?m[1]:src;
  var c=blk.match(/confian[çc]a\s*:\s*(\d{1,3})/i);
  if(c)meta.conf=Math.max(0,Math.min(100,parseInt(c[1],10)));
  var pd=blk.match(/pendentes\s*:\s*([^\n]*)/i);
  if(pd){meta.pend=pd[1].split("|").map(function(x){return x.replace(/^[\s\-\d\.\)]+/,"").trim()}).filter(function(x){return x&& !/^nenhum/i.test(x)})}
  var es=blk.match(/estado\s*:\s*(precisa_descoberta|pronto)/i);
  if(es)meta.estado=es[1].toLowerCase();
  var tb=blk.match(/tabelas\s*:\s*([^\n]*)/i);
  if(tb)meta.tabelas=tb[1].split(",").map(function(x){return x.trim().toLowerCase()}).filter(Boolean);
  if(!m){
    if(meta.conf===null){var c2=src.match(/confian[çc]a[^\d]{0,12}(\d{1,3})\s*%/i);if(c2)meta.conf=Math.max(0,Math.min(100,parseInt(c2[1],10)))}
    if(!meta.estado&&/preciso de descoberta/i.test(src))meta.estado="precisa_descoberta";
    else if(!meta.estado&&GEN.out)meta.estado="pronto";
  }
  return meta;
}

      d.style.cssText="position:fixed;top:0;left:0;right:0;z-index:9999;background:#0f2e1f;border-bottom:2px solid #3ddc84;color:#d9ffe9;font:14px 'Segoe UI',system-ui,sans-serif;padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;box-shadow:0 4px 18px rgba(0,0,0,.4)";
      var msg=document.createElement("span");
      msg.textContent=String(j.message||"🚀 Chegou o PHC Trainer Pro v6 — multiutilizador, com contas e equipas.");
      var a=document.createElement("a");
      a.href=String(j.url);
      a.textContent=String(j.cta||"Migrar agora →");
      a.style.cssText="background:#3ddc84;color:#06281a;padding:6px 14px;border-radius:8px;font-weight:700;text-decoration:none;white-space:nowrap";
      var x=document.createElement("button");
      x.textContent="✕";x.title="Fechar";
      x.style.cssText="background:transparent;border:1px solid #3ddc8455;color:#9fe8b8;border-radius:6px;padding:2px 8px;cursor:pointer";
      x.onclick=function(){d.remove();try{sessionStorage.setItem("phcMigBanner","1")}catch(e){}};
      d.appendChild(msg);d.appendChild(a);d.appendChild(x);
      var hidden=false;try{hidden=sessionStorage.getItem("phcMigBanner")==="1"}catch(e){}
      if(!hidden)document.body.appendChild(d);
    }).catch(function(){});
  }catch(e){}
})();
</script>
</body>
</html>
