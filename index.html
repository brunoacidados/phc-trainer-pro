var GLOSSARIO=[
{"t":"AT — Autoridade Tributária e Aduaneira","d":"O 'fisco' português: entidade que fiscaliza impostos, certifica software de faturação e recebe as comunicações (e-fatura, SAF-T, documentos de transporte).","tag":"Fiscal"},
{"t":"ATCUD — Código Único de Documento","d":"Código impresso em todas as faturas: código de validação da série (dado pela AT) + número sequencial. Ex.: ABC12345-6789. Vem acompanhado do QR Code.","x":"Desde 2021 é obrigatório. Sem o código de validação da série associado no PHC, o software bloqueia a impressão dos documentos. A série comunica-se à AT no Portal das Finanças antes de ser usada.","tag":"Fiscal"},
{"t":"SAF-T (PT) — Standard Audit File for Tax","d":"Ficheiro XML normalizado que 'fotografa' a atividade da empresa para auditoria fiscal. Existem 4 sabores: faturação, transportes (resumido), inventário e contabilidade.","x":"O SAF-T de faturação exporta-se mensalmente (substitui a comunicação e-fatura manual) e contém Header (nº certificado do software), Customer, Product e Invoice com totais por taxa de IVA, hashes e tipos FT/FS/FR/NC/ND. Valide sempre num validador antes de entregar.","tag":"Fiscal"},
{"t":"e-Fatura","d":"Sistema da AT que recebe as suas faturas (por webservice em tempo real ou via SAF-T mensal) para o consumidor pedir CPF na fatura e a AT cruzar dados.","tag":"Fiscal"},
{"t":"Software certificado pela AT","d":"Programas de faturação validados pela AT (nº de certificado impresso nos documentos). O PHC é certificado — por isso documentos emitidos não se apagam: anulam-se com motivo e corrigem-se com NC.","tag":"Fiscal"},
{"t":"Hash / assinatura digital qualificada","d":"Cada documento gera uma hash encadeada ao documento anterior da série: se alguém alterar um documento antigo, a cadeia quebra e a fraude deteta-se.","tag":"Fiscal"},
{"t":"QR Code em faturas","d":"Código bidimensional obrigatório nos documentos fiscalmente relevantes desde 2021: contém NIFs, valores por taxa, tipo de documento, ATCUD, hash, etc. Qualquer smartphone o lê.","tag":"Fiscal"},
{"t":"Documento de transporte (Guia de Remessa)","d":"Documento que acompanha mercadorias em circulação (tipo 4 na configuração de séries). Tem de indicar locais de carga/descarga, data e hora de início do transporte.","x":"Comunica-se à AT ANTES do transporte começar: por webservice (devolve o Cód. Ident. AT) ou por SAF-T (PT) resumido (elementos ShipFrom/ShipTo em MovementOfGoods). Na estrada, a fiscalização exige o código de identificação.","tag":"Fiscal"},
{"t":"Motivo de isenção (M01–M99)","d":"Código legal que justifica por que uma linha não tem IVA (ex.: M01 — isento art. 15.º; M08 — isento art. 9.º; M99 — não sujeito). Obrigatório no SAF-T quando há valores isentos.","x":"Com 'Método de envio de faturas' = Webservice, o PHC só deixa escolher códigos M01-M99 normalizados — motivos inventados pelo utilizador são avisados/rejeitados.","tag":"Fiscal"},
{"t":"Retenção na fonte (IRS/IRC)","d":"O cliente retém parte do pagamento e entrega ao Estado por conta do fornecedor (típico em serviços de profissionais liberais/sociedades). Na fatura aparece a taxa e o valor; a C/C fica pelo líquido.","tag":"Fiscal"},
{"t":"Imposto do Selo","d":"Imposto sobre operações específicas (crédito, juros, recibos de quitação com prazo, etc.), com verbas da Tabela Geral. Aparece em operações financeiras da tesouraria.","tag":"Fiscal"},
{"t":"IVA — Imposto sobre o Valor Acrescentado","d":"Imposto sobre o consumo: taxas de 23% (normal), 13% (intermédia) e 6% (reduzida) em Portugal continental (Açores/Madeira têm taxas próprias). Cobra-se nas vendas (liquidado) e recupera-se nas compras (dedutível).","tag":"Fiscal"},
{"t":"Reverse charge / autoliquidação","d":"Em operações intra-UE de serviços e certas vendas, o IVA é liquidado pelo CLIENTE no país dele: a fatura sai sem IVA com menção 'autoliquidação/reverse charge' (Diretiva 2006/112).","tag":"Fiscal"},
{"t":"Operação triangular (UE)","d":"Venda em cadeia entre 3 operadores de países UE diferentes com transporte direto do 1.º para o 3.º — regras de IVA próprias; o PHC tem campo próprio no documento.","tag":"Fiscal"},
{"t":"Intrastat","d":"Declaração estatística de trocas de bens intra-UE (acima de limiares definidos anualmente). Alimenta-se dos documentos de compra/venda intra-comunitários.","tag":"Fiscal"},
{"t":"Comunicação de inventário à AT","d":"Empresas acima de certo volume de negócios entregam até 31 de janeiro o inventário valorizado (ficheiro SAF-T/CSV/XML conforme regras). O PHC gera os formatos.","tag":"Fiscal"},
{"t":"CIUS-PT","d":"Especificação portuguesa de faturação eletrónica (Core Invoice Usage Specification da EN 16931): obrigatória na contratação pública. O PHC envia via webservices/plataformas (ex.: SaphetyDoc) e o Cegid Docs arquiva/pré-lança.","tag":"Fiscal"},
{"t":"SDR — Sistema de Depósito e Recolha","d":"Desde 10/04/2026: depósito de 0,10 € por embalagem de bebida de uso único (até 3 L), cobrado automaticamente na venda (configuração 202601+). O consumidor recupera-o devolvendo a embalagem.","tag":"Fiscal"},
{"t":"SII / TicketBAI (Espanha)","d":"Regimes fiscais espanhóis suportados pelo executável ES do PHC: SII (envio imediato de informação à AEAT) e TicketBAI (País Basco).","tag":"Fiscal"},
{"t":"RGPD","d":"Regulamento de proteção de dados: aviso legal, registo de tratamentos, direito ao esquecimento (anonimização preservando documentos fiscais) e histórico de acessos — ferramentas nativas do PHC.","tag":"Fiscal"},
{"t":"NIF / NIPC","d":"Número de Identificação Fiscal (11 = pessoa singular, 9 dígitos; empresas: 5XX XXX XXX com dígito de controlo mod-11). NIPC é o mesmo número para pessoas coletivas.","tag":"Fiscal"},
{"t":"CAE","d":"Código de Atividade Económica (ex.: 55110 hotéis, 47410 retalho de computadores): classifica a atividade da empresa — influencia obrigações fiscais e estatísticas.","tag":"Fiscal"},
{"t":"SNC / TOC(CC)","d":"Sistema de Normalização Contabilística (plano de contas português) e Técnico/Contabilista Certificado — o contabilista que recebe o seu SAF-T e integra a contabilidade.","tag":"Contabilidade"},
{"t":"CEVMC","d":"Custo das Existências Vendidas e das Mercadorias Consumidas: o 'custo do que vendeu' apurado na contabilidade (compras ± variação de existências), essencial para o resultado e o Modelo 22.","tag":"Contabilidade"},
{"t":"Modelo 22 / Modelo 30 / DMR","d":"Declarações fiscais: Modelo 22 (IRC anual), Modelo 30 (rendimentos pagos a não residentes), DMR (Declaração Mensal de Remunerações — trabalho). Saem dos módulos Contabilidade/Pessoal.","tag":"Contabilidade"},
{"t":"Declaração Periódica de IVA","d":"Declaração (mensal ou trimestral) do IVA liquidado menos dedutível, apurada na Contabilidade a partir dos documentos do Gestão.","tag":"Contabilidade"},
{"t":"Documento pré-definido","d":"Modelo de contabilização automática: mapeia cada tipo de documento do Gestão (fatura, compra, recibo) para lançamentos com contas SNC (21 clientes, 22 fornecedores, 24 IVA, 71/72 vendas…).","tag":"Contabilidade"},
{"t":"PCMP — Preço de Custo Médio Ponderado","d":"Método de custeio do stock: cada entrada valorizada recalcula o custo médio = (valor anterior + valor entrada) / (qty anterior + qty entrada). Valoriza saídas, margens e inventário.","x":"Se lançar compras a custo 0 'para despachar', destrói PCMP, margens e CEVMC. Confira o novo PCMP após entradas grandes.","tag":"Stocks"},
{"t":"Lote","d":"Subdivisão do stock com rastreabilidade (produção, validade): entradas e saídas referenciam o lote. Obrigatório em alimentar/farma; útil em qualquer perecível.","tag":"Stocks"},
{"t":"Número de série","d":"Identificador único por unidade física (com o módulo Equipamentos): eletrónica, máquinas, garantias. Cada saída fica associada ao nº de série vendido.","tag":"Stocks"},
{"t":"Stock cativo / pré-cativo","d":"Reservas de stock: cativo (comprometido, ex.: encomenda) e pré-cativo (indicativo). Reduzem a disponibilidade efetiva sem sair do armazém.","tag":"Stocks"},
{"t":"Ponto de encomenda","d":"Nível de stock que dispara a recomendação de compra (considera consumo e lead time do fornecedor). A análise 'a encomendar' usa-o.","tag":"Stocks"},
{"t":"Rutura de stock","d":"Artigo sem stock para vender = venda perdida. A análise de ruturas é o alerta vermelho do aprovisionamento.","tag":"Stocks"},
{"t":"Inventário físico / contagem","d":"Contagem real do armazém confrontada com o stock teórico; diferenças geram acertos automáticos (quebra = falta, sobra = excesso) que atualizam quantidades e valor.","tag":"Stocks"},
{"t":"Composto (Kit)","d":"Artigo formado por componentes (pack, refeição, conjunto): configura-se a composição e o comportamento na faturação/stock.","tag":"Stocks"},
{"t":"Unidade alternativa / factor de conversão","d":"Vender caixas de 10 unidades: a unidade alternativa + factor converte quantidades e preços entre unidade base e alternativa (com opção de inversão).","tag":"Stocks"},
{"t":"Referência alternativa","d":"Código do artigo na linguagem do cliente ou do fornecedor: digita-se o código deles e o PHC assume o artigo certo.","tag":"Stocks"},
{"t":"Armazém","d":"Local lógico de stock (principal, loja, trânsito, estaleiro). Todo o movimento tem armazém origem/destino; transferências usam dossier próprio.","tag":"Stocks"},
{"t":"Dossier Interno (DI)","d":"Documento não fiscal parametrizável (tabela BO): orçamentos, encomendas, propostas, folhas de obra, consignações, avenças, transferências, stock inicial. O 'rascunho estruturado' que se converte em faturas/compras.","x":"O circuito clássico: Orçamento → Encomenda → Guia → Fatura. Encomendas podem reservar stock; o fecho/estado controla pendentes. Aprovação formal de dossiers existe na gama Enterprise.","tag":"Documentos"},
{"t":"Série (de documentos)","d":"Configuração que dá identidade a um documento: tipo (1-5), mapping SAF-T, numeração e o que movimenta (stock, C/C, tesouraria). O objeto mais importante da faturação.","tag":"Documentos"},
{"t":"Tipos de documento (1-5)","d":"1/2/3 = fatura, fatura simplificada, fatura-recibo (e ND/NC via SAF-T); 4 = documento de transporte (guia); 5 = outro (proforma — não movimenta nada).","tag":"Documentos"},
{"t":"FT / FS / FR / ND / NC / GT","d":"Códigos SAF-T dos documentos: Fatura (FT), Fatura Simplificada (FS), Fatura-Recibo (FR), Nota de Débito (ND), Nota de Crédito (NC), Guia de Transporte (GT/GA/GC).","tag":"Documentos"},
{"t":"Fatura-recibo (FR)","d":"Fatura e recibo num só documento: emite-se e recebe-se no ato (típico de serviços pontuais/clínicas).","tag":"Documentos"},
{"t":"Nota de Crédito (NC)","d":"Documento que anula/devolve valor (ou stock) de uma fatura: total ou parcial. Exige Motivo de Retificação e referencia o documento original.","tag":"Documentos"},
{"t":"Nota de Débito (ND)","d":"Documento que acrescenta valor em falta a um cliente (juros, correções). Também exige motivo de retificação.","tag":"Documentos"},
{"t":"Proforma","d":"Documento tipo 5 sem valor fiscal (proposta formal de venda): não movimenta stock, C/C nem tesouraria.","tag":"Documentos"},
{"t":"Venda a dinheiro","d":"Venda de balcão a consumidor final com pagamento no ato (cliente genérico 'Consumidor Final', NIF 999999990 quando não é fornecido).","tag":"Documentos"},
{"t":"Data efetiva de entrega","d":"Data em que bens/serviços foram/serão disponibilizados ao adquirente — campo obrigatório por lei, comunicado no SAF-T.","tag":"Documentos"},
{"t":"Motivo de anulação","d":"Campo obrigatório ao anular um documento (a aplicação insiste até preencher). Documento anulado nunca desaparece — fica marcado para auditoria.","tag":"Documentos"},
{"t":"Avença","d":"Dossier de faturação recorrente (mensalidades, contratos, rendas): configura-se uma vez e o motor gera o documento de cada período.","tag":"Documentos"},
{"t":"Folha de obra","d":"DI que acumula trabalho de uma obra/intervenção (horas, materiais, subcontratos) para faturar por medições/fases — clássico da construção e oficinas.","tag":"Documentos"},
{"t":"Consignação","d":"Mercadoria entregue a terceiro para vender por conta do dono (não há faturação até a venda acontecer): DI próprio controla o stock à responsabilidade de terceiros.","tag":"Documentos"},
{"t":"Emissão automática de faturação","d":"Ecrã de preparação que fatura em lote (guias, encomendas, avenças) por período/cliente — poupa horas no fim do mês.","tag":"Documentos"},
{"t":"Conta corrente (C/C)","d":"O livro de dívidas/créditos por cliente ou fornecedor: movimentos tipificados (códigos de C/C), saldo corrente e saldo por idades.","tag":"Financeiro"},
{"t":"Aging / saldos por idades","d":"Distribuição da dívida por escalões de atraso (0-30, 31-60, 61-90, +90): O indicador de risco de crédito e o mapa de trabalho das cobranças.","tag":"Financeiro"},
{"t":"Liquidação","d":"Casar recibos/pagamentos com faturas (total ou parcial): o que sobra fica como saldo pendente no aging.","tag":"Financeiro"},
{"t":"Recibo de adiantamento","d":"Dinheiro recebido antes da fatura: fica como crédito na C/C e regulariza-se quando a fatura é emitida (pode gerar NC de retificação automática).","tag":"Financeiro"},
{"t":"Recibo incobrável","d":"Classificação de dívida perdida (com tratamento fiscal próprio) — encerra a cobrança ativa sem apagar o histórico.","tag":"Financeiro"},
{"t":"SEPA","d":"Zona Única de Pagamentos em Euros: ficheiros normalizados de débitos diretos (cobranças) e transferências (pagamentos) que o PHC gera para o banco.","tag":"Financeiro"},
{"t":"Referência Multibanco","d":"Entidade+referência gerada por documento/cliente para pagamento na rede MB — identificação automática do recebimento.","tag":"Financeiro"},
{"t":"Open banking","d":"No Evolution: ligação direta aos bancos para importar movimentos, acelerar reconciliações e melhorar previsões de tesouraria.","tag":"Financeiro"},
{"t":"Tesouraria real / previsional / orçamental","d":"Real = movimentos ocorridos; previsional = entradas/saídas esperadas (vencimentos, títulos, avenças); orçamental = plano aprovado. Comparar as três responde 'chega para os salários?'.","tag":"Financeiro"},
{"t":"Títulos (letras/cheques)","d":"Instrumentos de pagamento com data futura em carteira — entram na tesouraria previsional e têm circuito de cobrança/pagamento próprio.","tag":"Financeiro"},
{"t":"Reconciliação bancária","d":"Confrontar extracto do banco × movimentos do ERP, movimento a movimento: deteta omissões, duplicações e comissões não lançadas.","tag":"Financeiro"},
{"t":"Condição de pagamento","d":"Prazo/vencimento combinado (30 dias, 30/60/90, pronto pagamento) que alimenta C/C e tesouraria previsional.","tag":"Comercial"},
{"t":"Tabela de preços (com validades)","d":"Conjunto nomeado de preços (Revenda, Retalho, Promo) com início/fim de validade: o documento assume o preço válido na data para a tabela do cliente.","tag":"Comercial"},
{"t":"Rappel","d":"Desconto retroativo por volume atingido no período (cliente ou fornecedor): apura-se no fim e paga-se/emite-se por NC ou crédito.","tag":"Comercial"},
{"t":"Comissões","d":"Remuneração de vendedores configurável por vendedor, tipo de cliente ou família de artigos — sobre faturado ou cobrado (decisão política com impacto enorme).","tag":"Comercial"},
{"t":"Promoções e campanhas","d":"Descontos temporários por artigo/família com datas de validade (opções extra nas gamas Advanced/Enterprise).","tag":"Comercial"},
{"t":"Ficheiro (tabela)","d":"No vocabulário PHC, 'ficheiros' são as tabelas mestras: clientes, fornecedores, artigos (Stocks e Serviços), etc.","tag":"Plataforma"},
{"t":"Gama vs Plano","d":"Gama = nível funcional histórico (Corporate/Advanced/Enterprise); Plano = modelo de subscrição do Evolution (Standard→Ultimate). Juntos definem o que pode configurar/desenvolver.","tag":"Plataforma"},
{"t":"PHC On","d":"Acordo anual de atualizações (software + legislação) com portal de formação, truques e dicas e o Calendário PHC de obrigações legais.","tag":"Plataforma"},
{"t":"Comunidade PHC","d":"Portal de parceiros/clientes (community.phcsoftware.com): área técnica e comercial com login Nº Cliente + ID Técnico.","tag":"Plataforma"},
{"t":"Help Center","d":"Manuais e artigos oficiais públicos (helpcenter.phccs.net / phc.pt portal) + botão Ajuda dentro da aplicação — a fonte primária de verdade.","tag":"Plataforma"},
{"t":"ODBC / DSN","d":"Ponte standard entre a aplicação e o SQL Server; o instalador (exe único) cria o DSN. Metade dos problemas de ligação diagnosticam-se aqui.","tag":"Plataforma"},
{"t":"Empresa = base de dados","d":"Cada empresa PHC é uma BD SQL Server própria; multiempresa = várias BDs no mesmo servidor.","tag":"Plataforma"},
{"t":"Detach / Attach","d":"Desanexar/anexar BDs no SQL Server: a forma rápida de clonar ambientes para teste de upgrades e personalizações.","tag":"Plataforma"},
{"t":"stamp / ref","d":"Campos estruturais das tabelas PHC: ref identifica o registo; stamp marca a versão do registo (concorrência/navegação; aparece em snapshots como #stamp#).","tag":"Plataforma"},
{"t":"Dicionário de Dados","d":"Ferramenta (Supervisor → Tratamento da base de dados) que mostra campos, tipos e RELAÇÕES de qualquer tabela — o mapa do tesouro do programador PHC.","tag":"Dev"},
{"t":"Framework PHC","d":"Conjunto de ferramentas de personalização (Supervisor → Framework): campos/tabelas/índices/regras/eventos/funções de utilizador, IDUs, monitores, alertas — tudo gravado na BD.","tag":"Dev"},
{"t":"Xbase","d":"Linguagem de personalização do desktop (sintaxe Visual FoxPro): eventos, regras e funções de utilizador.","tag":"Dev"},
{"t":"ObjRecebido","d":"Objeto disponível nos eventos Xbase: .Janela (o ecrã), .Objecto (o objeto, com Value/Parent) e .MeusDados (repositório chave-valor entre eventos).","tag":"Dev"},
{"t":"Return .F.","d":"Num evento Xbase, cancela o comportamento padrão do objeto (a tecla não entra, o calendário não abre…). Em expressões não se usa Return.","tag":"Dev"},
{"t":"IDU / Ecrã personalizado","d":"Ecrã novo desenhado pelo utilizador (desenhador de ecrãs): campos, grelhas, botões com eventos — ligado a menus próprios.","tag":"Dev"},
{"t":"Análise Interna","d":"O log de erros do código de utilizador (desktop) — primeiro sítio a ver quando um evento 'não faz nada'. Na web chama-se Log de Código.","tag":"Dev"},
{"t":"Snapshot","d":"Consulta T-SQL contextualizada (variáveis como #stamp#) exibida em painéis: dados do registo em foco no ecrã.","tag":"Dev"},
{"t":"Análise de utilizador / multidimensional","d":"Consulta SQL do utilizador em grelha (Advanced+); promovível a multidimensional com drill-down por dimensões (ano→mês→cliente).","tag":"Dev"},
{"t":"Script (web) por URL","d":"Na framework web (C#): programa executado quando se chama um URL — endpoint leve para integrações (ex.: stock para a loja online).","tag":"Dev"},
{"t":"EyePeak","d":"Plataforma de logística/WMS/e-commerce (Cegid Primavera) que sincroniza com o PHC via monitor 'EyePeak Sincronização' (Supervisor).","tag":"Módulos"},
{"t":"Cegid Pulse","d":"Ecossistema de IA do Evolution (plano Plus+): assistentes de negócio, perguntas em linguagem natural e Smart Tools configuráveis (PromptFunction()).","tag":"Módulos"},
{"t":"Cegid Docs","d":"Gestão documental/arquivo digital legal na cloud: faturas CIUS-PT anexadas em PDF e pré-lançadas automaticamente (202601+).","tag":"Módulos"},
{"t":"PHC CS Web / Front Web","d":"Plataforma web sobre a mesma BD (Gestão Web, POS Web…) e extranet para clientes/fornecedores consultarem documentos e dossiers.","tag":"Módulos"},
{"t":"File Storage","d":"Armazenamento de anexos em diretoria física, na BD ou ambos (202501+); documentos fiscalmente relevantes ficam sempre na BD.","tag":"Plataforma"},
{"t":"Processamento assíncrono","d":"Parâmetro que grava/processa documentos em background: se algo inibir, o documento fica 'não processado' — estado a verificar em diagnósticos.","tag":"Plataforma"}
]

var CIRCUITOS=[
{"id":"vendas","ico":"🛒","t":"Ciclo de Vendas","d":"Do primeiro contacto ao dinheiro na conta: o circuito completo que sustenta 80% do uso diário do módulo Gestão.","slides":[
 {"i":"🗂️","t":"1. Ficheiros","d":"Cliente (NIF, condição de pagamento, tabela de preços, vendedor) e artigos (família, unidade, preço, stock mín/máx) criados e limpos. Lixo aqui = lixo em tudo.","tip":"Use o Ignios (Advanced+) para preencher clientes pelo NIF."},
 {"i":"📝","t":"2. Orçamento (DI)","d":"Proposta comercial sem efeito fiscal. Guarda preços/validade e serve de base à conversão. Tabela BO.","tip":"Dê ao orçamento uma série própria e numeração clara (ORC/2026/001)."},
 {"i":"📦","t":"3. Encomenda (DI)","d":"Cliente aceitou: converte o orçamento em encomenda. Pode reservar/cativar stock — visível na ficha do artigo como 'reservado'.","tip":"Nunca deixe linhas pendentes esquecidas: fecham stock cativo para sempre."},
 {"i":"🚚","t":"4. Guia de transporte (tipo 4)","d":"Mercadoria sai: guia com locais de carga/descarga, data/hora de início, matrícula e motorista. Comunicada à ANTES de circular (webservice ou SAF-T resumido).","tip":"Webservice devolve o Cód. Ident. AT — pode seguir por SMS ao motorista."},
 {"i":"🧾","t":"5. Fatura (FT)","d":"Fatura a guia (conversão): stock baixa em definitivo, C/C do cliente lança a dívida, acumulados atualizam. Entra no SAF-T e leva QR+ATCUD.","tip":"Confira os 3 efeitos: stock, C/C e ficha do cliente."},
 {"i":"💶","t":"6. Recibo (RE)","d":"Cliente paga: recibo liquida a fatura (total/parcial). Multibanco/SEPA/transferência identificam o recebimento.","tip":"Recibo sem liquidação = aging errado. Liquide sempre."},
 {"i":"📊","t":"7. Cobrança & análise","d":"Atrasou? Aging + monitor de dívidas + mailing. No fim: análises de vendas por zona/vendedor/família e margem.","tip":"Rotina semanal de cobranças vale mais que heróis no fim do mês."}]},
{"id":"compras","ico":"📦","t":"Ciclo de Compras","d":"Do aprovisionamento ao pagamento aprovado — onde se ganha margem (custo certo) e se evita rutura.","slides":[
 {"i":"📉","t":"1. Necessidade","d":"Análise de 'a encomendar'/ruturas ou necessidade da obra/produção dispara a compra. Ponto de encomenda bem calibrado = metade do trabalho.","tip":"Revista stocks máx/mín sazonalmente."},
 {"i":"📨","t":"2. Encomenda a fornecedor (DI)","d":"Cria a encomenda com preços combinados; o artigo mostra 'encomendado a fornecedor'. Receções parciais mantêm o remanescente.","tip":"Use a tabela de referências do fornecedor para importar os códigos dele."},
 {"i":"🏗️","t":"3. Receção (guia de entrada)","d":"Mercadoria chega: entrada por documento de compra/guia com conferência de quantidades e lotes (se aplicável).","tip":"Conferir na receção evita guerras de faturação depois."},
 {"i":"🧾","t":"4. Fatura de compra","d":"Regista a fatura do fornecedor (IVA dedutível, custos acessórios): o PCMP é recalculado — o custo médio do stock muda aqui.","tip":"Compreenda a fórmula do PCMP: erros de preço de compra propagam-se a todas as vendas."},
 {"i":"✅","t":"5. Aprovação de pagamento","d":"Circuito de aprovação (Enterprise: aprovação de dossiers) autoriza o pagamento — controlo interno de verdade.","tip":"Sem aprovação configurada, defina pelo menos acessos restritos a pagamentos."},
 {"i":"💸","t":"6. Pagamento","d":"Pagamento (transferência/SEPA) liquida a fatura na C/C do fornecedor; adiantamentos são regularizados aqui.","tip":"Guia de pagamento em lote SEPA poupa horas no fim do mês."}]},
{"id":"series","ico":"🧬","t":"Anatomia de uma Série de Documentos","d":"O objeto de configuração mais importante da faturação — 6 decisões que definem tudo.","slides":[
 {"i":"1️⃣","t":"Tipo (1-5)","d":"1/2/3 = fatura, simplificada, fatura-recibo (+ND/NC); 4 = transporte (guia); 5 = proforma. O tipo muda validações e obrigações.","tip":"Proforma (5) não movimenta nada — perfeita para propostas formais."},
 {"i":"2️⃣","t":"Mapping SAF-T","d":"FT/FS/FR/ND/NC/GT… diz à AT o que o documento é. Mapping errado invalida o ficheiro.","tip":"Confirme o mapping ao criar séries novas — sempre."},
 {"i":"3️⃣","t":"O que movimenta","d":"Stocks? Conta corrente? Tesouraria? Três interruptores com efeitos em cascata.","tip":"Guia (tipo 4) movimenta stock mas não C/C; fatura move os dois."},
 {"i":"4️⃣","t":"Numeração","d":"Sequência por série/ano — sequencial e cronológica por lei. Numeração partida = problema com a AT.","tip":"Não crie duas séries com o mesmo tipo+numeração para o mesmo fim."},
 {"i":"5️⃣","t":"ATCUD/validação","d":"Código de validação da série (dado pela AT) forma o ATCUD com o sequencial. Sem ele, a impressão é bloqueada.","tip":"Comunique séries novas à ANTES da primeira utilização (sobretudo em janeiro)."},
 {"i":"6️⃣","t":"Layout & impressão","d":"Template com QR+ATCUD, logótipo, 'imprimir quando', cópias e acessos de reimpressão.","tip":"Após upgrades, imprima um documento de teste e valide QR/ATCUD."}]},
{"id":"transporte","ico":"🚚","t":"Transporte de Mercadorias & AT","d":"O circuito que mais multas dá a quem o ignora: guias comunicadas antes de a mercadoria circular.","slides":[
 {"i":"📄","t":"1. Emitir a guia (tipo 4)","d":"Locais de carga/descarga (moradas da tabela), data e HORA de início do transporte, matrícula, motorista. Data efetiva de entrega nos documentos fiscais.","tip":"Valide o parâmetro 'Preenche e valida Local de Carga/Descarga' para não deixar campos vazios."},
 {"i":"📡","t":"2. Comunicar à AT","d":"Dois métodos: webservice em tempo real (devolve Cód. Ident. AT) ou SAF-T (PT) resumido (MovementOfGoods com ShipFrom/ShipTo).","tip":"Webservice = prova imediata; SAF-T resumido = útil sem ligação na hora."},
 {"i":"📲","t":"3. Código ao motorista","d":"Com série + módulo SMS configurados, o Cód. Ident. AT segue por SMS ao motorista automaticamente ao gravar.","tip":"Na estrada, a fiscalização pede o código — sem ele, coima."},
 {"i":"🔄","t":"4. Converter em fatura","d":"No fim, fatura-se a guia (ou várias guias numa fatura): 'Faturar este documento' ou emissão automática.","tip":"Guias faturadas ficam marcadas — evite faturação duplicada."},
 {"i":"↩️","t":"5. Devoluções","d":"Devolução de cliente: guia de devolução (GA) ou NC com reposição de stock conforme o caso.","tip":"NC que repõe stock exige série configurada para movimentar stocks."}]},
{"id":"saft","ico":"🏛️","t":"SAF-T & e-Fatura sem medo","d":"O ciclo mensal de conformidade: exportar, validar, entregar — e perceber o XML.","slides":[
 {"i":"📤","t":"1. Exportar","d":"Menu de exportação do SAF-T (PT) de faturação do mês: o ficheiro XML com Header, Customer, Product, Invoice.","tip":"Exporte para pasta própria por mês/ano (ex.: exports/saft_202609.xml)."},
 {"i":"🔍","t":"2. Inspecionar","d":"Abra o XML: DocumentType (FT/FS/FR/NC/ND), Hash, TaxExemptionReason (M01-M99), totais por taxa. Anulados não entram como ativos.","tip":"Procure os seus documentos de teste DO… ops, da sua empresa de treino — não os misture com produção."},
 {"i":"✅","t":"3. Validar","d":"Validador do Portal das Finanças (ou do contabilista): estrutura + regras. Erro comum: motivos de isenção inválidos e sequências partidas.","tip":"Valide SEMPRE antes de entregar — e após mudar séries/parâmetros."},
 {"i":"📨","t":"4. Entregar","d":"Submissão mensal no e-Fatura (ou o contabilista faz). Prazo: até dia 5 (regra geral — confirme o calendário atual).","tip":"O Calendário PHC (PHC On) lembra os prazos todos."},
 {"i":"🔐","t":"5. Integridade","d":"Hash encadeada por série + nº de certificado do software: alterar documentos emitidos quebra a cadeia — é detetável.","tip":"Nunca 'arranje' dados por SQL em documentos certificados; use NC/anulação."}]},
{"id":"cc","ico":"💰","t":"Conta Corrente & Cobranças","d":"Da fatura ao dinheiro: o ciclo que decide se a empresa sobrevive (lucro sem caixa não paga salários).","slides":[
 {"i":"📒","t":"1. Movimentos de C/C","d":"Faturas lançam dívida, recibos liquidam, adiantamentos creditam, juros/débitos ajustam — tudo tipificado por códigos de C/C.","tip":"Códigos de C/C bem desenhados = extractos que o cliente entende."},
 {"i":"⏳","t":"2. Aging","d":"Saldos por idades mostram ONDE está o atraso (0-30/31-60/61-90/+90). É o mapa das cobranças.","tip":"Foque nos escalões +60: é aí que a dívida morre."},
 {"i":"📣","t":"3. Aviso & contacto","d":"Mailing de C/C por documento + extracto de conta. Registe promessas de pagamento (nota/anexo).","tip":"Sem registo das interações, três colegas ligam ao mesmo cliente no mesmo dia."},

var SQL_RULES="REGRAS OBRIGATÓRIAS PARA TODO O CÓDIGO SQL (ditadas pelo responsável técnico do utilizador — cumprimento integral, sem exceções):\n1. SQL todo em minúsculas (select, from, where, insert, update, delete, join, group by, order by, etc.). Exceção: nomes de tabelas, campos e aliases mantêm a casing original da base de dados.\n2. Separar blocos lógicos com comentários ## (exemplo: ## get active clients).\n3. Comentários dentro do SQL em inglês.\n4. Dialecto padrão: SQL Server (T-SQL), salvo indicação em contrário.\n5. Sem CTEs, subqueries complexas ou window functions sem necessidade clara. Preferir joins diretos e queries simples.\n6. Não refatorar queries existentes: se pedirem alteração, mudar apenas o necessário e preservar a estrutura original.\n7. NUNCA inventar nomes de tabelas ou campos. Sem certeza da estrutura: perguntar ou indicar claramente o pressuposto.\n8. Em contexto PHC (st, bi, bo, fn, cl, etc.): respeitar a nomenclatura e estrutura padrão do PHC.\n9. Integração com sistemas legados: sem tipos modernos nem funções recentes do SQL Server (target: SQL Server 2014+).\n10. Sem formatação excessiva, indentação elaborada ou comentários óbvios. Sê direto.\n11. Em update/delete: incluir sempre where e, quando possível, mostrar o select equivalente primeiro para validação.\n12. 'Query completa' = bloco SQL inteiro pronto a executar; 'alteração cirúrgica' = apenas o trecho alterado.";
var DISCOVERY_SQL="## 1. list all user tables\nselect table_name\nfrom information_schema.tables\nwhere table_type = 'BASE TABLE'\norder by table_name\n\n## 2. columns of core gestao tables\nselect table_name, column_name, data_type\nfrom information_schema.columns\nwhere table_name in ('ft', 'cl', 'cl2', 'bo', 'bi', 're', 'st', 'fn')\norder by table_name, ordinal_position\n\n## 3. custom user columns (common prefix u_)\nselect table_name, column_name\nfrom information_schema.columns\nwhere column_name like 'u[_]%'\norder by table_name, column_name\n\n## 4. validate real values with one sample row each\nselect top 1 * from ft with (nolock)\nselect top 1 * from cl with (nolock)";
var GUIA_HTML="<h1>Guia Completo do T\u00e9cnico Expert \u2014 M\u00f3dulo Gest\u00e3o do Cegid PHC Evolution (Desktop)</h1>\n<blockquote>\n<p><strong>Objetivo:</strong> ser o documento de refer\u00eancia para dominar a 100% o m\u00f3dulo <strong>Gest\u00e3o</strong> do <strong>Cegid PHC Evolution / PHC CS Desktop</strong> \u2014 funcionalmente, na configura\u00e7\u00e3o, na fiscalidade e no desenvolvimento de solu\u00e7\u00f5es personalizadas.</p>\n<p><strong>Data da pesquisa:</strong> setembro de 2026. Vers\u00e3o de refer\u00eancia documentada: <strong>202601</strong> (a PHC passou de numera\u00e7\u00e3o \"v18\u2026v30\" para numera\u00e7\u00e3o por ano/edi\u00e7\u00e3o, ex.: 202501, 202504, 202601).</p>\n<p><strong>Nota importante:</strong> parte da documenta\u00e7\u00e3o profunda da PHC (Comunidade PHC, manuais internos, dicion\u00e1rio de dados completo, ferramentas de parceiro) exige credenciais de <strong>Cliente/Parceiro + ID T\u00e9cnico</strong>. Este guia mapeia tudo o que existe, indica onde est\u00e1 e como se acede, e cobre em detalhe o que \u00e9 p\u00fablico. Onde um detalhe fino depende da vers\u00e3o/gama/pa\u00eds, est\u00e1 assinalado para valida\u00e7\u00e3o no Help Center ou na aplica\u00e7\u00e3o.</p>\n</blockquote>\n<hr />\n<h2 id=\"cap-0\">\u00cdndice</h2>\n<ol>\n<li><a href=\"#cap-1\">O ecossistema Cegid PHC e o produto</a></li>\n<li><a href=\"#cap-2\">Arquitetura t\u00e9cnica da plataforma</a></li>\n<li><a href=\"#cap-3\">Instala\u00e7\u00e3o, infraestrutura e administra\u00e7\u00e3o</a></li>\n<li><a href=\"#cap-4\">M\u00f3dulo Gest\u00e3o \u2014 mapa funcional completo</a></li>\n<li><a href=\"#cap-5\">Configura\u00e7\u00e3o do m\u00f3dulo Gest\u00e3o (o dia-a-dia do t\u00e9cnico)</a></li>\n<li><a href=\"#cap-6\">Fiscalidade e obriga\u00e7\u00f5es legais (Portugal e outras geografias)</a></li>\n<li><a href=\"#cap-7\">Desenvolvimento e personaliza\u00e7\u00e3o (Framework PHC)</a></li>\n<li><a href=\"#cap-8\">Base de dados: estrutura e boas pr\u00e1ticas</a></li>\n<li><a href=\"#cap-9\">Integra\u00e7\u00f5es e ecossistema</a></li>\n<li><a href=\"#cap-10\">Opera\u00e7\u00e3o, suporte, diagn\u00f3stico e performance</a></li>\n<li><a href=\"#cap-11\">Forma\u00e7\u00e3o, certifica\u00e7\u00e3o e recursos oficiais</a></li>\n<li><a href=\"#cap-12\">Plano de estudos at\u00e9 ao n\u00edvel expert</a></li>\n<li><a href=\"#cap-13\">Checklists de autoavalia\u00e7\u00e3o</a></li>\n<li><a href=\"#cap-14\">Gloss\u00e1rio PHC</a></li>\n<li><a href=\"#cap-15\">Fontes e links de refer\u00eancia</a></li>\n</ol>\n<hr />\n<h2 id=\"cap-1\">1. O ecossistema Cegid PHC e o produto</h2>\n<h3>1.1 Hist\u00f3ria e contexto atual</h3>\n<ul>\n<li>A <strong>PHC Software</strong> (PHC Business Software) foi fundada em <strong>Portugal em 1989</strong> e tornou-se num dos ERPs de refer\u00eancia do mid-market portugu\u00eas, com forte presen\u00e7a nos PALOP (Angola, Mo\u00e7ambique, Cabo Verde), Espanha e Peru.</li>\n<li>Em <strong>janeiro de 2025</strong>, a <strong>Cegid</strong> (grupo franc\u00eas, dono tamb\u00e9m da Primavera BSS) adquiriu a PHC. Todos os produtos passam a chamar-se <strong>\"Cegid PHC\"</strong>.</li>\n<li>O produto desktop hist\u00f3rico chamava-se <strong>PHC CS</strong> (Client/Server). O <strong>Cegid PHC Evolution</strong> \u00e9 o <strong>sucessor direto do PHC CS</strong>: mesma plataforma, mesma base de dados, mesma framework \u2014 com modelo de <strong>subscri\u00e7\u00e3o</strong>, acesso <strong>web inclu\u00eddo</strong>, IA (<strong>Cegid Pulse</strong>), gest\u00e3o documental cloud (<strong>Cegid Docs</strong>) e <strong>open banking</strong>.</li>\n<li>O licenciamento <strong>perp\u00e9tuo do PHC CS foi descontinuado</strong>: clientes novos subscrevem o Evolution; clientes com PHC CS perp\u00e9tuo t\u00eam de planear migra\u00e7\u00e3o (que \u00e9, na pr\u00e1tica, uma evolu\u00e7\u00e3o da mesma instala\u00e7\u00e3o).</li>\n</ul>\n<h3>1.2 A fam\u00edlia de produtos Cegid PHC</h3>\n<table>\n<thead>\n<tr>\n<th>Produto</th>\n<th>O que \u00e9</th>\n<th>P\u00fablico</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Cegid PHC Evolution</strong></td>\n<td>ERP desktop + web (sucessor do PHC CS). Objeto deste guia.</td>\n<td>PME e mid-market</td>\n</tr>\n<tr>\n<td><strong>Cegid PHC GO</strong></td>\n<td>Gest\u00e3o 100% cloud nativa (SaaS), planos Corporate/Advanced/Enterprise</td>\n<td>Micro e pequenas empresas</td>\n</tr>\n<tr>\n<td><strong>Cegid Pulse</strong></td>\n<td>Ecossistema de agentes de IA integrado no ERP (assistente \"Cris\", assistentes de neg\u00f3cio, Smart Tools)</td>\n<td>Transversal (Evolution a partir do plano Plus)</td>\n</tr>\n<tr>\n<td><strong>Cegid Docs</strong></td>\n<td>Gest\u00e3o documental e arquivo digital legal na cloud, integrado no ERP</td>\n<td>Transversal</td>\n</tr>\n<tr>\n<td><strong>EyePeak (Cegid Primavera EyePeak)</strong></td>\n<td>Plataforma de log\u00edstica/WMS/e-commerce que sincroniza com o ERP PHC</td>\n<td>Log\u00edstica, retalho, B2B</td>\n</tr>\n<tr>\n<td><strong>PHC CS Web</strong></td>\n<td>Plataforma web do CS/Evolution (aplica\u00e7\u00f5es Gest\u00e3o Web, Front Web, POS Web, RH Web\u2026)</td>\n<td>Acesso remoto/browser</td>\n</tr>\n</tbody>\n</table>\n<h3>1.3 Cegid PHC Evolution: planos e gamas</h3>\n<p>O Evolution combina <strong>duas dimens\u00f5es</strong> que o t\u00e9cnico tem de distinguir bem:</p>\n<p><strong>a) Planos de subscri\u00e7\u00e3o (modelo comercial atual):</strong></p>\n<table>\n<thead>\n<tr>\n<th>Plano</th>\n<th>Utilizadores inclu\u00eddos</th>\n<th>Base de dados</th>\n<th>Acesso Web</th>\n<th>Cegid Pulse (IA)</th>\n<th>Capacidade de personaliza\u00e7\u00e3o</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Standard</td>\n<td>1</td>\n<td>10 GB</td>\n<td>\u2013</td>\n<td>\u2013</td>\n<td>Baixa</td>\n</tr>\n<tr>\n<td>Plus</td>\n<td>2</td>\n<td>10 GB</td>\n<td>\u2713</td>\n<td>\u2713</td>\n<td>Baixa</td>\n</tr>\n<tr>\n<td>Advanced</td>\n<td>3</td>\n<td>Ilimitada</td>\n<td>\u2713</td>\n<td>\u2713</td>\n<td>M\u00e9dia</td>\n</tr>\n<tr>\n<td>Premium</td>\n<td>3</td>\n<td>Ilimitada</td>\n<td>\u2713</td>\n<td>\u2713</td>\n<td>M\u00e9dia</td>\n</tr>\n<tr>\n<td>Ultimate</td>\n<td>5</td>\n<td>Ilimitada</td>\n<td>\u2713</td>\n<td>\u2713</td>\n<td>Alta</td>\n</tr>\n</tbody>\n</table>\n<p><strong>b) Gamas funcionais (heran\u00e7a PHC CS, ainda vis\u00edvel na documenta\u00e7\u00e3o e em funcionalidades):</strong></p>\n<ul>\n<li><strong>Corporate</strong> \u2014 micro e pequenas empresas. Funcionalidade essencial, sem ferramentas de personaliza\u00e7\u00e3o/an\u00e1lise avan\u00e7adas.</li>\n<li><strong>Advanced</strong> \u2014 PME. Acrescenta a capacidade de <strong>personalizar o software</strong> (campos/regras/filtros/eventos do utilizador, an\u00e1lises avan\u00e7adas, snapshots, workflow operacional, etc.).</li>\n<li><strong>Enterprise</strong> \u2014 topo de gama. Acrescenta, entre outros, <strong>Sistema de Aprova\u00e7\u00e3o de Dossiers</strong>, p\u00e1ginas/objetos de utilizador com eventos Xbase completos, log de atividade (v30+), e componentes \"Executive\" da framework.</li>\n</ul>\n<blockquote>\n<p>Consequ\u00eancia pr\u00e1tica: <strong>o que consegue configurar/desenvolver depende do plano + gama do cliente</strong>. Muitas ferramentas da Framework PHC s\u00f3 aparecem com par\u00e2metros ativos e gama Advanced/Enterprise. Verifique sempre isto primeiro num projeto.</p>\n</blockquote>\n<h3>1.4 M\u00f3dulos do ERP e onde o Gest\u00e3o se insere</h3>\n<p>O <strong>PHC Gest\u00e3o</strong> \u00e9 o m\u00f3dulo nuclear (comercial + financeiro operacional). O ecossistema de m\u00f3dulos que com ele interage:</p>\n<ul>\n<li><strong>Gest\u00e3o</strong> (clientes, fornecedores, stocks, fatura\u00e7\u00e3o, compras, tesouraria) \u2014 <em>este guia</em></li>\n<li><strong>Contabilidade</strong> (+ PHC XL para grandes volumes/centros anal\u00edticos)</li>\n<li><strong>Imobilizado</strong></li>\n<li><strong>Pessoal / Recursos Humanos</strong> (vencimentos)</li>\n<li><strong>POS / Retalho</strong> (POS Desktop, POS Front, POS Web, touch)</li>\n<li><strong>Suporte</strong> (assist\u00eancia t\u00e9cnica, contratos, instala\u00e7\u00f5es/equipamentos, PATs)</li>\n<li><strong>Manufactor</strong> (produ\u00e7\u00e3o: ordens de fabrico, opera\u00e7\u00f5es, centros de trabalho)</li>\n<li><strong>Obras</strong> e <strong>Ocupa\u00e7\u00e3o</strong> (setoriais)</li>\n<li><strong>Frota</strong> (viaturas), <strong>Equipamentos</strong> (n\u00fameros de s\u00e9rie), <strong>Ecovalor</strong> (taxas ecol\u00f3gicas)</li>\n<li><strong>SMS</strong>, <strong>Documentos Eletr\u00f3nicos</strong> (fatura\u00e7\u00e3o eletr\u00f3nica/EDI), <strong>Dashboard</strong>, <strong>Notify</strong> (alertas/notifica\u00e7\u00f5es)</li>\n<li><strong>PHC CS Web</strong> (Gest\u00e3o Web, Front Web \u2014 extranet de clientes/fornecedores)</li>\n<li><strong>Cegid Pulse</strong> (IA) e <strong>Cegid Docs</strong> (documental)</li>\n</ul>\n<p>O m\u00f3dulo Gest\u00e3o \u00e9 frequentemente designado na documenta\u00e7\u00e3o por <strong>\"PHC CS Gest\u00e3o desktop\"</strong> e tem um manual pr\u00f3prio no Help Center, complementado pelo manual do m\u00f3dulo <strong>Stocks</strong>.</p>\n<h3>1.5 Versionamento e o acordo PHC On</h3>\n<ul>\n<li>Hist\u00f3rico de vers\u00f5es: \u2026 v18, v19, v22, v25, v26, <strong>v27</strong> (QR Code + ATCUD, 2020/21), <strong>v28</strong> (2021), <strong>v29</strong> (2022), <strong>v30</strong> (2023; log de atividade Enterprise) e, depois, numera\u00e7\u00e3o anual: <strong>202401 \u2192 202501 \u2192 202504 \u2192 202601</strong>\u2026</li>\n<li>O <strong>PHC On</strong> \u00e9 o acordo anual de atualiza\u00e7\u00e3o: d\u00e1 direito a <strong>todas as vers\u00f5es e altera\u00e7\u00f5es legislativas durante um ano</strong>, acesso ao portal <code>on.phc.pt</code> com <strong>forma\u00e7\u00e3o online, autoforma\u00e7\u00e3o (filmes tem\u00e1ticos), truques e dicas, novidades exclusivas, motor de procura e o Calend\u00e1rio PHC</strong> (alertas de obriga\u00e7\u00f5es fiscais/laborais, sincronizado por webservice).</li>\n<li>Como t\u00e9cnico: <strong>manter o cliente atualizado \u00e9 requisito de conformidade fiscal</strong> (a AT exige vers\u00f5es atuais \u2014 houve comunica\u00e7\u00f5es oficiais do tipo \"apenas a vers\u00e3o X cumpre os requisitos da AT\"). As novidades de cada vers\u00e3o s\u00e3o publicadas na p\u00e1gina de Novidades do Help Center e em PDFs \"Listagem de Novidades\" (os parceiros publicam-nos, ex.: Arentia, Winsig, NSoft).</li>\n</ul>\n<h3>1.6 Geografias / execut\u00e1veis</h3>\n<p>A plataforma tem execut\u00e1veis e comportamentos espec\u00edficos por pa\u00eds: <strong>PT (Portugal), ES (Espanha \u2014 SII, TicketBAI, prov\u00edncias, documentos eletr\u00f3nicos), PE (Peru \u2014 reten\u00e7\u00f5es), US (English)</strong>, al\u00e9m de PT/AO/MZ/CV para as obriga\u00e7\u00f5es lus\u00f3fonas. Muitas configura\u00e7\u00f5es fiscais (reten\u00e7\u00f5es, comunica\u00e7\u00e3o \u00e0 AT) s\u00f3 fazem sentido no execut\u00e1vel PT. Confirme sempre qual o execut\u00e1vel e pa\u00eds da instala\u00e7\u00e3o.</p>\n<hr />\n<h2 id=\"cap-2\">2. Arquitetura t\u00e9cnica da plataforma</h2>\n<h3>2.1 Modelo geral</h3>\n<ul>\n<li><strong>Arquitetura client/server</strong>: cliente desktop rico (hist\u00f3rico em <strong>Visual FoxPro</strong>, com linguagem de personaliza\u00e7\u00e3o <strong>Xbase</strong>) + <strong>Microsoft SQL Server</strong> como base de dados.</li>\n<li>O acesso \u00e0 BD faz-se por <strong>ODBC</strong> \u2014 a instala\u00e7\u00e3o cria/configura automaticamente o DSN (o \"exe \u00fanico\" instala a aplica\u00e7\u00e3o, faz o <em>attach</em> da base de dados e cria o ODBC).</li>\n<li>A mesma base de dados serve o <strong>desktop</strong> e o <strong>PHC CS Web</strong> (plataforma web ASP.NET, personaliz\u00e1vel em <strong>C#</strong>), que partilha tabelas e framework.</li>\n<li><strong>Cada empresa = uma base de dados</strong> (instala\u00e7\u00f5es multiempresa usam v\u00e1rias BDs; h\u00e1 ferramentas de consolida\u00e7\u00e3o/arquivo).</li>\n<li>A aplica\u00e7\u00e3o \u00e9 tolerante a quebras de liga\u00e7\u00e3o ao SQL Server (existe monitor de liga\u00e7\u00e3o por inst\u00e2ncia de SQL).</li>\n</ul>\n<h3>2.2 Componentes e conceitos de plataforma</h3>\n<table>\n<thead>\n<tr>\n<th>Componente</th>\n<th>Descri\u00e7\u00e3o</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Execut\u00e1vel \u00fanico</strong></td>\n<td>Instalador que coloca aplica\u00e7\u00e3o + faz attach da BD + cria ODBC</td>\n</tr>\n<tr>\n<td><strong>Supervisor</strong></td>\n<td>Menu de administra\u00e7\u00e3o: Framework PHC, tratamento da base de dados (dicion\u00e1rio de dados, desfragmenta\u00e7\u00e3o), EyePeak Sincroniza\u00e7\u00e3o, monitores</td>\n</tr>\n<tr>\n<td><strong>Menu Sistema</strong></td>\n<td>Par\u00e2metros (gerais e por m\u00f3dulo), configura\u00e7\u00e3o da aplica\u00e7\u00e3o</td>\n</tr>\n<tr>\n<td><strong>Ecr\u00e3s em mem\u00f3ria</strong></td>\n<td>Par\u00e2metro de performance: ecr\u00e3s principais mant\u00eam-se em mem\u00f3ria ao fechar (reabertura instant\u00e2nea)</td>\n</tr>\n<tr>\n<td><strong>Processamento ass\u00edncrono</strong></td>\n<td>Par\u00e2metro \"Usa processamento ass\u00edncrono\" \u2014 grava\u00e7\u00e3o de documentos em background (o documento fica com flag de \"n\u00e3o processado\" at\u00e9 concluir)</td>\n</tr>\n<tr>\n<td><strong>File Storage</strong></td>\n<td>(202501+) Armazenamento de anexos em diretoria f\u00edsica, na BD ou em ambos; documentos fiscalmente relevantes ficam sempre na BD</td>\n</tr>\n<tr>\n<td><strong>Base de dados de Arquivo</strong></td>\n<td>Passagem de dados hist\u00f3ricos para BD de arquivo (performance)</td>\n</tr>\n<tr>\n<td><strong>Cegid Account</strong></td>\n<td>(202601+) Autentica\u00e7\u00e3o h\u00edbrida com contas Microsoft/Google, 2FA, ativa\u00e7\u00e3o por utilizador</td>\n</tr>\n<tr>\n<td><strong>Barra de status estendida / Painel central / Navegador</strong></td>\n<td>Componentes de UI configur\u00e1veis por par\u00e2metros (gamas superiores)</td>\n</tr>\n<tr>\n<td><strong>An\u00e1lise Interna</strong></td>\n<td>Registo de erros de execu\u00e7\u00e3o de c\u00f3digo do utilizador (eventos Xbase) \u2014 ferramenta de diagn\u00f3stico essencial</td>\n</tr>\n<tr>\n<td><strong>Log de C\u00f3digo</strong></td>\n<td>(Web) informa\u00e7\u00e3o de execu\u00e7\u00e3o do c\u00f3digo de utilizador (eventos, regras)</td>\n</tr>\n<tr>\n<td><strong>Log de atividade</strong></td>\n<td>(v30+, Enterprise) auditoria de consultas/altera\u00e7\u00f5es/apagamentos por utilizador</td>\n</tr>\n</tbody>\n</table>\n<h3>2.3 Requisitos de infraestrutura (refer\u00eancia)</h3>\n<ul>\n<li><strong>Servidor:</strong> Windows Server 2012 ou superior (validar sempre o Manual de Instala\u00e7\u00e3o da vers\u00e3o em causa \u2014 dispon\u00edvel na Comunidade PHC/Help Center).</li>\n<li><strong>Base de dados:</strong> Microsoft SQL Server 2012 ou superior (os termos de licenciamento indicam SQL Server 2008R2+ como m\u00ednimo hist\u00f3rico; na gama Corporate \u00e9 t\u00edpico usar <strong>SQL Server Express</strong>).</li>\n<li><strong>Clientes:</strong> Windows 10/11 (ou Windows Server para postos em Terminal Server/RemoteApp \u2014 suportado e comum).</li>\n<li><strong>Rede:</strong> o desktop liga por ODBC/SQL (porta 1433); o PHC CS Web requer IIS/servidor web + liga\u00e7\u00e3o \u00e0 mesma BD.</li>\n<li><strong>Hardware na HCL</strong> (Hardware Compatibility List) para impressoras de documentos, TPA, terminais port\u00e1teis/PDA, etc.</li>\n<li><strong>Licenciamento:</strong> por <strong>utilizador nomeado/concorrente</strong> conforme plano; subscri\u00e7\u00e3o anual no Evolution. A valida\u00e7\u00e3o \u00e9 feita por ficheiro de licen\u00e7as associado ao n\u00ba de cliente.</li>\n</ul>\n<h3>2.4 Seguran\u00e7a e RGPD (nativo da plataforma)</h3>\n<ul>\n<li><strong>Utilizadores e Grupos de utilizadores</strong> (ou <strong>Perfis</strong> \u2014 h\u00e1 um par\u00e2metro \"Defini\u00e7\u00e3o de tipos de acessos\": por Grupos ou por Perfis).</li>\n<li>Acessos por ecr\u00e3/opera\u00e7\u00e3o (consultar, introduzir, alterar, apagar, reimprimir, totalizar, anexar\u2026), <strong>acessos a par\u00e2metros por utilizador</strong>, e controlo de programas execut\u00e1veis a que cada grupo acede.</li>\n<li><strong>RGPD:</strong> aviso legal configur\u00e1vel, registo do tratamento de dados, <strong>processamento de dados pessoais (direito ao esquecimento/anonimiza\u00e7\u00e3o)</strong>, hist\u00f3rico de utilizadores.</li>\n<li><strong>Hist\u00f3rico/Tracking de a\u00e7\u00f5es</strong> e <strong>log de atividade</strong> (Enterprise) para auditoria.</li>\n</ul>\n<hr />\n<h2 id=\"cap-3\">3. Instala\u00e7\u00e3o, infraestrutura e administra\u00e7\u00e3o</h2>\n<blockquote>\n<p>Este cap\u00edtulo segue de perto o programa oficial da <strong>Certifica\u00e7\u00e3o PHC CS Desktop</strong> \u2014 \u00e9 exatamente isto que a PHC considera o n\u00facleo t\u00e9cnico da fun\u00e7\u00e3o.</p>\n</blockquote>\n<h3>3.1 Instala\u00e7\u00e3o passo-a-passo (vis\u00e3o de certifica\u00e7\u00e3o)</h3>\n<ol>\n<li><strong>Preparar o servidor</strong>: Windows Server suportado, verificar HCL, antiv\u00edrus/firewall (exce\u00e7\u00f5es para SQL e para a pasta da aplica\u00e7\u00e3o).</li>\n<li><strong>Instalar o SQL Server</strong> (ou SQL Express na gama Corporate): inst\u00e2ncia, modo de autentica\u00e7\u00e3o misto, protocolos TCP/IP ativos, collation recomendada pela PHC.</li>\n<li><strong>Instalar o PHC</strong> com o execut\u00e1vel \u00fanico: o instalador trata da BD (cria\u00e7\u00e3o/attach), do ODBC e dos atalhos.</li>\n<li><strong>Criar/registar a empresa</strong> (base de dados) e aplicar a <strong>licen\u00e7a</strong> (n\u00ba de cliente + plano/gama + m\u00f3dulos).</li>\n<li><strong>Criar utilizadores e logins</strong> (SQL + aplica\u00e7\u00e3o), configurar grupos/perfis e acessos.</li>\n<li><strong>Configurar par\u00e2metros</strong> gerais e do m\u00f3dulo (ver cap\u00edtulo 5).</li>\n<li><strong>Backups</strong>: plano de backups do SQL (full + logs), testar restauro; usar tamb\u00e9m as rotinas de \"Backup de Base de Dados\" da aplica\u00e7\u00e3o.</li>\n<li><strong>Atualiza\u00e7\u00f5es</strong>: procedimento de upgrade de vers\u00e3o (sempre com backup pr\u00e9vio, em hor\u00e1rio sem utilizadores; validar personaliza\u00e7\u00f5es ap\u00f3s upgrade).</li>\n<li><strong>Postos de trabalho</strong>: instalar o cliente, apontar ao ODBC/servidor; em Terminal Server validar perfis Windows.</li>\n</ol>\n<h3>3.2 Manuten\u00e7\u00e3o da base de dados</h3>\n<ul>\n<li><strong>Detach/Attach</strong> de bases de dados (migra\u00e7\u00f5es, clones de teste).</li>\n<li><strong>Desfragmentar as Tabelas Principais</strong> (utilit\u00e1rio documentado no Help Center) + manuten\u00e7\u00e3o de \u00edndices do SQL (rebuild/reorganize, estat\u00edsticas).</li>\n<li><strong>Base de dados de arquivo</strong> para hist\u00f3ricos pesados.</li>\n<li><strong>\u00cdndices de utilizador</strong> (Framework PHC) \u2014 incluindo <em>INCLUDED COLUMNS</em> \u2014 para acelerar consultas personalizadas sem tocar no core.</li>\n<li><strong>Monitor de liga\u00e7\u00e3o</strong> ao SQL por inst\u00e2ncia (diagn\u00f3stico de quebras de rede).</li>\n<li><strong>Explorador de dados</strong> e <strong>Simulador de SQL</strong> (permite executar consultas \u00e0 BD a partir da aplica\u00e7\u00e3o, com vari\u00e1veis como <code>#stamp#</code>).</li>\n</ul>\n<h3>3.3 Rotina de sa\u00fade de uma instala\u00e7\u00e3o (checklist do t\u00e9cnico)</h3>\n<ul>\n<li>[ ] Vers\u00e3o do software e do PHC On atualizadas (conformidade AT)</li>\n<li>[ ] Backups autom\u00e1ticos + teste de restauro documentado</li>\n<li>[ ] Utilizadores nomeados, acessos m\u00ednimos necess\u00e1rios, passwords/2FA</li>\n<li>[ ] Par\u00e2metros de fatura\u00e7\u00e3o/s\u00e9ries revistos antes de cada viragem de ano (c\u00f3digos de valida\u00e7\u00e3o AT, ATCUD)</li>\n<li>[ ] Manuten\u00e7\u00e3o de \u00edndices/desfragmenta\u00e7\u00e3o agendada</li>\n<li>[ ] Espa\u00e7o em disco da BD vs. plano contratado (10 GB nos planos Standard/Plus)</li>\n<li>[ ] Personaliza\u00e7\u00f5es documentadas (c\u00f3digo Xbase/C#, regras, campos de utilizador) para sobreviverem a upgrades</li>\n<li>[ ] Liga\u00e7\u00f5es externas testadas: webservice AT, e-mail SMTP, EyePeak, Cegid Docs, open banking</li>\n</ul>\n<hr />\n<h2 id=\"cap-4\">4. M\u00f3dulo Gest\u00e3o \u2014 mapa funcional completo</h2>\n<h3>4.1 Ficheiros (dados mestres)</h3>\n<p><strong>Clientes (tabela CL + CL2 \"Outros Dados\")</strong>\n- N\u00ba de contribuinte com pa\u00eds associado; servi\u00e7o <strong>Ignios</strong> (Advanced+) preenche automaticamente nome/morada a partir do NIF.\n- <strong>Sede (0) e filiais/estabelecimentos (1\u2013999)</strong> \u2014 no\u00e7\u00e3o de estabelecimento vs. sede.\n- Campos: abreviatura, morada, localidade, c\u00f3digo postal (preenchimento autom\u00e1tico configur\u00e1vel), pa\u00eds, prov\u00edncia (ES), telefone/fax/e-mail/WWW/telem\u00f3vel (com envio de SMS via m\u00f3dulo SMS), contribuinte do representante, <strong>idioma</strong> (descri\u00e7\u00f5es de artigos em documentos), <strong>zona</strong> (campo de tabela do utilizador), tipo de cliente, classifica\u00e7\u00e3o de vendas, segmento, ref\u00aa interna, centro anal\u00edtico (XL), condi\u00e7\u00f5es de pagamento, forma de pagamento, descontos, tabela de pre\u00e7os, vendedor, limites de cr\u00e9dito\u2026\n- <strong>Inativos</strong>: deixam de aparecer em op\u00e7\u00f5es/documentos novos, mas mant\u00eam-se em an\u00e1lises e permitem faturar dossiers antigos.\n- Regras de integridade de documentos certificados: com documentos certificados emitidos, h\u00e1 campos que ficam bloqueados a altera\u00e7\u00f5es (ex.: n\u00e3o alterar NIF de cliente com documentos certificados; regras nome/morada/NIF).\n- Par\u00e2metro \"Quando altera dados do cliente, n\u00e3o atualiza tabelas relacionadas\" controla a propaga\u00e7\u00e3o de altera\u00e7\u00f5es a C/C, Documentos e Recibos.\n- <strong>Moradas de Carga e Descarga</strong> (tabela pr\u00f3pria) alimentam os campos \"Local de carga/descarga\" dos documentos de transporte (ShipFrom/ShipTo no SAF-T).</p>\n<p><strong>Fornecedores (FI)</strong> \u2014 estrutura an\u00e1loga \u00e0 de clientes; conta corrente de fornecedores, adiantamentos, aprova\u00e7\u00e3o de pagamentos, compras com/sem IVA, autofatura\u00e7\u00e3o.</p>\n<p><strong>Stocks e Servi\u00e7os (artigos)</strong> \u2014 manual pr\u00f3prio do m\u00f3dulo <strong>PHC CS Stocks desktop</strong>:\n- Ficheiro de refer\u00eancias com designa\u00e7\u00e3o (multi-idioma), fam\u00edlia, marca, unidade e <strong>unidade alternativa com factor de convers\u00e3o</strong> (e invers\u00e3o do factor), c\u00f3digo de barras/EAN, imagem.\n- <strong>Refer\u00eancias alternativas</strong> (mesmo artigo com v\u00e1rias refs de cliente/fornecedor), designa\u00e7\u00e3o do artigo por cliente/fornecedor (impress\u00e3o no idioma definido).\n- <strong>Compostos (Kits)</strong> \u2014 produtos compostos por componentes.\n- <strong>Grelha de cores e tamanhos</strong> (vestu\u00e1rio/cal\u00e7ado).\n- <strong>Lotes</strong> (rastreabilidade, validades) e <strong>n\u00fameros de s\u00e9rie</strong> (com o m\u00f3dulo Equipamentos).\n- Pre\u00e7os: pre\u00e7o de venda por tabela (com validades), pre\u00e7o de custo, <strong>PCMP \u2014 Pre\u00e7o de Custo M\u00e9dio Ponderado</strong> (m\u00e9todo de custeio usado no c\u00e1lculo do valor de stock), margens, contribui\u00e7\u00e3o.\n- Stocks: stock atual por armaz\u00e9m, reservado para cliente, encomendado a fornecedor, quantidade esperada, stock cativo e pr\u00e9-cativo, stock m\u00ednimo/m\u00e1ximo, ponto de encomenda, ruturas.\n- <strong>Ecovalor</strong> (m\u00f3dulo adicional) para taxas ecol\u00f3gicas.</p>\n<h3>4.2 Vendas e fatura\u00e7\u00e3o</h3>\n<ul>\n<li><strong>Documentos de Fatura\u00e7\u00e3o (tabela FT)</strong> configur\u00e1veis por <strong>s\u00e9rie</strong>: tipos de documento <strong>1, 2, 3</strong> (Fatura, Fatura Simplificada, Fatura-Recibo, Nota de D\u00e9bito, Nota de Cr\u00e9dito \u2014 mapeados para SAF-T como FT/FS/FR/ND/NC), <strong>tipo 4 = documento de transporte (Guia de Remessa)</strong> e <strong>tipo 5 = Outro (Proforma)</strong>.</li>\n<li>Cada s\u00e9rie define: o que movimenta (<strong>conta corrente, stocks, tesouraria</strong>), numera\u00e7\u00e3o, tipo para SAF-T, motivo de isen\u00e7\u00e3o nas linhas, valida\u00e7\u00e3o de locais de carga/descarga, envio de SMS ao motorista com o c\u00f3digo da AT, comunica\u00e7\u00e3o por webservice vs. ficheiro, etc.</li>\n<li>Emiss\u00e3o, altera\u00e7\u00e3o, anula\u00e7\u00e3o (<strong>documento anulado + motivo de anula\u00e7\u00e3o obrigat\u00f3rio</strong>), reimpress\u00e3o controlada por acessos, consulta e totais por m\u00faltiplos crit\u00e9rios.</li>\n<li><strong>Atualiza\u00e7\u00e3o autom\u00e1tica</strong> ao emitir: stocks (baixa de artigos), conta corrente (saldos, idades), ficha do cliente (fatura\u00e7\u00e3o acumulada).</li>\n<li><strong>Emiss\u00e3o autom\u00e1tica de fatura\u00e7\u00e3o</strong>: faturar em massa por c\u00f3pia de outros documentos ou de <strong>dossiers internos</strong> (guias, encomendas, propostas, folhas de obra) com ecr\u00e3 de prepara\u00e7\u00e3o/sele\u00e7\u00e3o.</li>\n<li><strong>Vendas a dinheiro</strong>, faturas-recibo, <strong>recibos de adiantamento</strong> e sua regulariza\u00e7\u00e3o (gera NC autom\u00e1tica com motivo de retifica\u00e7\u00e3o \"Retifica\u00e7\u00e3o de Fatura de Adiantamento\").</li>\n<li><strong>Reten\u00e7\u00e3o de IRS na fonte</strong> em documentos (taxa + valor de reten\u00e7\u00e3o; vis\u00edvel no mailing de C/C).</li>\n<li>Campos fiscais/operacionais do documento: classifica\u00e7\u00e3o de vendas, local de carga/descarga, idioma, data/hora de carga, <strong>data efetiva de entrega</strong> (obrigat\u00f3ria por lei; comunicada no SAF-T), matr\u00edcula da viatura (Frota ou tabela de <strong>Viaturas de Expedi\u00e7\u00e3o</strong>), motorista, linha final (texto livre), segmento, expedi\u00e7\u00e3o, ref\u00aa interna, centro anal\u00edtico, opera\u00e7\u00e3o triangular UE, c\u00f3digo EAN (Documentos Eletr\u00f3nicos), C\u00f3d. Ident. AT (documentos de transporte), <strong>ATCUD + QR Code</strong> em layouts.</li>\n<li><strong>Multibanco</strong>: disponibiliza\u00e7\u00e3o de refer\u00eancias multibanco para cobran\u00e7a.</li>\n<li><strong>e-TaxFree</strong> (vendas a turistas), <strong>Pagamentos via Unicre/PayPal</strong> (com PHC CS Web), <strong>fatura\u00e7\u00e3o eletr\u00f3nica</strong> (Documentos Eletr\u00f3nicos, CIUS-PT, SaphetyDoc por webservice).</li>\n</ul>\n<h3>4.3 Dossiers Internos (DI \u2014 tabela BO)</h3>\n<p>Conceito central do PHC: <strong>documentos parametriz\u00e1veis pelo utilizador para uso interno</strong>, que alimentam o circuito comercial:\n- <strong>Or\u00e7amentos/Propostas</strong>, <strong>Encomendas de Cliente</strong>, <strong>Encomendas a Fornecedor</strong>, <strong>Folhas de Obra</strong>, <strong>Consigna\u00e7\u00f5es</strong>, e dossiers \u00e0 medida (o utilizador cria tipos de DI).\n- <strong>Circuito (convers\u00f5es)</strong>: Or\u00e7amento \u2192 Encomenda \u2192 Guia \u2192 Fatura; Encomenda a Fornecedor \u2192 \"Comprar a Encomenda a Fornecedor\" (gera compra); \"Faturar a Encomenda de Cliente\"; c\u00f3pias entre DI, Fatura\u00e7\u00e3o e Compras com op\u00e7\u00f5es de c\u00f3pia configur\u00e1veis.\n- <strong>Dossiers especiais</strong> (conte\u00fado da certifica\u00e7\u00e3o Advanced): <strong>Dossier de Stock Inicial</strong>, <strong>Dossier de Transfer\u00eancia de Armaz\u00e9m</strong>, <strong>Dossier de Pre\u00e7os (Cliente/Fornecedor)</strong>, <strong>Dossier de Aven\u00e7as</strong> (fatura\u00e7\u00e3o recorrente), <strong>Dossier de Composi\u00e7\u00e3o e de Produ\u00e7\u00e3o</strong>.\n- <strong>Sistema de Aprova\u00e7\u00e3o de Dossiers</strong> (gama Enterprise) e <strong>Workflow Operacional</strong> (Advanced+) para circuitos de aprova\u00e7\u00e3o.\n- An\u00e1lises de DI (mapas de acompanhamento, convers\u00e3o, pendentes).</p>\n<h3>4.4 Compras</h3>\n<ul>\n<li>Documentos de compras (faturas de fornecedor, guias de entrada, notas de d\u00e9bito/cr\u00e9dito de compra), com gest\u00e3o de IVA, reten\u00e7\u00f5es e custos acess\u00f3rios.</li>\n<li><strong>Comprar a partir de Encomenda a Fornecedor</strong>; rece\u00e7\u00e3o por guia e fatura\u00e7\u00e3o posterior.</li>\n<li><strong>Gest\u00e3o de aprova\u00e7\u00e3o para pagamentos</strong> a fornecedores; <strong>adiantamentos a fornecedores</strong>.</li>\n<li><strong>Faturas de fornecedor eletr\u00f3nicas</strong>: com Cegid Docs, as faturas CIUS-PT s\u00e3o anexadas em PDF e <strong>pr\u00e9-lan\u00e7adas</strong> automaticamente.</li>\n<li><strong>Espanha</strong>: envio de documentos de Compras para o <strong>SII</strong> (fun\u00e7\u00f5es internas na framework/alertas).</li>\n</ul>\n<h3>4.5 Stocks e armaz\u00e9ns</h3>\n<ul>\n<li><strong>Armaz\u00e9ns</strong> m\u00faltiplos; <strong>C\u00f3digos de Movimentos de Stocks</strong> (tipos de movimento configur\u00e1veis).</li>\n<li>Movimentos autom\u00e1ticos por documentos (fatura\u00e7\u00e3o/compras/guias) e manuais (regulariza\u00e7\u00f5es, transfer\u00eancias entre armaz\u00e9ns via dossier).</li>\n<li><strong>Invent\u00e1rio f\u00edsico (contagens)</strong>: contagens por armaz\u00e9m/fam\u00edlia, lan\u00e7amento autom\u00e1tico de <strong>acertos (quebras/sobras)</strong> no ficheiro de movimentos; <strong>comunica\u00e7\u00e3o do invent\u00e1rio \u00e0 AT</strong> (ficheiro SAF-T/CSV/XML conforme fatura\u00e7\u00e3o do ano anterior \u2014 artigo oficial \"Comunica\u00e7\u00e3o de invent\u00e1rio \u00e0 AT: onde, quando e como quiser\").</li>\n<li>An\u00e1lises de stock: produtos com maior lucro, <strong>rankings de vendas</strong>, contributo nos custos, acima do stock m\u00e1ximo, a encomendar, em rutura, entradas/sa\u00eddas mensais com compara\u00e7\u00e3o anual, valor de stock.</li>\n<li><strong>Lotes</strong> e <strong>n\u00fameros de s\u00e9rie</strong>; <strong>stock cativo/pr\u00e9-cativo</strong>; liga\u00e7\u00e3o a <strong>terminais port\u00e1teis (PDA)</strong> para contagens/movimentos.</li>\n</ul>\n<h3>4.6 Conta corrente, cobran\u00e7as e pagamentos</h3>\n<ul>\n<li><strong>C\u00f3digos de Conta Corrente</strong> (tabela de tipos de movimento de C/C), movimentos por documento, saldos e <strong>saldos por idades</strong> (aging).</li>\n<li><strong>Recibos de clientes (RE)</strong> \u2014 normais ou de adiantamento; <strong>Pagamentos a fornecedores</strong>; <strong>liquida\u00e7\u00e3o/regulariza\u00e7\u00e3o</strong> de documentos por recibos/pagamentos (total ou parcial).</li>\n<li><strong>Controlo de cobran\u00e7as</strong>: monitor de controlo de d\u00edvidas de clientes, <strong>mailing de C/C</strong> (avisos por documento), gest\u00e3o de <strong>cheques em carteira</strong>, <strong>letras/t\u00edtulos</strong>.</li>\n<li><strong>Recibos incobr\u00e1veis</strong> (tratamento fiscal).</li>\n<li><strong>Cobran\u00e7as via banco</strong>: ficheiros <strong>SEPA</strong> (d\u00e9bitos diretos), transfer\u00eancias em lote (ficheiro SEPA de pagamentos), <strong>WebBanking</strong> (hist\u00f3rico: Millennium BCP) e <strong>open banking</strong> no Evolution (reconcilia\u00e7\u00e3o e previs\u00f5es aceleradas).</li>\n<li><strong>Refer\u00eancias Multibanco</strong> para receber mais r\u00e1pido.</li>\n</ul>\n<h3>4.7 Tesouraria e bancos</h3>\n<ul>\n<li><strong>Contas de Tesouraria</strong> (caixas e bancos), <strong>C\u00f3digos de Tesouraria</strong> (tipos de movimento), movimentos constantes de tesouraria.</li>\n<li><strong>Extratos banc\u00e1rios</strong> e reconcilia\u00e7\u00e3o; <strong>transfer\u00eancias banc\u00e1rias</strong>; <strong>gest\u00e3o de t\u00edtulos de tesouraria</strong> (letras, cheques).</li>\n<li><strong>Tesouraria real, previsional e or\u00e7amental</strong> \u2014 previs\u00f5es com base em documentos pendentes/vencimentos; or\u00e7amentos de tesouraria.</li>\n<li>No Evolution: <strong>open banking</strong> nativo para importar movimentos e acelerar reconcilia\u00e7\u00f5es.</li>\n</ul>\n<h3>4.8 Pol\u00edtica comercial</h3>\n<ul>\n<li><strong>Tabelas de pre\u00e7os</strong> m\u00faltiplas <strong>com validades</strong> (saber sempre o pre\u00e7o atual); pre\u00e7os por cliente/fornecedor (dossier de pre\u00e7os).</li>\n<li><strong>Tipos de desconto</strong> e descontos autom\u00e1ticos (por tipo de cliente, tipo de artigo, quantidade, valor \u2014 configura\u00e7\u00e3o dispon\u00edvel em web desde 202501); descontos em cascata (Desc.1, Desc.2\u2026).</li>\n<li><strong>Promo\u00e7\u00f5es e campanhas</strong> (com datas de validade; na gama Advanced/Enterprise h\u00e1 op\u00e7\u00f5es extra de promo\u00e7\u00e3o no m\u00f3dulo Gest\u00e3o desktop), <strong>rappel</strong> de clientes e fornecedores (descontos de fim de per\u00edodo por volumes).</li>\n<li><strong>Comiss\u00f5es</strong>: por vendedor, por tipo de cliente, por fam\u00edlias de produtos, etc.; mapas de comiss\u00f5es.</li>\n<li><strong>Vendedores</strong> e zonas; classifica\u00e7\u00e3o de clientes para an\u00e1lises de vendas.</li>\n</ul>\n<h3>4.9 An\u00e1lises, mapas e dashboards</h3>\n<ul>\n<li><strong>Mapas definidos</strong> (relat\u00f3rios standard configur\u00e1veis) e <strong>impress\u00e3o definida pelo utilizador</strong> (Advanced+): layouts personaliz\u00e1veis de documentos e listagens; <strong>templates</strong> de documentos.</li>\n<li><strong>An\u00e1lises de utilizador</strong> (consultas SQL apresentadas em grelha, com filtros de utilizador) e, na gama Advanced, <strong>An\u00e1lises Multidimensionais</strong> criadas a partir de an\u00e1lises de utilizador (cubos OLAP-like para drill-down).</li>\n<li><strong>Snapshots</strong> ( Advanced+): \"fotografias\" de dados com instru\u00e7\u00f5es T-SQL e vari\u00e1veis (ex.: <code>#stamp#</code>), agrup\u00e1veis com cores; \u00fateis para monitores e pain\u00e9is.</li>\n<li><strong>Pain\u00e9is de informa\u00e7\u00e3o / Painel central / Dashboards</strong>: vis\u00e3o 360\u00ba num s\u00f3 ecr\u00e3 (ex.: template de Dashboard para o m\u00f3dulo Gest\u00e3o, se adquirir o <strong>PHC Dashboard</strong>); monitores (ex.: controlo de d\u00edvidas).</li>\n<li><strong>Rankings</strong> e an\u00e1lises de fatura\u00e7\u00e3o por segmento/zona/vendedor/fam\u00edlia.</li>\n<li><strong>Cegid Pulse</strong> (IA, plano Plus+): perguntas em linguagem natural sobre vendas/tesouraria/stocks, <strong>assistentes de neg\u00f3cio</strong> (o primeiro \u00e9 o comercial) e <strong>Smart Tools</strong> que os parceiros podem configurar e monetizar.</li>\n<li>Exporta\u00e7\u00e3o de listagens para <strong>Excel/PDF</strong>, c\u00f3pia de dados a partir de grelhas, \"Altera\u00e7\u00f5es de seguida em Excel\", <strong>Importar Excel para linhas</strong> de documentos.</li>\n</ul>\n<h3>4.10 Integra\u00e7\u00e3o Gest\u00e3o \u2192 Contabilidade</h3>\n<p>(T\u00f3pico obrigat\u00f3rio da certifica\u00e7\u00e3o; o t\u00e9cnico de Gest\u00e3o tem de o dominar.)\n- <strong>Documentos pr\u00e9-definidos</strong> (na Contabilidade e na Gest\u00e3o): regras de contabiliza\u00e7\u00e3o autom\u00e1tica por tipo de documento.\n- <strong>Integra\u00e7\u00f5es da Gest\u00e3o na Contabilidade</strong>: configura\u00e7\u00e3o de contas (clientes, fornecedores, IVA, contrapartidas), integra\u00e7\u00e3o de fatura\u00e7\u00e3o, compras, recibos e pagamentos (com informa\u00e7\u00e3o do documento original no descritivo \u2014 Advanced+).\n- <strong>Apuramento do IVA</strong> a partir dos documentos; <strong>Declara\u00e7\u00e3o Peri\u00f3dica de IVA</strong>; <strong>CEVMC</strong> (custo das mercadorias vendidas e consumidas); apuramento de resultados.\n- <strong>Mapas de Gest\u00e3o</strong> (importa\u00e7\u00e3o/emiss\u00e3o) e <strong>PHC XL</strong> (centros anal\u00edticos, grandes volumes).\n- <strong>Taxonomia</strong> (tabela de taxonomia SNC para mapping contabil\u00edstico).</p>\n<hr />\n<h2 id=\"cap-5\">5. Configura\u00e7\u00e3o do m\u00f3dulo Gest\u00e3o (o dia-a-dia do t\u00e9cnico)</h2>\n<h3>5.1 Onde se configura o qu\u00ea</h3>\n<table>\n<thead>\n<tr>\n<th>O qu\u00ea</th>\n<th>Onde</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Par\u00e2metros gerais e por m\u00f3dulo</td>\n<td>Menu <strong>Sistema \u2192 Par\u00e2metros</strong> (gerais, fatura\u00e7\u00e3o, stocks, tesouraria\u2026). Acesso protegido e configur\u00e1vel <strong>por utilizador</strong></td>\n</tr>\n<tr>\n<td>S\u00e9ries e tipos de documento</td>\n<td><strong>Configura\u00e7\u00e3o de Documentos de Fatura\u00e7\u00e3o</strong> (s\u00e9ries: tipo 1\u20135, mapping SAF-T, numera\u00e7\u00e3o, o que movimenta, op\u00e7\u00f5es AT)</td>\n</tr>\n<tr>\n<td>Dossiers internos</td>\n<td>Configura\u00e7\u00e3o de tipos de DI (nome, s\u00e9ries, o que movimenta, convers\u00f5es permitidas)</td>\n</tr>\n<tr>\n<td>Tabelas base</td>\n<td>IVA/taxas, motivos de isen\u00e7\u00e3o (M01\u2013M99), condi\u00e7\u00f5es de pagamento, formas de pagamento, bancos/contas de tesouraria, c\u00f3digos de C/C, c\u00f3digos de tesouraria, c\u00f3digos de movimentos de stock, zonas, pa\u00edses, moedas/c\u00e2mbios, idiomas, viaturas de expedi\u00e7\u00e3o, moradas de carga/descarga</td>\n</tr>\n<tr>\n<td>Ficheiros</td>\n<td>Clientes, fornecedores, artigos (com fam\u00edlias/marcas), vendedores, tabelas de pre\u00e7os, descontos, armaz\u00e9ns, lotes</td>\n</tr>\n<tr>\n<td>Framework (personaliza\u00e7\u00e3o)</td>\n<td>Menu <strong>Supervisor \u2192 Framework PHC</strong>: campos de utilizador, regras, valores por defeito, teclas de utilizador, fun\u00e7\u00f5es de utilizador, instru\u00e7\u00f5es internas, alertas de utilizador, \u00edndices de utilizador, tabelas de utilizador, ecr\u00e3s personalizados, p\u00e1ginas/objetos (Enterprise), consultas, snapshots, monitores, filtros</td>\n</tr>\n<tr>\n<td>Base de dados</td>\n<td><strong>Supervisor \u2192 Tratamento da base de dados</strong>: Dicion\u00e1rio de Dados, desfragmenta\u00e7\u00e3o, arquivo</td>\n</tr>\n<tr>\n<td>Impress\u00e3o</td>\n<td>Editor de mapas/templates, \"Impress\u00e3o Definida pelo Utilizador\" (Advanced+), defini\u00e7\u00f5es de assinatura</td>\n</tr>\n</tbody>\n</table>\n<h3>5.2 Par\u00e2metros essenciais que tem de conhecer a frio</h3>\n<p>Exemplos de par\u00e2metros da plataforma/m\u00f3dulo que aparecem em quase todos os projetos (a lista exata varia por vers\u00e3o/gama \u2014 validar no ecr\u00e3 de Par\u00e2metros e no manual \"Par\u00e2metros\"):</p>\n<p><strong>Gerais/plataforma:</strong>\n- Defini\u00e7\u00e3o de tipos de acessos (por <strong>Grupos</strong> ou por <strong>Perfis</strong>)\n- Usa ecr\u00e3s em mem\u00f3ria (performance)\n- Mostrar \u00faltimo registo ao arrancar ecr\u00e3 (desligar em BDs grandes = ecr\u00e3s mais r\u00e1pidos)\n- Utiliza campos do utilizador? / ecr\u00e3s do utilizador? / fun\u00e7\u00f5es do utilizador? / filtros de utilizador? / p\u00e1ginas do utilizador? / navegador? / painel central? \u2014 <strong>ativam as ferramentas da Framework</strong> (algumas s\u00f3 gama Executive/Enterprise)\n- Utiliza multi-l\u00edngua? (idiomas de descri\u00e7\u00f5es)\n- Usa processamento ass\u00edncrono (grava\u00e7\u00e3o de documentos)\n- Primeiro dia da semana / n\u00ba da semana\n- Diret\u00f3rio por defeito para imagens; log\u00f3tipo (na BD ou caminho); imagem de fundo\n- Intervalo de refrescamento de alertas\n- Barra de status estendida; pain\u00e9is no menu; teclas do utilizador em rodap\u00e9</p>\n<p><strong>Fatura\u00e7\u00e3o (Par\u00e2metros de Fatura\u00e7\u00e3o):</strong>\n- Percentagem de reten\u00e7\u00e3o de IRS\n- M\u00e9todo de envio de faturas emitidas (<strong>Webservice</strong> vs. ficheiro) \u2192 influencia motivos de isen\u00e7\u00e3o dispon\u00edveis (s\u00f3 M01\u2013M99 aceites pelo webservice)\n- M\u00e9todo de envio de <strong>documentos de transporte</strong> (webservice AT vs. <strong>SAF-T (PT) resumido</strong>)\n- Preenche e valida Local de Carga/Descarga\n- Utiliza data efetiva de entrega nas linhas\n- Utiliza motivo de isen\u00e7\u00e3o nas linhas\n- Comportamento de altera\u00e7\u00f5es de dados de cliente em tabelas relacionadas\n- Envio de SMS (m\u00f3dulo SMS) e SMS ao motorista com c\u00f3digo da AT</p>\n<p><strong>Stocks/Compras/Tesouraria:</strong> par\u00e2metros de custeio (PCMP), stocks negativos, lotes/s\u00e9ries, armaz\u00e9m por defeito, c\u00f3digos de movimento; aprova\u00e7\u00e3o de pagamentos; contas e bancos por defeito; refer\u00eancias multibanco; SEPA.</p>\n<h3>5.3 Configura\u00e7\u00e3o de uma s\u00e9rie de documentos (receita)</h3>\n<ol>\n<li>Criar a <strong>s\u00e9rie</strong> (c\u00f3digo, descri\u00e7\u00e3o, tipo de documento 1\u20135, documento SAF-T correspondente: FT/FS/FR/NC/ND/GT\u2026).</li>\n<li>Definir <strong>o que movimenta</strong>: stocks? conta corrente? tesouraria?</li>\n<li><strong>Numera\u00e7\u00e3o</strong>: sequ\u00eancia por s\u00e9rie/ano; regras de n\u00ba de documento.</li>\n<li>Op\u00e7\u00f5es fiscais: motivo de isen\u00e7\u00e3o (cabe\u00e7alho ou linhas), valida\u00e7\u00e3o de transporte (locais, data/hora), ATCUD.</li>\n<li><strong>Comunica\u00e7\u00e3o \u00e0 AT</strong>: para documentos de transporte \u2014 m\u00e9todo (webservice ou SAF-T resumido); op\u00e7\u00e3o de SMS ao motorista com o c\u00f3digo da AT.</li>\n<li><strong>Layout de impress\u00e3o</strong>: template com QR Code + ATCUD (obrigat\u00f3rio em documentos fiscalmente relevantes).</li>\n<li><strong>Acessos</strong>: quem pode emitir/alterar/anular/reimprimir.</li>\n<li>Para vendas a dinheiro/consumidor final: regras de cliente gen\u00e9rico e NIF.</li>\n</ol>\n<h3>5.4 Viragem de ano / obriga\u00e7\u00f5es peri\u00f3dicas de configura\u00e7\u00e3o</h3>\n<ul>\n<li><strong>Comunicar s\u00e9ries \u00e0 AT</strong> antes de as usar (ATCUD): a AT devolve o <strong>c\u00f3digo de valida\u00e7\u00e3o da s\u00e9rie</strong>, que se associa na configura\u00e7\u00e3o \u2014 sem ele, <strong>a impress\u00e3o de documentos \u00e9 bloqueada</strong> (regra em vigor desde 2021).</li>\n<li>Carregar tabelas fiscais novas (reten\u00e7\u00f5es IRS com data de vig\u00eancia \u2014 202601 permite coexist\u00eancia de tabelas antigas/novas).</li>\n<li>Rever motivos de isen\u00e7\u00e3o de IVA (atualiza\u00e7\u00e3o manual ou autom\u00e1tica \u2014 202501+).</li>\n<li>Invent\u00e1rio: contagem e <strong>comunica\u00e7\u00e3o \u00e0 AT at\u00e9 31 de janeiro</strong> (quando aplic\u00e1vel).</li>\n<li>Verificar calend\u00e1rio de obriga\u00e7\u00f5es no <strong>Calend\u00e1rio PHC</strong> (PHC On).</li>\n</ul>\n<hr />\n<h2 id=\"cap-6\">6. Fiscalidade e obriga\u00e7\u00f5es legais</h2>\n<blockquote>\n<p>Um expert em Gest\u00e3o PHC \u00e9, na pr\u00e1tica, um especialista em conformidade fiscal portuguesa aplicada ao ERP. A PHC publica artigos oficiais para cada obriga\u00e7\u00e3o \u2014 todos citados nas fontes.</p>\n</blockquote>\n<h3>6.1 Certifica\u00e7\u00e3o do software e assinatura</h3>\n<ul>\n<li>O software \u00e9 <strong>certificado pela AT (ex-DGCI)</strong> \u2014 n\u00ba de certificado impresso nos documentos.</li>\n<li><strong>Assinatura digital qualificada/hash</strong> dos documentos obrigat\u00f3ria (artigo oficial: \"Assinatura digital qualificada nas faturas \u00e9 obrigat\u00f3ria a partir de 1 de janeiro\") \u2014 cadeia de hashes que garante a integridade; documentos certificados bloqueiam altera\u00e7\u00f5es a dados fiscais de clientes.</li>\n<li>Regras de <strong>fatura\u00e7\u00e3o</strong>: obriga\u00e7\u00e3o de emiss\u00e3o, prazos, documentos retificativos (NC com <strong>motivo de retifica\u00e7\u00e3o</strong> obrigat\u00f3rio), anula\u00e7\u00e3o com motivo.</li>\n</ul>\n<h3>6.2 SAF-T (PT)</h3>\n<ul>\n<li><strong>SAF-T de fatura\u00e7\u00e3o (auditoria)</strong>: exporta\u00e7\u00e3o mensal para a AT (e-fatura) e para o contabilista; inclui campos de controlo como a indica\u00e7\u00e3o de documento exportado para o SAF-T de auditoria, e o mapeamento de tipos de documento (FT, FS, FR, NC, ND, GT, GA, GC\u2026).</li>\n<li><strong>SAF-T (PT) resumido para documentos de transporte</strong>: alternativa ao webservice para comunicar guias; exporta <code>ShipFrom</code>/<code>ShipTo</code> (locais de carga/descarga) na tabela <code>MovementOfGoods</code>.</li>\n<li><strong>Comunica\u00e7\u00e3o de documentos de transporte \u00e0 AT</strong>: por <strong>webservice</strong> (tempo real, antes do in\u00edcio do transporte; devolve o <strong>C\u00f3d. Ident. AT</strong> que pode seguir por SMS ao motorista) ou por <strong>SAF-T resumido</strong>.</li>\n<li><strong>Comunica\u00e7\u00e3o de invent\u00e1rio</strong> via SAF-T/CSV/XML.</li>\n<li>Boas pr\u00e1ticas: validar o SAF-T no validador da AT/Portal das Finan\u00e7as ap\u00f3s cada mudan\u00e7a de configura\u00e7\u00e3o; testar com documentos isentos (motivos M01\u2013M99), NC/ND, autofatura\u00e7\u00e3o.</li>\n</ul>\n<h3>6.3 ATCUD e QR Code</h3>\n<ul>\n<li>Desde 2021 (v27+): <strong>todas as faturas e documentos fiscalmente relevantes</strong> incluem <strong>QR Code</strong> e <strong>ATCUD</strong> (c\u00f3digo \u00fanico do documento: c\u00f3digo de valida\u00e7\u00e3o da s\u00e9rie + n\u00famero sequencial).</li>\n<li>Passos: comunicar s\u00e9ries \u00e0 AT \u2192 receber c\u00f3digo de valida\u00e7\u00e3o \u2192 associ\u00e1-lo na s\u00e9rie no PHC \u2192 garantir <strong>layouts preparados</strong> com QR e ATCUD \u2192 o software <strong>impede a impress\u00e3o</strong> de documentos de s\u00e9ries n\u00e3o validadas.</li>\n</ul>\n<h3>6.4 e-Fatura e fatura\u00e7\u00e3o eletr\u00f3nica</h3>\n<ul>\n<li><strong>M\u00e9todo de envio de faturas emitidas</strong>: webservice \u00e0 AT em tempo real (par\u00e2metro) ou via SAF-T mensal pelo contabilista.</li>\n<li><strong>Fatura\u00e7\u00e3o eletr\u00f3nica</strong>: m\u00f3dulo <strong>Documentos Eletr\u00f3nicos</strong> (c\u00f3digo EAN da empresa, EDI), integra\u00e7\u00e3o <strong>SaphetyDoc via webservice</strong> (artigo oficial no Help Center: \"Comunica\u00e7\u00e3o de Documentos com SaphetyDoc via Webservice no PHC CS Desktop\"), e <strong>CIUS-PT</strong> para fatura\u00e7\u00e3o \u00e0 Administra\u00e7\u00e3o P\u00fablica; com <strong>Cegid Docs</strong>, PDFs de faturas de fornecedor CIUS-PT s\u00e3o <strong>anexados e pr\u00e9-lan\u00e7ados</strong> automaticamente (202601).</li>\n<li><strong>e-TaxFree</strong> (turistas) e vendas intra-comunit\u00e1rias (<strong>opera\u00e7\u00f5es triangulares</strong>, Intrastat).</li>\n</ul>\n<h3>6.5 Impostos e reten\u00e7\u00f5es</h3>\n<ul>\n<li><strong>IVA</strong>: taxas, motivos de isen\u00e7\u00e3o (tabela M01\u2013M99 sincronizada com webservice), IVA de caixa (se aplic\u00e1vel), apuramento via Contabilidade, <strong>Declara\u00e7\u00e3o Peri\u00f3dica de IVA</strong>.</li>\n<li><strong>Reten\u00e7\u00f5es na fonte</strong>: IRS (faturas com taxa/valor de reten\u00e7\u00e3o), IRC, <strong>Imposto do Selo</strong> \u2014 o Calend\u00e1rio PHC documenta o tratamento no software.</li>\n<li><strong>Modelo 22 / IRC</strong> (202601 atualizou apuramento de IRC 2025), <strong>Modelo 30</strong> (rendimentos pagos a n\u00e3o residentes \u2014 guia passo-a-passo oficial), <strong>DMR</strong> (n\u00e3o emitir valores negativos \u2014 202601).</li>\n<li><strong>Espanha</strong>: <strong>SII</strong> (Suministro Inmediato de Informaci\u00f3n AEAT) e <strong>TicketBAI</strong> \u2014 par\u00e2metro geral com 4 op\u00e7\u00f5es (202601); fun\u00e7\u00f5es internas \"Enviar documentos de Compras/Vendas para o SII\".</li>\n<li><strong>Peru</strong>: c\u00e1lculo de reten\u00e7\u00e3o nas vendas (taxa de
