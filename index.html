tas da gestão: 'chega para os salários?', 'podemos investir?'. Títulos (letras, cheques pré-datados) entram nas previsões. Alertas de saldo mínimo evitam surpresas. É a área onde o ERP prova valor à administração.", "s": [["Tesouraria previsional", "Projeção de entradas/saídas com base em vencimentos de C/C, títulos e documentos pendentes."], ["Orçamento de tesouraria", "Plano mensal/anual de receitas e despesas para comparar com o realizado."], ["Títulos", "Letras/cheques com data futura — dinheiro 'prometido' que entra na previsão."], ["Alertas de saldo", "Notificações quando uma conta desce do mínimo definido (framework de alertas)."]], "e": ["Previsão desatualizada (documentos por lançar = previsão errada)", "Confundir lucro com caixa: vendas a prazo geram lucro hoje e caixa só no vencimento"]}, "L32": {"c": "Comissões alinham vendedores com a estratégia: configuram-se por vendedor, tipo de cliente, família de produtos (ou combinação), como percentagem sobre vendas (faturado e/ou cobrado — decisão política importante). O apuramento sai em mapas por período. Documentos anulados/creditados devem reverter comissões — validar este comportamento. Vendedores têm ficha própria e associam-se a clientes/documentos.", "s": [["Vendedor", "Ficha com percentagens/regras; associa-se ao cliente (vendedor da conta) e/ou ao documento (vendedor da venda)."], ["Critérios de comissão", "Por vendedor, tipo de cliente, família de artigos, etc."], ["Faturado vs cobrado", "Comissão sobre a venda emitida ou sobre o dinheiro recebido — muda radicalmente o comportamento da equipa."], ["Mapa de comissões", "Apuramento por vendedor/período para pagamento."]], "e": ["Comissão só sobre faturado em empresas com muito incobrável (paga-se comissão de vendas nunca recebidas)", "Esquecer o efeito das NC no apuramento (comissão de venda creditada deve estornar)"]}, "L33": {"c": "O SAF-T (PT) é o ficheiro XML normalizado que 'fotografa' a faturação (e transportes/inventário) para a AT e contabilistas: Header (nº certificado do software, NIF), Customer, Product e Invoice com totais por taxa, hashes e tipos de documento (FT/FS/FR/NC/ND). A integridade vem da hash encadeada (cada documento assina o anterior) + software certificado pela AT. Exportar é fácil; o técnico expert sabe LER o XML, validar num validador e diagnosticar rejeições (motivos de isenção inválidos, datas, sequências).", "s": [["SAF-T de faturação", "Exportação mensal (e-fatura) e para auditoria — elementos Invoice/DocumentType/Hash."], ["Hash encadeada", "Assinatura de cada documento encadeada ao anterior — deteta adulterações; documentos anulados ficam marcados."], ["Nº de certificado AT", "Identifica o software validado pela AT — impresso nos documentos e no Header do SAF-T."], ["Validador", "Ferramenta (Portal das Finanças/contabilistas) que verifica estrutura e regras antes da entrega."], ["TaxExemptionReason", "Código M01-M99 obrigatório em linhas isentas com valores."]], "e": ["Exportar o SAF-T e não validar (descobrir o erro no prazo da entrega)", "Mudar séries/tipos sem verificar o mapping SAF-T — o ficheiro sai com tipos errados"]}, "L34": {"c": "Desde 2021 (v27 do PHC CS) todos os documentos fiscalmente relevantes imprimem QR Code + ATCUD. O ATCUD = código de validação da série (atribuído pela AT quando a empresa comunica as séries que vai usar) + '-' + número sequencial do documento. Sem código de validação associado à série, o software BLOQUEIA a impressão. O processo anual: comunicar séries à AT → receber códigos → associá-los nas séries do PHC → confirmar layouts com QR/ATCUD. É conformidade pura — erro aqui = documentos inválidos.", "s": [["Comunicação de séries", "Antes de usar séries novas (e na viragem de ano), comunicam-se à AT; a resposta é o código de validação."], ["Código de validação", "String da AT que se associa à série no PHC — componente fixa do ATCUD."], ["ATCUD", "CODIGODEVALIDACAO-SEQUENCIAL: identificador único do documento, legível por máquina (QR) e por humano."], ["QR Code", "Código bidimensional impresso com dados do documento para leitura por qualquer smartphone (e-fatura)."], ["Bloqueio de impressão", "Séries sem validação não imprimem — proteção contra documentos não conformes."]], "e": ["Criar série nova em janeiro sem a comunicar à AT (bloqueio de impressão no pior momento)", "Atualizar layouts e perder o QR/ATCUD (validar sempre com um documento de teste)"]}, "L35": {"c": "Mercadoria em circulação exige documento de transporte comunicado à AT ANTES do início do transporte (regra geral). Dois métodos: webservice em tempo real — a AT devolve o Cód. Ident. AT (que pode seguir por SMS ao motorista, se a série + módulo SMS estiverem configurados) — ou SAF-T (PT) resumido (ficheiro com MovementOfGoods, onde os locais de carga/descarga viajam como ShipFrom/ShipTo). O parâmetro 'Método de Envio de Documentos de Transporte' decide. Há regimes especiais (venda ambulante, isenções por faturação no ato) que o técnico deve reconhecer.", "s": [["Webservice AT", "Comunicação síncrona que devolve o código de identificação do documento — prova imediata."], ["SAF-T resumido", "Alternativa por ficheiro: MovementOfGoods com ShipFrom/ShipTo, datas/horas e Hash."], ["Cód. Ident. AT", "Campo do documento com o código devolvido pela AT — exigível em fiscalização na estrada."], ["SMS ao motorista", "Automatismo (série + módulo SMS) que envia o código da AT ao condutor."], ["Data/hora de início", "Elementos críticos: o transporte não pode 'começar' antes da comunicação."]], "e": ["Emitir guias com hora de carga já passada e comunicar depois (infração)", "Usar SAF-T resumido sem conferir ShipFrom/ShipTo (locais errados invalidam)"]}, "L36": {"c": "Retenções na fonte = o cliente retém parte do pagamento e entrega ao Estado por conta do fornecedor (IRS/IRC) — comum em serviços de profissionais liberais e empresas enquadradas. Na fatura aparecem taxa e valor de retenção; a C/C regista o líquido a receber (o retido não é dívida do cliente). Imposto do Selo aplica-se a certas operações (verbas próprias). O Calendário PHC (PHC On) documenta o tratamento no software; declarações (Modelo 30 para não residentes, etc.) têm guias oficiais no Help Center.", "s": [["Agente de retenção", "Quem paga e retém (cliente empresarial, tipicamente) — a ficha do cliente marca o enquadramento."], ["Taxa/valor de retenção", "Campos do documento; o total a pagar = total − retenção."], ["Líquido na C/C", "A dívida do cliente é pelo líquido — aging e cobranças refletem isso."], ["Imposto do Selo", "Taxa sobre operações específicas (ex.: crédito) com verbas legais."], ["Modelo 30", "Declaração de rendimentos pagos a não residentes — guia passo-a-passo oficial no Help Center."]], "e": ["Cobrar ao cliente o valor total de fatura com retenção (está-se a cobrar o que ele entrega ao Estado)", "Esquecer a retenção num recibo/liquidação e o saldo nunca fechar"]}, "L37": {"c": "O módulo trata dados pessoais (nomes, NIFs, contactos, moradas) — o RGPD exige base legal, transparência (aviso legal), minimização e direitos do titular (acesso, retificação, ESQUECIMENTO). O PHC implementa: aviso legal configurável, registo do tratamento de dados, processo de esquecimento/anonimização (remove dados identificativos preservando documentos fiscais — que por lei NÃO podem ser apagados) e histórico de utilizadores. O técnico opera estes pedidos com procedimento documentado.", "s": [["Aviso legal", "Texto de privacidade apresentado/documentado conforme configuração."], ["Registo do tratamento", "Inventário dos tratamentos de dados feitos pela empresa (obrigação RGPD)."], ["Direito ao esquecimento", "Anonimização de dados pessoais do titular — preservando integridade fiscal dos documentos emitidos."], ["Histórico de utilizadores", "Rasto de quem fez o quê (auditoria interna)."], ["Prazo de conservação fiscal", "Documentos fiscais guardam-se anos (10 em regra) — o 'esquecimento' é anonimização, não eliminação total."]], "e": ["Prometer 'apagar tudo' a um titular sem explicar o conflito com obrigações fiscais", "Executar esquecimento em produção sem procedimento/teste prévio (é irreversível)"]}, "L38": {"c": "A integração Gestão→Contabilidade transforma documentos comerciais em lançamentos contabilísticos automáticos via Documentos Pré-Definidos: para cada tipo de documento definem-se contas (clientes, fornecedores, IVA liquidado/dedutível, vendas, compras, contrapartidas) e regras (diário, documento pré-numerado). O contabilístico fecha o ciclo: apuramento do IVA, declaração periódica, CEVMC, resultados. Mesmo sem o módulo Contabilidade instalado, o técnico de Gestão DEVE conhecer o esquema de integração — é o que faz o ERP ser 'um só sistema'.", "s": [["Documentos pré-definidos", "Modelos de contabilização por tipo de documento do Gestão."], ["Contas de integração", "Contas SNC mapeadas: clientes (21), fornecedores (22), IVA (24), vendas (71/72), compras (31/22)..."], ["Diários", "Agrupamentos de lançamentos (vendas, compras, recebimentos, pagamentos)."], ["Apuramento do IVA", "Confronto do IVA liquidado (vendas) vs dedutível (compras) → declaração periódica."], ["CEVMC e resultados", "Consumos + variações de existências alimentam o apuramento de resultados."], ["PHC XL / centros analíticos", "Grandes volumes e contabilidade multidimensional (dimensões/centros)."]], "e": ["Integrar sem validar as contas de teste num clone (um mapa de contas errado exige estornos massivos)", "Desintegrar/reintegrar sem critério e duplicar lançamentos"]}, "L39": {"c": "Parâmetros são interruptores globais que mudam o comportamento do software — de performance (ecrãs em memória, processamento assíncrono) a regras fiscais (métodos de envio à AT, validações). Estão no menu Sistema, protegidos por acessos (configuráveis por utilizador). O método profissional para mexer: documentar o valor atual → alterar UM → testar → reverter ou manter. Cada parâmetro tem manual in-app (botão Ajuda) — leia antes de mudar.", "s": [["Parâmetros gerais vs de módulo", "Gerais afetam a plataforma (UI, performance, acessos); de módulo afinam faturação/stocks/tesouraria."], ["Parâmetros de faturação", "Retenção IRS, método de envio à AT, validações de transporte, isenção nas linhas..."], ["Acessos a parâmetros", "Pode-se libertar parâmetros específicos a utilizadores não-admin."], ["Documentação in-app", "O botão Ajuda de cada parâmetro abre o manual oficial — fonte primária."], ["Metodologia 1-2-3", "Um parâmetro de cada vez + registo antes/depois + teste + capacidade de reverter."]], "e": ["Mudar parâmetros 'para ver o que acontece' em produção", "Copiar parâmetros de outra instalação sem entender cada um (contextos diferem)"]}, "L40": {"c": "Reporting standard: Mapas Definidos são relatórios prontos e configuráveis (colunas, filtros, totais, ordenações) que cobrem o dia-a-dia (vendas por cliente, dívidas, compras). A Impressão Definida pelo Utilizador (Advanced+) permite ajustar layouts de listagens à casa. Saídas: ecrã, impressora, Excel, PDF. Antes de desenvolver um relatório novo, procure o mapa standard — 80% das necessidades já existem configuráveis.", "s": [["Mapa definido", "Relatório standard com configuração de colunas/filtros/totais pelo utilizador."], ["Impressão definida pelo utilizador", "Personalização de o que sai impresso nas listagens (Advanced+)."], ["Exportar vs imprimir", "Excel para análise, PDF para arquivo/envio — escolher o canal certo."], ["Repetição de valores em grelhas", "Parâmetro que imprime (ou não) valores repetidos por coluna."]], "e": ["Desenvolver à medida o que um mapa standard já faz configurado", "Mapas com filtros errados guardados como 'definitivos' (validar com dados conhecidos)"]}, "L41": {"c": "Análises de Utilizador = consultas SQL criadas pelo utilizador (Advanced+) apresentadas como grelhas vivas dentro do PHC, com filtros próprios e possibilidade de promoção a atalhos/menus. É a ferramenta de reporting livre: JOINs entre tabelas (ex.: ft × cl para vendas por zona), agregações, parâmetros de período. Boas práticas: NOLOCK em leituras, descobrir campos pelo Dicionário de Dados, guardar o SQL em ficheiro (versionamento) e documentar o propósito.", "s": [["Análise de utilizador", "Consulta SQL reutilizável exposta como ecrã de grelha na aplicação."], ["Filtro de utilizador", "Condições guardadas sobre grelhas/tabelas (ex.: 'só clientes zona Sul')."], ["JOINs típicos", "Documentos × clientes × artigos — as relações vêem-se no Dicionário de Dados."], ["NOLOCK", "Hint de leitura sem bloqueios — standard nas análises (aceita 'leituras sujas')."], ["Guardar SQL", "Versionar as consultas fora da BD (ficheiros .sql) para reutilização/auditoria."]], "e": ["UPDATE/DELETE 'para corrigir' a partir de uma análise (análise é LEITURA; correções fazem-se pelos ecrãs)", "Escrever SQL a adivinhar nomes de campos em vez de usar o dicionário"]}, "L42": {"c": "Camada de BI do utilizador: Snapshots são consultas T-SQL contextualizadas (usam variáveis como #stamp# para mostrar dados do registo em foco) exibíveis em painéis com cores por grupo. Análises Multidimensionais (Advanced+) promovem análises de utilizador a cubos com drill-down (ano → mês → cliente → documento). Dashboards (PHC Dashboard) e painéis de informação agregam indicadores num ecrã de comando. É o que transforma 'dados espalhados' em decisão rápida.", "s": [["Snapshot", "Consulta 'fotografada' com variáveis de contexto (#stamp#) — ex.: painel lateral do cliente com últimos documentos."], ["Análise multidimensional", "Cubo OLAP-like criado a partir de análise de utilizador; drill-down por dimensões."], ["Painéis/Dashboard", "Agregadores visuais (indicadores, gráficos) — template de Dashboard existe para o módulo Gestão."], ["Grupos de snapshots com cor", "Organização visual de conjuntos de snapshots (parâmetro próprio)."]], "e": ["Snapshots pesados a correr em cada abertura de ecrã (lentidão) — otimizar a consulta", "Multidimensional sobre dados errados (validar totais contra mapas standard antes de confiar)"]}, "L43": {"c": "Automação de vigilância: Monitores (com Itens de Monitor configurando colunas) apresentam filas de trabalho operacionais (dívidas, aprovações, sincronizações). Alertas de utilizador disparam por condições (stock mínimo, documento pendente) e distribuem-se por canais: aviso interno, PHC Notify, e-mail (SMTP), SMS (módulo). O intervalo de refrescamento é um parâmetro geral. Nas gamas superiores, Workflow Operacional e Sistema de Aprovação de Dossiers formalizam circuitos de autorização.", "s": [["Monitor + itens", "Vista sequencial de dados operacionais com colunas configuráveis por item."], ["Alerta de utilizador", "Condição → aviso automático; funções internas (ex.: CriaAvs) criam avisos a utilizadores."], ["Canais de notificação", "Aviso interno na app, PHC Notify, e-mail SMTP, SMS."], ["Workflow/aprovações", "Circuitos formais de autorização (Workflow Operacional no Advanced+; Aprovação de Dossiers no Enterprise)."]], "e": ["Alertas sem dono (disparam e ninguém atua — definir destinatário e ação)", "Refrescamento demasiado agressivo de alertas/monitores (carga na BD)"]}, "L44": {"c": "A Framework PHC permite estender o modelo de dados SEM tocar no core: Campos de Utilizador adicionam colunas a tabelas do software (ativas por parâmetro, visíveis nos ecrãs, persistentes em upgrades); Tabelas de Utilizador criam entidades novas; Valores por Defeito pré-preenchem campos por expressão; Índices de Utilizador aceleram consultas (com INCLUDED COLUMNS). É o primeiro passo de qualquer personalização — e a alternativa correta ao ALTER TABLE manual (que quebra suporte e upgrades).", "s": [["Campo de utilizador", "Coluna extra gerida pela framework (tipo, validações) — sobrevive a upgrades porque é metadata na BD."], ["Tabela de utilizador", "Entidade nova (ex.: ZonasTreino, Contratos) integrada nas ferramentas da framework."], ["Valores por defeito", "Preenchimento automático de qualquer campo (expressão: data atual, utilizador, cálculos)."], ["Índice de utilizador", "Índice SQL criado via framework, incluindo colunas incluídas (INCLUDED COLUMNS)."], ["Ativação por parâmetro", "'Utiliza campos do utilizador?' etc. — ferramentas aparecem no Supervisor → Framework PHC."]], "e": ["ALTER TABLE direto nas tabelas do core (upgrade pode falhar/ignorar; perde suporte)", "Criar campos sem convenção de nomes (prefixo do projeto/parceiro evita colisões futuras)"]}, "L45": {"c": "Regras de Utilizador são validações de negócio executadas pela aplicação no momento da introdução/gravacao: obrigar campos condicionais, impedir vendas sem stock ou acima do limite de crédito, validar NIF (9 dígitos + checksum). Criam-se por assistente (condições simples sem código) ou em Xbase (lógica complexa). Mensagens claras e em linguagem de utilizador final são parte do trabalho. Testam-se SEMPRE num clone antes de produção — uma regra errada pode bloquear a faturação da empresa toda.", "s": [["Assistente de Regras", "Construtor visual para condições simples (campo X obrigatório quando Y)."], ["Regra em código Xbase", "Para lógica complexa (cálculos, consultas, mensagens dinâmicas)."], ["Momento de execução", "A regra corre na interação/gravacao — bloqueia ou avisa conforme configurado."], ["Mensagem de utilizador", "Texto claro do porquê do bloqueio — reduz chamadas ao suporte."]], "e": ["Regra que bloqueia sem mensagem explicativa (utilizador liga em pânico)", "Testar só o caso feliz — validar também documentos antigos/anulações/reaberturas"]}, "L46": {"c": "Eventos são o coração do desenvolvimento desktop: pontos de extensão (Init, Clique, Ao Entrar/Sair, Após Atualizar, Tecla Pressionada, Refrescar...) onde corre código Xbase (sintaxe Visual FoxPro). Em cada evento existe o objeto ObjRecebido com Janela (o ecrã), Objecto (o próprio objeto, com Value/Parent) e MeusDados (repositório chave-valor para estado entre eventos). Return .F. cancela o comportamento padrão do objeto. Expressão vs programa: expressões retornam sozinhas (sem Return); programas permitem várias instruções. Erros? Análise Interna mostra a linha (0 = expressão).", "s": [["Xbase", "Linguagem de personalização desktop (dialecto VFP) — eventos, regras, funções."], ["ObjRecebido.Janela", "Apontador para o ecrã (Caption, BackColor...) — alterações duram enquanto o ecrã está aberto (repetir no Init)."], ["ObjRecebido.Objecto", "O objeto do evento: Value, Parent (navegar a hierarquia), MeusDados."], ["MeusDados", "Chave-valor do utilizador: AddParametro, GuardaParametro, ExisteParametro, GetNomeParametro, GetIndexParametro."], ["Return .F.", "Cancela a ação de raiz (tecla não entra, calendário não abre). Expressões não usam Return."], ["Lista de eventos", "Init, Ativar, Desativar, Refrescar, Clique, Duplo Clique, Clique Direito, Ao Entrar, Ao Sair, Após Atualizar, Após não Atualizado, Antes/Depois mudar Linha-Coluna, Mouse*, Tecla Pressionada."], ["Campo de Ligação", "Objeto composto: .Lista1 (botão lista), .Procura (botão procura), .Nossocampo1 (texto)."]], "e": ["Alterar propriedades no Init esperando persistência na BD (só duram com o ecrã aberto — repor no evento certo)", "Sempre esquecer de ver a Análise Interna quando 'o evento não faz nada' (o erro está lá)"]}, "L47": {"c": "Além dos eventos, a framework oferece utilitários reutilizáveis: Funções de Utilizador (procedimentos Xbase com parâmetros — ex.: calcular margem), Teclas de Utilizador (atalhos com descrição no rodapé), Instruções Internas (o 'manual da casa' escrito dentro de cada ecrã principal) e Alertas programados (funções internas como CriaAvs criam avisos a utilizadores; U_NAVEGA navega entre registos/ecrãs). Versões recentes acrescentam funções internas novas (ex.: envios SII; PromptFunction() para IA).", "s": [["Função de utilizador", "Código Xbase reutilizável com parâmetros/retorno — DRY aplicado ao ERP."], ["Tecla de utilizador", "Atalho de teclado personalizável (com descrição visível em rodapé)."], ["Instruções internas", "Procedimento operacional escrito pelo utilizador, associado a cada ecrã principal."], ["CriaAvs", "Função interna que cria avisos/avisos internos a utilizadores (parâmetros: stamp, userAv...)."], ["U_NAVEGA", "Função interna de navegação programática (interage com o parâmetro 'mostrar último registo')."], ["PromptFunction()", "Função da framework (202601) para invocar IA/Cegid Pulse — base dos Smart Tools."]], "e": ["Duplicar o mesmo código em 10 eventos em vez de criar 1 função de utilizador", "Instruções internas desatualizadas (pior que não existirem)"]}, "L48": {"c": "IDUs (Ecrãs Personalizados) são ecrãs novos desenhados pelo utilizador no Desenhador de Ecrãs: páginas, campos ligados a tabelas, grelhas, botões — tudo com eventos Xbase e parâmetros de ecrã. Ligam-se a menus novos (Menus/Opções de Ecrã da framework) e entre si (Ligações entre IDUs). No POS touch há drag-and-drop de objetos. Um bom IDU resolve o que os ecrãs standard não cobrem: painéis de crédito, consolas de operação, wizards internos.", "s": [["Desenhador de ecrãs", "Ferramenta que cria o IDU (objetos: texto, campos de ficheiro/ligação, grelhas, botões, árvore...)."], ["Menu de utilizador", "Menus novos para organizar IDUs/análises criadas (framework)."], ["Ligações entre IDUs", "Navegação de um ecrã personalizado para outro passando contexto."], ["Objetos deste ecrã", "Opção que lista propriedades dos objetos do ecrã — útil ao programar eventos."], ["Parâmetros de ecrã", "Configuração específica do comportamento do ecrã personalizado."]], "e": ["IDU a duplicar o que um mapa/análise standard já resolve (manutenção dupla)", "Ecrã sem acessos configurados (toda a gente vê o que não devia)"]}, "L49": {"c": "Performance é medição, não opinião: cronometre a análise lenta (SET STATISTICS TIME no SSMS), veja o plano de execução, e ataque com as ferramentas certas — Índices de Utilizador (framework) cobrindo JOINs/filtros (INCLUDED COLUMNS para colunas de output), desfragmentação das tabelas principais (utilitário PHC) + manutenção de índices SQL, BD de arquivo para históricos, File Storage para anexos, e parâmetros de UI (ecrãs em memória ON, 'mostrar último registo' OFF em BDs grandes). Registe antes/depois — sem números não há otimização.", "s": [["Índice de utilizador", "Índice via framework sobre tabelas do software — persiste em upgrades."], ["INCLUDED COLUMNS", "Colunas 'de cobertura' no índice que evitam lookup à tabela (v19+)."], ["Desfragmentar tabelas principais", "Utilitário PHC para manutenção de fragmentação."], ["BD de arquivo", "Históricos movidos para BD própria — tabelas ativas mais rápidas."], ["Parâmetros de performance", "Ecrãs em memória, mostrar último registo OFF, processamento assíncrono."], ["sp_spaceused / DMVs", "Medição de espaço e fragmentação (sys.dm_db_index_physical_stats)."]], "e": ["Criar índices 'para tudo' (cada índice custa escrita nas gravações)", "Otimizar sem medir antes/depois (pode piorar e nem saber)"]}, "L50": {"c": "O lado web (PHC CS Web — Gestão Web, Front Web, POS Web) partilha a BD e tem framework própria em C#: Editor de Código para Eventos e Regras, Ecrãs/Objetos de Utilizador, Templates, Monitores, Filtros, Valores por Defeito — e Scripts: programas executados quando se chama um URL (endpoints para integrações, ex.: devolver JSON de stock à loja online). O Log de Código é a Análise Interna da web. Relatórios web usam DevExpress. No Evolution, o acesso web está incluído na subscrição.", "s": [["Framework Web (C#)", "Eventos, regras e ecrãs de utilizador programados em C# no Editor de Código."], ["Scripts por URL", "Endpoint próprio: um URL identifica o script; a resposta pode ser JSON/HTML — base de integrações leves."], ["Log de Código", "Diagnóstico da execução do código de utilizador na web."], ["Front Web", "Extranet para clientes/fornecedores (documentos, encomendas, dossiers)."], ["DevExpress", "Tecnologia dos relatórios no PHC CS Web (Clientes, Faturação, Recibos...)."]], "e": ["Scripts por URL sem autenticação/validação (qualquer pessoa com o URL acede — proteger!)", "Assumir que o código Xbase do desktop 'funciona igual' na web (são frameworks/linguagens diferentes)"]}, "L51": {"c": "Projetos de personalização seguem um ciclo profissional: requisito → desenho (que objetos da framework usar) → implementação em clone → testes com cenários (feliz, limites, erro) → documentação → produção → revalidação pós-upgrade. A solução 'Controlo de Crédito' combina tudo o que aprendeu: campo de utilizador (limite), regra (bloqueio), alerta (aviso ao gestor), IDU (consulta), análise (exposição). Como as personalizações vivem na BD, sobrevivem à reinstalação do executável — mas NUNCA assuma: revalide após cada upgrade.", "s": [["Requisito → desenho", "Traduzir o pedido do negócio em objetos da framework (campo? regra? evento? IDU?)."], ["Cenários de teste", "Dentro do limite, acima, sem limite, documento a dinheiro, alteração do limite — os 5 mínimos."], ["Documentação viva", "notas/projeto-X.md: o que foi criado, onde, código, testes — o próximo técnico (ou você em 6 meses) agradece."], ["Persistência na BD", "Personalizações gravam na base de dados (framework) — reinstalar o exe não as apaga; upgrade exige revalidação."]], "e": ["Implementar direto em produção 'porque é só um campinho'", "Não documentar (em 6 meses ninguém sabe o que aquele evento faz)"]}, "L52": {"c": "EyePeak é a plataforma de logística/WMS/e-commerce do ecossistema Cegid (Primavera) que sincroniza com o PHC: artigos, stocks, séries de documentos e fluxos documentais (ex.: encomendas de fornecedor → guias). No PHC, o ponto de contacto é o monitor 'EyePeak Sincronização' (menu Supervisor) e o Monitor de Configurações (consistência de séries). Para o técnico: entender o que sincroniza, em que direção, e como diagnosticar quando 'não bate' entre sistemas.", "s": [["EyePeak Sincronização", "Monitor no Supervisor que comunica dados ERP ↔ EyePeak."], ["Sincronização de séries", "Garantir consistência das séries de faturação entre ERP e EyePeak (Monitor de Configurações)."], ["Fluxo de fornecedores", "Exemplo documentado: encomendas → guias entre Cegid PHC e EyePeak."], ["Direção dos dados", "Quem é mestre de cada entidade (artigos no ERP? stock no WMS?) — definir antes de sincronizar."]], "e": ["Sincronizar sem definir a entidade mestre de cada dado (conflitos de sobrescrita)", "Ignorar logs de sincronização quando os stocks 'não batem'"]}, "L53": {"c": "Faturação eletrónica = trocar faturas em formato estruturado (não PDF!). Em Portugal, a norma para o setor público é CIUS-PT (perfil nacional da norma europeia EN 16931); o envio faz-se por webservices/plataformas como SaphetyDoc (artigo oficial de configuração no Help Center) ou via Cegid Docs — que também faz arquivo digital legal: faturas de fornecedor CIUS-PT chegam, são anexadas em PDF e PRÉ-LANÇADAS automaticamente (202601). O módulo Documentos Eletrónicos trata de EAN/EDI. PDF não é fatura eletrónica — é impressão.", "s": [["CIUS-PT", "Especificação portuguesa de faturação eletrónica (obrigatória em contratação pública)."], ["SaphetyDoc", "Plataforma/webservice de troca de documentos eletrónicos com configuração documentada para o PHC."], ["Cegid Docs", "Gestão documental cloud + arquivo digital legal; pré-lançamento de faturas de fornecedor (202601+)."], ["Documentos Eletrónicos (módulo)", "EAN da empresa, EDI — infraestrutura de troca estruturada."], ["PDF/A-3 e anexos", "Arquivo com comprovativos anexos — o File Storage separa o que é fiscalmente relevante (BD) do resto."]], "e": ["Enviar PDF por e-mail e chamar-lhe fatura eletrónica (para o setor público não é)", "Pré-lançar faturas de fornecedor sem revisão humana inicial (validar o mapeamento antes de confiar)"]}, "L54": {"c": "Cegid Pulse é o ecossistema de IA do Evolution (plano Plus+): agentes que respondem em linguagem natural sobre os dados do ERP ('quais os clientes com faturas em atraso?'), assistentes de negócio por área (o primeiro: comercial) e Smart Tools que os PARCEIROS podem configurar e monetizar — com a função de framework PromptFunction() (202601). A ativação tem 3 passos: acesso ao módulo → ativar Cegid Account na ficha do utilizador → login (deteção automática). Dados confidenciais não saem do controlo do ecossistema Cegid. Antes do Pulse existiam a assistente Cris e o PHC CS GenAI (templates de Q&A, 202501).", "s": [["Cegid Pulse", "Agentes de IA no ERP com analítica sobre dados reais (vendas, tesouraria, stocks)."], ["Ativação em 3 passos", "1) acesso ao módulo; 2) Cegid Account na ficha do utilizador; 3) login detetado automaticamente."], ["Cegid Account", "Identidade única do ecossistema (Microsoft/Google + 2FA), ativação por utilizador (202601)."], ["Assistentes de negócio", "Assistentes por área configuráveis pelo utilizador (comercial primeiro)."], ["Smart Tools + PromptFunction()", "Ferramentas de IA configuráveis/monetizáveis pelos parceiros via framework."], ["Cris / GenAI", "Assistente e templates de perguntas-resposta anteriores ao Pulse (202501)."]], "e": ["Perguntar à IA e não validar contra os monitores/análises (a resposta deve conferir com os dados)", "Esquecer que o Pulse requer plano Plus+ e Cegid Account ativo por utilizador"]}, "L55": {"c": "Upgrades são o teste de maturidade do técnico: a cada versão (agora anual: 202501, 202601...) mudam funcionalidades, parâmetros e obrigações legais. O ritual: ler a Listagem de Novidades da versão de destino → clonar a BD → fazer o upgrade no clone → validar TUDO (abertura, séries, emissão, SAF-T, personalizações: campos/regras/eventos/IDUs/análises, web, integrações, alertas) → verificar Análise Interna/Log de Código → corrigir → agendar produção com backup fresco e plano de rollback. Personalizações vivem na BD: 'sobrevivem' na teoria — na prática, revalidam-se sempre.", "s": [["Listagem de Novidades", "Documento oficial por versão (Help Center/PDFs) — o mapa do que pode quebrar."], ["Clone primeiro", "Upgrade testa-se em BD clonada, nunca direto em produção."], ["Checklist de validação", "Lista escrita do que testar (séries, SAF-T, regras, eventos, IDUs, análises, web, integrações)."], ["Plano de rollback", "Backup pré-upgrade + procedimento de retorno se algo falhar."], ["Janela de paragem", "Upgrade faz-se sem utilizadores ligados (ficheiros/BD em uso bloqueiam)."]], "e": ["Upgrade 'à sexta às 18h sem clone' — o clássico que acaba em madrugada de domingo", "Não reler as novidades (a solução para o seu bug pode estar documentada lá)"]}, "L56": {"c": "O projeto final simula a implementação real — o que um consultor faz num cliente: diagnóstico do negócio (processos, volumes, obrigações) → desenho da solução (séries, circuitos, acessos, integrações) → configuração → migração de dados (Excel/ODBC, validação de saldos e stocks) → testes de ciclo completo → formação dos utilizadores → arranque assistido (go-live) → pós-arranque (ajustes, métricas). A diferença entre técnico e consultor expert: o expert desenha o processo ANTES de configurar, antecipa fiscalidade e upgrade, e mede o sucesso (tempo de faturação, erros, adoção).", "s": [["Diagnóstico", "Entrevistas + dados: o que a empresa vende/compra, como, volumes, obrigações, quem faz o quê."], ["Desenho da solução", "Séries e circuitos documentais, plano de contas de integração, acessos por perfil, integrações necessárias."], ["Migração de dados", "Carregamento de ficheiros (clientes, artigos, saldos, stock inicial via dossiers) com validação de totais."], ["Testes de aceitação", "Ciclos completos com dados reais + SAF-T validado antes do go-live."], ["Formação + manuais", "Utilizadores treinados nos SEUS processos (não nas funcionalidades genéricas)."], ["Go-live e pós-arranque", "Arranque assistido, janela de acompanhamento, métricas de sucesso e lista de melhorias."]], "e": ["Configurar antes de desenhar o circuito documental (refazer séries depois custa caro)", "Go-live sem saldos de abertura validados (C/C e stock errados desde o dia 1)"]}, "L57": {"c": "A Contabilidade do PHC é o destino final de tudo o que o Gestão produz: cada fatura, compra e recibo vira lançamento em contas SNC. Antes de automatizar, é preciso dominar a estrutura: o Plano de Contas (classes 1-8 do SNC), as propriedades de cada conta e a taxonomia (o mapa que liga as contas às rubricas das declarações fiscais). Sem esta base, qualquer integração automática gera lixo contabilístico.", "s": [["SNC", "Sistema de Normalização Contabilística português: 8 classes de contas (1 Meios financeiros, 2 Terceiros, 3 Inventários, 4 Investimentos, 5 Capital, 6 Gastos, 7 Rendimentos, 8 Resultados)."], ["Conta", "Código hierárquico (ex.: 211101) onde se registam movimentos; tem propriedades (IVA, moeda, integração)."], ["Taxonomia", "Tabela oficial que associa contas SNC a rubricas fiscais — base da IES/Modelo 22."], ["Plano de contas da empresa", "Desenho interno (subcontas por cliente/fornecedor/loja) que equilibra detalhe e manutenção."]], "e": ["Criar subcontas em excesso (211 por cada cliente) sem processo de manutenção — o plano incha e ninguém o usa", "Ignorar a taxonomia e descobrir o erro na entrega da IES"]}, "L58": {"c": "O diário é o 'caderno' onde se agrupa a escrituração por natureza de operação (geral, vendas, compras, caixa, bancos…). Cada diário tem numeração própria de documentos contabilísticos — sequencial e auditável. Uma boa estrutura de diários acelera reconciliações e fechos; uma má estrutura transforma qualquer auditoria em pesadelo.", "s": [["Diário", "Agrupamento lógico de lançamentos com numeração independente (ex.: Diário de Vendas = tudo o que vem da faturação)."], ["Documento contabilístico", "Peça numerada dentro do diário (um lote de integração ou um movimento manual)."], ["Pré-numeração vs automática", "Documentos podem receber número sugerido (pré-numerado) ou sequencial automático na gravação."], ["Período", "Janela temporal (mês/ano) que controla o que pode ser lançado — períodos fechados bloqueiam movimentos."]], "e": ["Misturar operações de naturezas distintas no mesmo diário (reconciliação impossível)", "Reabrir períodos fechados sem controlo — quebra a confiança nos números já reportados"]}, "L59": {"c": "O movimento contabilístico é a célula da contabilidade: linhas de débito e crédito que têm de somar igual (partida dobrada), com data, documento de suporte e período válido. No PHC, movimentos manuais coexistem com os automáticos (integração) — e ambos deixam rasto. Correções fazem-se por estorno/retificação, nunca por eliminação que destrua sequências.", "s": [["Partida dobrada", "Todo o lançamento tem débito = crédito; o software bloqueia movimentos desequilibrados."], ["Razão da conta", "Histórico de movimentos de uma conta — ferramenta de auditoria linha a linha."], ["Estorno/retificação", "Lançamento inverso que anula o erro mantendo o rasto (documento próprio)."], ["Imputação analítica", "Distribuição do movimento por centros/dimensões (departamento, projeto) quando a analítica está ativa."]], "e": ["Lançar sem documento de suporte (auditoria reprova)", "Corrigir apagando movimentos integrados em vez de estornar"]}, "L60": {"c": "Documentos pré-definidos são o motor da contabilização automática: para cada tipo de documento do Gestão (fatura, compra, recibo, NC…) define-se QUE contas usar (clientes 21, fornecedores 22, IVA 243, vendas 71, compras 31…), em que diário, com que regras de IVA e contrapartidas. É aqui que o ERP se torna 'um só sistema' — e é aqui que um erro de configuração se multiplica por milhares de documentos.", "s": [["Regra de contabilização", "Mapeamento tipo de documento → contas/diário/IVA, com exceções (intra-UE, adiantamentos, NC)."], ["Contas de integração", "Contas por entidade (cliente/fornecedor) ou genéricas com subconta automática."], ["Contrapartida", "O 'outro lado' do lançamento (ex.: venda: 21 débito × 71+243 crédito)."], ["Rejeições", "Documentos sem mapping completo não integram — o relatório do lote lista-os."]], "e": ["Configurar uma regra e não testar com documento real de cada tipo (NC, isento, intra-UE têm caminhos próprios)", "Mudar contas a meio do ano sem documentar — balancetes deixam de ser comparáveis"]}, "L61": {"c": "A integração periódica (diária, semanal ou mensal) transforma documentos do Gestão em lotes de lançamentos. O ciclo profissional: correr o lote → ler o relatório de execução → tratar rejeições na origem → reconciliar totais Gestão × Contabilidade (vendas×71, compras×31, IVA×243, bancos×12). Estornos e reintegrações têm procedimento próprio — nunca 'integrar outra vez por cima'.", "s": [["Lote de integração", "Conjunto de documentos processados numa corrida, com relatório e possibilidade de estorno."], ["Rejeição", "Documento que falhou o mapping (conta em falta, entidade nova) — corrige-se e reintegra."], ["Reconciliação", "Conferência de totais entre módulos: a diferença tem de ser zero ou explicada."], ["Estorno de lote", "Anulação completa de um lote integrado, para correção e reintegração limpa."]], "e": ["Ignorar o relatório de execução ('integrou quase tudo') — o 'quase' são documentos perdidos", "Reconciliar só no fim do ano (divergências acumuladas tornam-se irrecuperáveis)"]}, "L62": {"c": "O IVA é o imposto com operação mensal/trimestral mais sensível: o apuramento compara o IVA liquidado (das vendas, conta 243x) com o dedutível (das compras) e gera o valor a entregar ou recuperar. A Declaração Periódica de IVA sai do PHC com os campos do impresso oficial — e deve bater certo com o SAF-T de faturação e o e-Fatura. Prazos e regras (mensal vs trimestral) vêm do enquadramento do sujeito passivo.", "s": [["IVA liquidado", "IVA cobrado aos clientes nas vendas — entregue ao Estado."], ["IVA dedutível", "IVA pago nas compras/gastos — recuperável (regras de dedutibilidade)."], ["Apuramento", "Liquidação do saldo: a pagar (2432>2433) ou a recuperar/crédito."], ["Declaração Periódica", "Impresso oficial (campos) gerado a partir dos movimentos do período."], ["Coerência SAF-T", "Totais por taxa no SAF-T têm de coincidir com a declaração — divergência = inspeção."]], "e": ["Deduzir IVA não dedutível (ex.: parte de viaturas de turismo, despesas não documentadas)", "Declarar sem fechar o período (documentos lançados depois mudam os totais)"]}, "L63": {"c": "Do resultado bruto ao líquido: o CEVMC (custo do que foi vendido/consumido) deriva dos inventários do Gestão (existências iniciais + compras − finais, valorizadas a PCMP), os mapas de gestão (DR, Balanço, balancetes) são o output para direção e contabilista, e o apuramento de resultados fecha o ciclo do período. O report mensal de 1 página é o produto final que a gestão realmente lê.", "s": [["CEVMC", "Custo das Existências Vendidas e das Mercadorias Consumidas — alimentado pelos inventários valorizados."], ["Demonstração de Resultados (DR)", "Mapa legal: rendimentos − gastos = resultado do período."], ["Balanço", "Fotografia patrimonial: ativos = passivos + capital próprio."], ["Mapas de gestão", "Conjunto de relatórios configuráveis (balancetes, DR, balanço, rácios) exportáveis."]], "e": ["Fechar resultados sem inventário valorizado atualizado (CEVMC errado = margem fictícia)", "Enviar mapas sem reconciliar com o Gestão (a direção descobre as diferenças antes de si)"]}, "L64": {"c": "A contabilidade analítica acrescenta dimensões à geral: o MESMO movimento é imputado a centros (departamento, projeto, loja, viatura), permitindo responder 'quanto rende cada loja/projeto?'. No PHC, os centros analíticos alimentam-se de campos nos documentos do Gestão e nos movimentos, e o PHC XL dá músculo a grandes volumes. O desenho analítico (que dimensões, que regras de imputação) é decisão de gestão — técnico desenha, direção aprova.", "s": [["Centro analítico", "Unidade de imputação (loja, projeto, departamento) com resultados próprios."], ["Imputação", "Atribuição de valores de documentos/movimentos a centros (total ou rateio)."], ["Multidimensional", "Análise cruzada de dimensões (loja × família × mês)."], ["PHC XL", "Componente para grandes volumes e exploração analítica avançada."]], "e": ["Criar dezenas de centros sem regra de imputação clara (ninguém sabe onde lançar)", "Imputar 'a olho' rateios — sem critério documentado, a analítica perde credibilidade"]}, "L65": {"c": "A viragem de ano é a operação mais crítica do calendário contabilístico: pré-fecho (tudo integrado, IVA apurado, reconciliações zero, inventário valorizado), apuramento anual de resultados (classe 8 → resultados transitados), abertura do novo exercício com balanços de abertura e validação conta a conta. Sempre em clone primeiro, com backup testado e plano de reversão. Períodos do ano antigo fecham-se; acessos ajustam-se.", "s": [["Pré-fecho", "Checklist de validações antes de encerrar: integrações, reconciliações, inventário, IVA, movimentos em rascunho."], ["Apuramento anual", "Encerramento das contas de resultados (6/7/8) contra resultados transitados/reservas (5)."], ["Balanço de abertura", "Primeiro documento do novo ano: saldos finais do anterior como iniciais."], ["Períodos fechados", "Bloqueio de lançamentos em períodos encerrados — garante números reportados estáveis."]], "e": ["Executar a abertura em produção sem simular no clone (erros de abertura são caríssimos de desfazer)", "Virar o ano com reconciliações pendentes — o erro passa para o novo exercício ampliado"]}, "L66": {"c": "O Imobilizado gere o ciclo de vida dos ativos fixos: ficha (custo, data de entrada, taxa e método de depreciação), depreciações periódicas (com duodécimos no ano de entrada), reavaliações/revalorizações, imparidades e reversões, e abate/alienação com apuramento de ganhos/perdas. Cada evento integra na Contabilidade (ativo 43, acumuladas, gastos 64/65, resultados de alienação). As taxas seguem as tabelas legais (depreciações aceites fiscalmente).", "s": [["Ficha do ativo", "Registo central: identificação, custo de aquisição/produção, data de entrada, vida útil/taxa, contas."], ["Depreciações", "Gasto periódico do desgaste (linear/duodécimos), com mapa e integração automática."], ["Imparidade", "Perda de valor recuperável reconhecida como gasto (e reversível quando deixa de existir)."], ["Abate/alianação", "Saída do ativo (venda, abate): baixa do valor bruto e acumuladas, apuramento de ganho/perda."], ["Circuito genérico", "Fluxo entrada → depreciações → eventos (imparidades/reavaliações) → saída, tudo integrado."]], "e": ["Depreciar sem validar taxa legal/vida útil (correções fiscais depois)", "Esquecer o abate de ativos já inutilizados — balanço com 'fantasmas'"]}, "L67": {"c": "O módulo Pessoal começa na ficha do funcionário: identificação fiscal e social (NIF, NISS), contrato (tipo, data, categoria), retribuição (base, subsídio de alimentação, percentagem para parciais) e situação familiar (que determina a taxa de retenção de IRS). Uma ficha mal preenchida propaga erros a todos os recibos, declarações e pagamentos — a admissão é o momento de rigor máximo.", "s": [["NISS", "Número de Identificação da Segurança Social — obrigatório para TSU e declarações; a admissão comunica-se à SS."], ["Categoria/profissão", "Enquadra funções e, em alguns CCT, retribuições mínimas — aparece em mapas obrigatórios."], ["Situação familiar", "Estado civil, titularidade e dependentes: determina a taxa de retenção de IRS pelas tabelas em vigor."], ["Outros Profissionais", "Prestadores sem vínculo laboral (recibos verdes): processamento e declarações com regras próprias."], ["IBAN", "Dados de pagamento — validados antes do ficheiro SEPA para evitar devoluções."]], "e": ["Admitir sem comunicar à Segurança Social dentro do prazo (coima)", "Taxa de IRS 'a olho' em vez da tabelada pela situação familiar (acertos pesados no fim do ano)"]}, "L68": {"c": "O processamento mensal transforma contratos em recibos: abonos (base, subsídio de alimentação até ao limite isento, horas extra, subsídios) menos descontos (IRS retido + TSU 11% do trabalhador), resultando no líquido a pagar; a entidade patronal ainda suporta a TSU de 23,75%. O ciclo profissional: processar em lote → conferir casos especiais manualmente → fechar o mês (bloqueio) → gerar recibos e mapas. Reprocessar exige anulação formal — recibos emitidos não se 'apagam'.", "s": [["Abonos", "Rubricas que somam: vencimento base, subsídio de alimentação, horas extra, prémios, subsídios de férias/Natal (duodécimos ou por inteiro, conforme opção)."], ["Descontos", "Rubricas que subtraem: IRS (retenção na fonte), TSU 11%, adiantamentos, penhoras."], ["Matéria coletável", "Base de cálculo de IRS/TSU após regras de exclusão (ex.: subsídio de alimentação dentro do limite)."], ["Fecho do mês", "Bloqueio do processamento após validação — garante que recibos/mapas/declarações são consistentes."], ["Encargos patronais", "TSU 23,75% + seguros/fundos quando aplicáveis — visíveis nos mapas de encargos."]], "e": ["Fechar o mês sem conferir um recibo complexo (entradas/saídas a meio do mês, faltas, extra)", "Alterar fichas depois do fecho sem reprocessar (recibo ≠ ficha)"]}, "L69": {"c": "A retenção na fonte de IRS segue tabelas oficiais que mudam (por vezes a meio do ano): por situação familiar e escalão de remuneração. Desde a versão 202601 o PHC permite carregar tabelas com DATA DE VIGÊNCIA — antigas e novas coexistem e o processamento aplica automaticamente a correta pela data. O técnico deve saber carregar, validar vigências e tratar exceções (deficiência, taxas manual/fixa com justificação).", "s": [["Tabelas de retenção", "Tabelas legais por situação familiar (não casado, casado 1/2 titulares, deficientes) e escalões."], ["Data de vigência", "Cada tabela vale a partir de uma data — o processamento escolhe pela data do recibo (202601+)."], ["Taxa manual/fixa", "Exceções justificadas (ex.: rendimento variável, pedido do trabalhador dentro das regras) — documentar sempre."], ["Acerto anual", "A retenção é um adiantamento; o acerto faz-se na declaração de IRS do trabalhador (o empregador declara via DMR)."]], "e": ["Processar com a tabela errada no mês de transição (recalculado depois com atrasos e confusão)", "Aceitar 'taxas a pedido' sem enquadramento legal"]}, "L70": {"c": "A gestão de tempo alimenta diretamente o recibo: férias (22 dias úteis + majorações), faltas (justificadas com/sem perda de retribuição, injustificadas), horas extra (com majorações por limite legal) e feriados. O Mapa de Férias é obrigatório e as ausências têm efeito automático no processamento do mês. Regras vêm do Código do Trabalho e de instrumento de regulamentação coletiva aplicável (CCT).", "s": [["Direito a férias", "22 dias úteis por ano (regra geral), com majorações legais; férias não gozadas têm tratamento na cessação."], ["Tipos de falta", "Justificada (com ou sem retribuição) vs injustificada (perda de retribuição e efeitos disciplinares) — cada tipo configura-se."], ["Horas extra", "Majorações legais e limites anuais; registo por funcionário/período."], ["Meio-dia de férias", "Funcionalidade específica para gozo parcial de dias."], ["Mapa de Férias", "Documento obrigatório com o planeamento anual — gerado pelo módulo."]], "e": ["Marcar férias sem verificar o direito disponível (dias negativos no fim do ano)", "Esquecer faltas por registar antes do fecho (recibos errados e reprocessamento)"]}, "L71": {"c": "O calendário declarativo de RH: DMR (Declaração Mensal de Remunerações) à AT todos os meses; declarações à Segurança Social (DRI) com os respetivos prazos; Relatório Único anual (vários anexos: quadro de pessoal, fluxos, prestação de serviços); mapas obrigatórios variados. Desde 12/05/2026 a SS Direta exige 2FA para empresas (software atualizado na 202601), e a DMR passou a ser emitida sem valores negativos (rejeições evitadas).", "s": [["DMR", "Declaração mensal à AT com remunerações, retenções e contribuições por trabalhador — prazo: até ao fim do mês seguinte."], ["DRI/SS", "Declaração de remunerações à Segurança Social (base da TSU) com entrega mensal."], ["Relatório Único", "Obrigação anual (março/abril) com anexos de recursos humanos e prestação de serviços."], ["2FA SS Direta", "Autenticação de dois fatores obrigatória para empresas desde 12/05/2026 — comunicações dependem dela."], ["DMR sem negativos", "Validação 202601: a declaração não sai com valores negativos (correções fazem-se por declaração de substituição)."]], "e": ["Perder prazos declarativos (coimas automáticas)", "Esquecer 'Outros Profissionais' nas declarações (prestadores de serviços também se declaram)"]}, "L72": {"c": "A cessação tem ritual próprio: aviso prévio (conforme o tipo de contrato e antiguidade), cálculo do acerto final (retribuição do período, férias vencidas não gozadas + subsídio, proporcionais de férias e subsídio de Natal conforme regime), tratamento de fundos (FGCT/FCT quando aplicáveis), último recibo com rubricas próprias e registo do motivo (efeitos em mapas/declarações). Prazos e valores seguem o Código do Trabalho — erros aqui geram litígios.", "s": [["Aviso de fim de contrato", "Comunicação com antecedência legal (termo certo: 15/8 dias conforme duração; outras modalidades têm regras próprias)."], ["Valores à saída", "Cálculo automático: férias não gozadas, proporcionais de subsídios, créditos/débitos pendentes (adiantamentos, faltas)."], ["FGCT/FCT", "Fundos de compensação do trabalho (entregas semestrais do empregador) quando aplicáveis ao contrato."], ["Motivo de cessação", "Classificação legal (caducidade, revogação, despedimento…) — determina direitos e mapas."], ["Últimas obrigações", "Recibo final, certificados, comunicação à SS/AT e saída dos mapas periódicos."]], "e": ["Calcular o acerto 'de cabeça' sem usar a ferramenta de cálculo (esquece proporcionais/dias exatos)", "Cessar sem verificar adiantamentos/dívidas do trabalhador (acerto fica incompleto)"]}, "L73": {"c": "Os casos especiais do processamento: adiantamentos (descontados no recibo seguinte), despesas reembolsáveis (com documento de suporte e regras de tributação), penhoras de vencimento (ofício judicial, com limites legais de impenhorabilidade — desde 202601 processáveis também na web), remunerações em espécie (viatura, alojamento — com enquadramento IRS/TSU) e vales sociais. Cada um tem rubrica e regra próprias — configurar uma vez, aplicar sempre.", "s": [["Adiantamento salarial", "Pagamento antecipado descontado automaticamente no processamento seguinte."], ["Despesas de funcionário", "Reembolsos com suporte documental; tributação conforme a natureza (ajudas de custo têm regras próprias)."], ["Penhora", "Desconto judicial com limite legal (proteção do mínimo vital); 202601 trouxe penhoras ao processamento web."], ["Remuneração em espécie", "Bens/serviços cedidos para uso pessoal (ex.: viatura) — relevância fiscal em IRS/TSU conforme regras."], ["Vales sociais", "Apoios (ex.: infância) com tratamento fiscal específico."]], "e": ["Descontar penhora sem validar o limite legal (responsabilidade da empresa)", "Reembolsar despesas sem suporte/regras (risco fiscal)"]}, "L74": {"c": "O ciclo de RH só fecha quando o dinheiro sai e os números entram na contabilidade: o processamento integra na Contabilidade por documentos pré-definidos (gastos 63 × remunerações a pagar 23 × retenções 24/SS), o pagamento faz-se por ficheiro SEPA em lote (validação de IBANs e totais), e a reconciliação final exige: líquidos dos recibos = total SEPA = movimento da conta 23 = valores declarados (DMR/SS). É o fecho mensal de RH — calendário fixo, sem improviso.", "s": [["Integração do processamento", "Lançamento automático: débito 63 (gastos com pessoal), créditos 23 (líquidos a pagar), 24 (IRS retido) e contas de SS."], ["Ficheiro SEPA de salários", "Transferências em lote normalizadas — validação de IBANs e totais antes da entrega ao banco."], ["Pagamento → baixa", "Após pagamento, a conta 23 é debitada contra o banco (12) — a conta de pessoal fica saldada."], ["Reconciliação 4 vias", "Recibos × SEPA × Contabilidade × Declarações — tudo igual ou o fecho não fecha."], ["Alertas de fim de mês", "Notificações para não perder o calendário (processar, pagar, declarar)."]], "e": ["Pagar salários antes de integrar na contabilidade (mês desfechado)", "SEPA com IBAN inválido devolvido pelo banco e salário em atraso (validar antes!)"]}, "L75": {"c": "O POS não é um programa à parte: é o braço de balcão do mesmo ERP. A loja (com o seu armazém), a série documental (FS), os operadores (com permissões granulares) e os meios de pagamento definem-se uma vez e tudo o que se vende no balcão cai no Gestão, na tesouraria e no SAF-T como qualquer documento. Escolher POS Desktop (backoffice), POS Front (toque) ou POS Web depende da operação.", "s": [["POS Desktop", "Aplicação de backoffice da loja (venda com rato/teclado, gestão de caixas, fechos)."], ["POS Front", "Interface de toque otimizada para venda rápida (o 'um dia na loja')."], ["Loja", "Entidade com armazém próprio, caixa e operadores — o stock da loja é um armazém como outro qualquer."], ["Operador com permissões", "Cada ação sensível (anular, descontar, reabrir gaveta, reimprimir) pode exigir permissão/autorização."], ["Série do POS", "Tipicamente FS a consumidor final, com numeração e QR/ATCUD obrigatórios."]], "e": ["Vender no POS com série mal configurada (sem movimento de stock ou tesouraria) e descobrir no fim do mês", "Operadores todos com permissões máximas (impossível auditar diferenças de caixa)"]}, "L76": {"c": "'Um dia na loja' é o teste real do POS: vender rápido (código de barras, famílias em ecrã de toque), receber em vários meios, devolver/trocar com reposição de stock, identificar cliente quando pedido (NIF na fatura), suspender talões para não bloquear a fila. A velocidade do caixa mede-se: 5 vendas completas em menos de 5 minutos é o padrão de um operador treinado.", "s": [["Venda por código de barras", "Leitura EAN → linha no talão; a busca por designação/família é o plano B."], ["Pagamento multi-meio", "Numerário (troco automático), TPA, MB — o talão discrimina e o fecho reconcilia."], ["Devolução/troca", "Reposição de stock e NC (ou vale, conforme política) — com permissão e rasto."], ["Suspender talão", "Pôr uma venda em pausa (cliente foi buscar mais artigos) sem perder a fila."], ["Consumidor final", "Cliente genérico sem NIF; quando o cliente pede fatura com NIF, regista-se no documento."]], "e": ["Caixa sem formação em devoluções (faz NC errada ou devolve dinheiro sem documento)", "Fila parada por artigo sem código — manter ficheiro de artigos com EAN atualizado"]}, "L77": {"c": "A caixa é onde o dinheiro físico e o sistema têm de coincidir ao cêntimo: abertura com fundo de maneio, sangrias para o cofre (reduzir risco), transferências entre caixas/banco e fecho com contagem física de notas e moedas. Diferenças apuram-se no fecho (quebra/sobra com responsável e justificação) e integram-se na tesouraria. Rotina diária disciplinada previne 90% dos problemas de caixa.", "s": [["Fundo de maneio", "Numerário inicial para trocos — registado na abertura."], ["Sangria", "Retirada programada de numerário para cofre (segurança + controlo)."], ["Transferência entre caixas", "Movimento entre contas de tesouraria (caixa loja → caixa sede/banco)."], ["Fecho com contagem", "Contagem física (notas e moedas) comparada com o sistema — diferenças documentadas."], ["Quebra/sobra de caixa", "Registo da diferença com responsável e motivo — padrão recorrente exige investigação."]], "e": ["Fechar caixa sem contagem física ('o sistema diz que está certo')", "Adiar sangrias em dias de muito numerário (gaveta cheia = risco)"]}, "L78": {"c": "Vales são instrumentos comerciais com pés fiscais: o vale de reembolso dá crédito de devolução sem saída de dinheiro (emissão na devolução, resgate numa compra futura, com validade); o cheque-oferta é vendido (regras de IVA próprias conforme tipo de voucher); o vale de desconto abate numa compra. Cada um precisa de política escrita: validades, acumulabilidade, troco, e relatório de emitidos/usados/expirados.", "s": [["Vale de reembolso", "Crédito comercial emitido numa devolução — usado como meio de pagamento numa venda futura."], ["Cheque-oferta (vale oferta)", "Valor pré-pago vendido a terceiros; resgate em compras. IVA conforme regras de vouchers."], ["Vale de desconto", "Cupão promocional que abate valor/percentagem numa venda."], ["Circuito do vale", "Emissão → validade → utilização (total/parcial) → expiração — auditável por relatório."], ["Assistente de vales (touch)", "Fluxo guiado no POS Front para emissão rápida no balcão."]], "e": ["Vales sem validade definida (passivo comercial eterno no balanço)", "Devolução em vale sem registar o documento fiscal correspondente (NC quando aplicável)"]}, "L79": {"c": "O dinheiro eletrónico no balcão tem dois lados: a venda (TPA/MB registam o meio de pagamento no talão e no fecho) e a liquidação (o banco credita dias depois, líquido de comissões). Por isso o fecho de caixa discrimina por meio de pagamento e a reconciliação é a três vias: talões do terminal × fecho POS × extrato bancário. O segundo monitor (Advanced+) mostra ao cliente totais/publicidade — e as referências MB permitem cobrar encomendas de balcão.", "s": [["TPA", "Terminal de pagamento automático — a ligação ao POS evita digitação de valores (menos erros)."], ["Breakdown por meio de pagamento", "O fecho separa numerário/TPA/MB — cada um reconcilia de forma diferente."], ["Comissões de TPA", "Custo do meio de pagamento — visível no extrato, não no talão; entra na tesouraria real."], ["Segundo monitor", "Ecrã virado ao cliente (totais, publicidade) — gama Advanced+ no POS desktop."], ["Referências Multibanco", "Cobrança de pendentes/encomendas com identificação automática do recebimento."]], "e": ["Confiar só no total do fecho sem reconciliar TPA×banco (comissões e atrasos escondem-se aí)", "Digitar valores no TPA manualmente quando há integração (erro humano clássico)"]}, "L80": {"c": "Promoção boa aumenta rotação sem destruir margem — e sem erro fiscal. Tipos: percentagem, valor, 2-por-1, packs, artigo oferta, com datas de validade e âmbito (artigos/famílias). Regras de prioridade entre promoção, tabela de preços e desconto de cliente têm de estar configuradas e testadas. O IVA incide sobre o preço efetivamente cobrado. No fim, mede-se: vendas dos promovidos antes/depois e margem realizada.", "s": [["Tipos de promoção", "Percentagem, valor fixo, quantidade (2×1, leve 3 pague 2), pack/preço conjunto — conforme versão/gama."], ["Validades", "Início/fim automáticos: a promoção liga e desliga sozinha."], ["Prioridade", "Promoção vs tabela de preços vs desconto de cliente — ordem definida evita 'descontos duplos' acidentais."], ["Preço tributável", "O IVA calcula-se sobre o valor efetivamente cobrado após promoção."], ["Medição", "Relatório de vendas/margem dos artigos promovidos no período — sem medição, promoção é chute."]], "e": ["Promoção sem margem mínima validada (vende muito, perde dinheiro)", "Esquecer o fim da promoção e o preço voltar à tabela a meio de uma campanha negociada"]}, "L81": {"c": "O valor do POS integrado: cada talão é um documento de faturação real (FS na tabela FT), com stock baixado no armazém da loja, tesouraria na caixa e SAF-T correto. O Monitor do POS vigia caixas e documentos; os templates definem o talão (logótipo, mensagens legais, QR/ATCUD). O fecho do dia produz o resumo para a direção. Quebras de rede têm procedimento (pendentes/offline conforme a solução) — teste antes de precisar.", "s": [["Talão = documento FT", "O FS do POS vive na mesma tabela dos restantes documentos de faturação — análises e SAF-T unificados."], ["Templates do POS", "Layout do talão e ecrãs (logótipo, mensagens, QR/ATCUD obrigatórios)."], ["Monitor do POS", "Vigilância operacional: caixas abertas, estados de documentos, pendentes."], ["Resumo diário", "Vendas por loja/meio/período para a direção — automatizável."], ["Contingência de rede", "Comportamento sem ligação (venda pendente/offline) — conhecer ANTES da falha."]], "e": ["Tratar o POS como 'caixa registadora isolada' e reconciliar só no fim do mês", "Template de talão sem QR/ATCUD após atualização (documento não conforme)"]}, "L82": {"c": "Retalho de moda e omnicanalidade exigem estrutura de dados certa: grelha de cores/tamanhos (um artigo-pai, variantes por combinação — stock e vendas por variante sem multiplicar referências), EAN por variante para etiquetas e leitura, e stock único partilhado com o canal online (via EyePeak ou sincronização documentada). Click & collect e devolução cruzada (comprar online, devolver em loja) são fluxos que se desenham e testam — o stock tem de estar certo nos dois mundos.", "s": [["Grelha cores/tamanhos", "Matriz de variantes do artigo-pai (setor vestuário/calçado) — opção do módulo conforme versão."], ["EAN por variante", "Cada combinação tem o seu código de barras para venda e etiquetagem."], ["Stock único", "Loja física e online consomem o mesmo stock (sincronização EyePeak ou processo definido)."], ["Click & collect", "Encomenda online levantada/paga em loja — movimento de stock e documento corretos."], ["Vendas por variante", "Análise cor/tamanho guia compras e saldos — decisão baseada em dados."]], "e": ["Criar um artigo por variante em vez de usar grelha (ficheiro ingovernável)", "Vender online stock que a loja já vendeu (sem sincronização, a rutura é pública)"]}, "L83": {"c": "O módulo Suporte transforma o pós-venda em processo: o Pedido de Assistência Técnica (PAT) é o documento central, desde a chamada do cliente até à faturação. Assenta em três registos-mestre — instalações (onde está), equipamentos (o quê, com nº de série) e contratos (em que condições) — e integra-se com o Gestão para peças (stock), serviços (tabelas de horas) e faturação. Configurar tipos, prioridades e SLA no início é o que separa suporte profissional de bombeiro.", "s": [["PAT", "Pedido de Assistência Técnica: documento do pedido à resolução, com tempos, materiais e estados."], ["Tipos e prioridades", "Classificação que define fila e SLA (instalação, reparação, manutenção; urgente, normal…)."], ["Equipa/competências", "Técnicos com skills e disponibilidade — base da atribuição certa."], ["Integração Gestão", "Peças saem do stock, serviços entram na fatura — nada de registos paralelos."]], "e": ["Registar intervenções fora do sistema (caderneta/WhatsApp) e perder histórico e faturação", "Sem prioridades/SLA definidos, tudo é urgente e nada é medido"]}, "L84": {"c": "O parque instalado é o ativo de conhecimento do suporte: instalações (locais do cliente), equipamentos (unidades com número de série, garantia, histórico) e contratos (cobertura, SLA, avença ou pontos). Quando o cliente liga, o operador identifica o equipamento e vê em segundos: garantia, contrato, intervenções anteriores. Esta visão 360º é o que faz o atendimento parecer mágica — e é só disciplina de registo.", "s": [["Instalação", "Local do cliente com os seus equipamentos (morada, contactos, acessos)."], ["Equipamento com nº série", "Unidade individual: garantia, histórico de intervenções, peças associadas."], ["Contrato de manutenção", "Cobertura (o quê, em que prazo), modelo (avença/pontos) e validade."], ["Visão 360º", "Do equipamento chega-se a contrato, cliente, histórico e documentos — e vice-versa."]], "e": ["Vender equipamento sem registar nº de série (garantias e recalls impossíveis de gerir)", "Contratos sem cobertura escrita clara — cada intervenção vira discussão comercial"]}, "L85": {"c": "O ciclo de vida do PAT: abertura (identificação rápida de cliente/equipamento/problema), classificação (tipo, prioridade, SLA), atribuição (técnico certo), agendamento (janela comunicada), intervenção (tempos e materiais registados NO ATO), estados atualizados com timestamp e fecho validado pelo cliente. Cada campo alimenta algo: SLA, faturação, histórico e KPIs. Registar depois 'à memória' é onde a qualidade morre.", "s": [["SLA", "Compromisso de tempo (resposta/resolução) por prioridade — medido pelos timestamps dos estados."], ["Tempos de mão de obra", "Horas por técnico/tabela — viram serviço faturável."], ["Materiais/peças", "Consumos com baixa de stock automática no documento."], ["Estados com data", "Aberto → atribuído → em curso → resolvido → fechado/faturado — a linha de tempo do serviço."], ["Validação do cliente", "Confirmação no fecho (assinatura/aceitação) — proteção contra disputas."]], "e": ["Intervenção sem registo de tempos (serviço prestado de graça por desorganização)", "Mudar prioridades sem critério — o SLA perde o significado"]}, "L86": {"c": "Escala exige ferramentas de coordenação: abertura especial (PAT pré-preenchido a partir do equipamento/contrato), agenda de marcações (janelas por técnico) e o Monitor de PATs (fila em tempo real: estados, atrasos de SLA, carga por técnico). O coordenador trabalha pelo monitor: atribui o que está parado, protege os SLA em risco e reage a urgências. Alertas automáticos (sem atribuição, SLA a estourar) tiram a vigilância manual da equação.", "s": [["Abertura especial", "Criação de PAT com origem (equipamento/contrato/série) — menos digitação, mais dados corretos."], ["Agenda de Marcações", "Planeamento por técnico/dia com janelas — comunica-se ao cliente o que se pode cumprir."], ["Monitor de PATs", "Painel operacional: fila, SLA, carga, atrasos — a ferramenta do coordenador."], ["Alertas automáticos", "Notificações por exceção (parados, sem técnico, SLA em risco)."]], "e": ["Coordenar por memória/planilha paralela (o monitor existe para isso)", "Agendar sem verificar disponibilidade real do técnico (janela prometida ≠ janela cumprida)"]}, "L87": {"c": "O relatório de intervenção é a face visível do serviço: diagnóstico, ações executadas, peças usadas, tempos e recomendações — num template profissional, com assinatura digital do cliente capturada no ato e envio automático por e-mail. É documento de qualidade, prova de aceitação (incluindo de custos extra aprovados) e base de faturação sem disputas. Fotos e anexos (File Storage) completam o registo.", "s": [["Template de relatório", "Estrutura padrão: identificação, diagnóstico, ações, peças, tempos, recomendações."], ["Assinatura digital", "Captura no dispositivo (touch) — aceitação formal do serviço prestado."], ["Envio automático", "E-mail ao cliente com o PDF (SMTP configurado) — profissionalismo e rasto."], ["Anexos", "Fotos/documentos associados à intervenção (File Storage/Cegid Docs)."], ["Aprovação de custos", "Peças/trabalhos fora de cobertura aprovados pelo cliente ANTES de executar (registado)."]], "e": ["Relatório vago ('reparado') — sem detalhe não há prova nem upsell de recomendações", "Executar extras sem aprovação registada (a fatura vem devolvida)"]}, "L88": {"c": "Serviço prestado e não faturado é perda dupla (custo + receita). A faturação do Suporte cobre três fontes: PATs avulso (horas × tabela + peças), instalações (montagens/ativações) e contratos (avenças recorrentes via Dossier de Avenças ou consumo de pontos). Parciais existem (cliente aprova só parte) e o remanescente fica pendente. O fecho mensal reconcilia PATs resolvidos × documentos emitidos — nada pode escapar.", "s": [["Faturação de PAT", "Mão de obra (tabelas de horas/serviços) + materiais (stock) no documento de faturação."], ["Faturação de instalações", "Trabalhos de montagem/ativação com materiais e horas."], ["Faturação de contratos", "Recorrência (avenças) ou consumo (pontos) — integração com emissão automática."], ["Faturação parcial", "Aprovação parcial do orçamento: fatura-se o aprovado, o resto fica pendente/por decidir."], ["Reconciliação mensal", "Resolvidos × faturados = zero diferenças (o controlo anti-fuga)."]], "e": ["Fecho mensal sem reconciliação (PATs 'esquecidos' acumulam-se)", "Tabela de horas desatualizada (fatura-se 2023 em 2026)"]}, "L89": {"c": "O que se mede, melhora-se. Pontos: pacotes pré-pagos que o cliente consome por intervenção (saldo visível, receita antecipada, fidelização). Análises: tempos médios (atendimento/resolução), volume por técnico/cliente/tipo, first-time-fix e rentabilidade por contrato (receita − horas − peças). Com os números, o diretor decide: ajustar SLA, reforçar formação, renegociar contratos deficitários ou automatizar o que se repete.", "s": [["Gestão de pontos", "Pacotes vendidos e consumidos por tipo de intervenção — saldo e extracto por cliente."], ["Tempo médio de resolução (TMR)", "Do registo à resolução, por prioridade/tipo — o KPI de eficiência central."], ["First-time-fix", "% de PATs resolvidos na primeira visita — qualidade + custos de deslocação."], ["Rentabilidade por contrato", "Receita do contrato − (horas técnicas + peças + deslocações) — contratos negativos renegociam-se."], ["Dashboard de suporte", "KPIs num painel para a direção (monitor/dashboard do PHC)."]], "e": ["Medir só volume de PATs (produtividade sem qualidade esconde retrabalho)", "Manter contratos deficitários por inércia — a análise existe para os renegociar"]}}};
