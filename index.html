isto de tempos (mão de obra) e materiais/peças consumidos", "Atualizar estados do PAT (aberto → em curso → resolvido) com notas de intervenção", "Fechar o PAT com a validação do cliente e gerar o documento para faturação", "Consultar o histórico completo do PAT (quem, quando, o quê)", "Repetir com um segundo PAT urgente e comparar tempos"], "proofs": [{"d": "Print do PAT aberto com classificação e técnico atribuído", "k": "print"}, {"d": "Print do PAT resolvido com tempos e materiais", "k": "print"}, {"d": "Print do histórico/linha de tempo do PAT", "k": "print"}], "ask": [{"q": "Que campos alimentam a faturação do PAT?", "a": "Tempos de mão de obra (tabela de horas/serviços) + materiais consumidos (baixa de stock) — o PAT gera o documento de faturação correspondente."}, {"q": "Por que registar estados com timestamp?", "a": "SLA mede-se: tempo de resposta e tempo de resolução só existem com estados datados — e o cliente pergunta sempre."}]}, {"id": "L86", "t": "Aberturas especiais, agenda e monitor de PATs", "lv": 12, "min": 75, "meta": "25 min", "pre": ["L85"], "ref": "Programa oficial (Abertura Especial de PAT, Monitor de PATs, Agenda de Marcações)", "goal": "Ganhar escala: entradas automáticas, agenda de técnicos e visão operacional em tempo real.", "steps": ["Usar a abertura especial de PAT (a partir do equipamento/contrato/série — origem pré-preenchida)", "Configurar a Agenda de Marcações (marcações por técnico/dia com janelas)", "Abrir o Monitor de PATs: estados, prioridades, atrasos de SLA, carga por técnico", "Reordenar a fila do dia com base no monitor (urgências primeiro)", "Configurar alertas automáticos (PAT sem atribuição, SLA a estourar, PAT parado)", "Testar a remarcação de uma intervenção (efeito na agenda e no SLA)", "Definir a rotina diária do coordenador de suporte em notas/coordenacao.md (manhã: monitor → atribuições → alertas)"], "proofs": [{"d": "Print do Monitor de PATs com a fila do dia", "k": "print"}, {"d": "Print da Agenda de Marcações de um técnico", "k": "print"}, {"d": "Print de um alerta de SLA disparado", "k": "print"}, {"d": "coordenacao.md com a rotina diária", "k": "file"}], "ask": [{"q": "Qual o KPI mais importante no monitor?", "a": "PATs fora do SLA (resposta/resolução) por técnico e por prioridade — é o que dispara ação imediata; volume em fila é o segundo."}]}, {"id": "L87", "t": "Intervenções: relatório, assinatura e envio", "lv": 12, "min": 60, "meta": "20 min", "pre": ["L85"], "ref": "Cap. 7.4 (Definição de Assinaturas) + manuais do Suporte", "goal": "Profissionalizar a intervenção no terreno: relatório claro, assinatura do cliente e envio automático.", "steps": ["Configurar o template do relatório de intervenção (campos: diagnóstico, ações, peças, tempos, recomendações)", "Capturar a assinatura digital do cliente no ato (tablet/touch — Definição de Assinaturas)", "Configurar o envio automático do relatório por e-mail ao cliente (SMTP)", "Anexar fotos/documentos à intervenção (File Storage, se ativo)", "Registar uma intervenção com peças fora de garantia e validar a aprovação de custo pelo cliente", "Testar o fluxo completo: intervenção → assinatura → e-mail recebido → PAT pronto a faturar", "Documentar o padrão de qualidade do relatório em notas/relatorio.md"], "proofs": [{"d": "Relatório de intervenção com assinatura capturada (print/PDF)", "k": "file"}, {"d": "E-mail de envio do relatório (print)", "k": "print"}, {"d": "relatorio.md com o padrão definido", "k": "file"}], "ask": [{"q": "Para que serve a assinatura digital no relatório?", "a": "Prova de aceitação do serviço (e de eventuais custos extra) — reduz disputas de faturação e dá suporte legal ao trabalho realizado."}]}, {"id": "L88", "t": "Faturação do Suporte: intervenções, instalações e contratos", "lv": 12, "min": 75, "meta": "25 min", "pre": ["L87", "L20"], "ref": "Programa oficial (Faturar Instalações, Faturação de Contratos)", "goal": "Transformar serviço prestado em receita faturada, sem fugas.", "steps": ["Faturar um PAT resolvido: mão de obra (horas × tabela) + materiais (peças do stock)", "Faturar uma instalação (trabalho de montagem/ativação com materiais)", "Configurar e processar a faturação de contratos (avenças recorrentes — integração com Dossier de Avenças)", "Testar faturação parcial (cliente aprova só parte do orçamento) e o remanescente", "Verificar IVA e retenções aplicáveis a serviços de assistência", "Conferir a conta corrente do cliente após a faturação dos serviços", "Reconciliar: PATs resolvidos do mês × documentos faturados (nada pode ficar por faturar)", "Documentar o fecho mensal do Suporte em notas/fecho-suporte.md"], "proofs": [{"d": "Fatura de intervenção com horas + peças (PDF)", "k": "file"}, {"d": "Print da reconciliation PATs resolvidos × faturados", "k": "print"}, {"d": "fecho-suporte.md com o checklist mensal", "k": "file"}], "ask": [{"q": "A fuga de receita clássica do Suporte?", "a": "PAT resolvido não faturado (peças e horas perdidas) — o fecho mensal reconcilia resolvidos × faturados e apanha tudo."}, {"q": "Contratos: avença vs pontos?", "a": "Avença = valor fixo periódico com cobertura definida; pontos = pré-pago consumido por intervenção. Muitos contratos misturam ambos."}]}, {"id": "L89", "t": "Pontos, análises e KPIs de suporte", "lv": 12, "min": 75, "meta": "25 min", "pre": ["L88"], "ref": "Programa oficial (Gestão de Pontos no Suporte, Análises do PHC Suporte)", "goal": "Medir e melhorar: sistema de pontos, indicadores de serviço e rentabilidade.", "steps": ["Configurar a Gestão de Pontos: pacotes vendidos, regras de consumo por tipo de intervenção", "Vender um pacote de pontos ao cliente e consumir num PAT (verificar saldo)", "Consultar o saldo/extracto de pontos do cliente (visível ao comercial)", "Explorar as Análises do Suporte: tempo médio de atendimento/resolução, PATs por técnico/cliente/tipo", "Calcular a rentabilidade por contrato (receita − horas − peças) para os 3 maiores contratos", "Configurar um dashboard/monitor de KPIs de suporte para a direção", "Propor 3 melhorias concretas baseadas nos números (em notas/kpis-suporte.md) e apresentá-las (2 min gravados)"], "proofs": [{"d": "Print do saldo de pontos após consumo num PAT", "k": "print"}, {"d": "Print das análises com tempos médios", "k": "print"}, {"d": "kpis-suporte.md com as 3 melhorias + gravação de 2 min", "k": "file"}], "ask": [{"q": "Que KPIs um diretor de suporte olha todos os dias?", "a": "Fila e atrasos de SLA, tempo médio de resolução, primeira-visita-resolve (first-time-fix), utilização dos técnicos e receita por contrato vs custo."}]}], "cards": [{"t": "O que é o Cegid PHC Evolution?", "b": "Sucessor do PHC CS desktop: mesma plataforma + subscrição anual, web incluído, IA (Cegid Pulse), Cegid Docs e open banking.", "lv": 0}, {"t": "Planos de subscrição do Evolution?", "b": "Standard, Plus, Advanced, Premium e Ultimate (BD 10 GB nos dois primeiros; web e Pulse a partir do Plus).", "lv": 0}, {"t": "Gamas funcionais históricas do PHC CS?", "b": "Corporate (micro/pequenas), Advanced (PME, personalização e análises), Enterprise (aprovações, eventos/páginas completos, log de atividade).", "lv": 0}, {"t": "Como é o versionamento atual do PHC CS/Evolution?", "b": "Anual: AAAANN — ex.: 202501, 202504, 202601 (antes: v18…v30).", "lv": 0}, {"t": "O que faz o 'exe único' de instalação?", "b": "Instala a aplicação, cria/attacha a base de dados e configura o ODBC automaticamente.", "lv": 0}, {"t": "BD mínima segundo os termos de licenciamento?", "b": "SQL Server 2008R2+ (instalações atuais: 2012+; Express típico no Corporate).", "lv": 0}, {"t": "Relação empresa × base de dados?", "b": "Cada empresa = uma BD SQL Server própria.", "lv": 0}, {"t": "Onde ficam os erros de eventos Xbase?", "b": "Na Análise Interna (desktop); na web, no Log de Código. Linha 0 = erro em expressão (não programa).", "lv": 0}, {"t": "O que mostra o Dicionário de Dados?", "b": "Campos, descrições, tipos e tamanhos de QUALQUER tabela + relações entre tabelas (desde a v2008). Menu Supervisor > Tratamento da base de dados.", "lv": 0}, {"t": "O que é o PHC On?", "b": "Acordo anual: atualizações de software e legislação + portal on.phc.pt (formação online, autoformação, truques e dicas) + Calendário PHC de obrigações legais.", "lv": 0}, {"t": "Como se entra na Comunidade PHC?", "b": "community.phcsoftware.com com Nº de Cliente + ID Técnico + password (área de parceiros/clientes).", "lv": 0}, {"t": "O que é o PEP?", "b": "Cegid PHC Evolution Program: especialização prática de 140 h, online pós-laboral, com certificação oficial Cegid (instalação, SQL, módulos, processos).", "lv": 0}, {"t": "Onde estão os manuais oficiais públicos?", "b": "Help Center (helpcenter.phccs.net / phc.pt portal) + botão Ajuda dentro da aplicação (manuais in-app).", "lv": 0}, {"t": "Menu Supervisor serve para quê?", "b": "Administração: Framework PHC (personalização), Tratamento da base de dados (dicionário, desfragmentação), monitores (ex.: EyePeak Sincronização).", "lv": 0}, {"t": "Menu Sistema serve para quê?", "b": "Parâmetros gerais e por módulo, utilizadores, configuração da aplicação.", "lv": 0}, {"t": "O que é 'ecrãs em memória'?", "b": "Parâmetro de performance: ecrãs principais fechados mantêm-se em memória e reabrem instantaneamente.", "lv": 0}, {"t": "O que faz o parâmetro 'processamento assíncrono'?", "b": "Gravação/processamento de documentos em background; o documento fica marcado como 'não processado' até concluir (inibe gravação correta se algo falhar).", "lv": 0}, {"t": "O que é o File Storage (202501+)?", "b": "Armazenamento de anexos em diretoria física, na BD ou ambos; documentos fiscalmente relevantes ficam sempre na BD.", "lv": 0}, {"t": "O que é o Cegid Account?", "b": "Autenticação híbrida do ecossistema Cegid: contas Microsoft/Google, 2FA e ativação por utilizador (202601+).", "lv": 0}, {"t": "Que executáveis/países a plataforma suporta?", "b": "PT, ES (SII/TicketBAI), PE (retenções), US (English) e geografias PALOP (AO, MZ, CV).", "lv": 0}, {"t": "Que tabelas guardam os clientes?", "b": "CL (ficha) e CL2 (Clientes - Outros Dados, ex.: país da morada).", "lv": 1}, {"t": "Numeração de sede e filiais do cliente?", "b": "Sede = 0; filiais/estabelecimentos = 1 a 999.", "lv": 1}, {"t": "O que é o serviço Ignios?", "b": "Preenchimento automático dos dados da empresa (nome, morada…) a partir do NIF — gama Advanced+.", "lv": 1}, {"t": "Efeito de cliente 'Inativo'?", "b": "Não aparece em opções/documentos novos; continua em análises; dossiers antigos ainda podem ser faturados.", "lv": 1}, {"t": "Com documentos certificados emitidos, o que fica protegido na ficha do cliente?", "b": "Sem nome/morada mas com NIF: pode definir nome/morada, não pode alterar NIF. Com nome/morada mas sem NIF: pode preencher NIF ou morada, não pode alterar o nome.", "lv": 1}, {"t": "O que são Moradas de Carga e Descarga?", "b": "Tabela de moradas do cliente que alimenta os campos Local de carga/descarga dos documentos de transporte (ShipFrom/ShipTo no SAF-T).", "lv": 1}, {"t": "O que são referências alternativas?", "b": "Códigos do artigo usados pelo cliente ou fornecedor — permitem introduzir o artigo por outro código no documento.", "lv": 1}, {"t": "O que é um composto (kit)?", "b": "Artigo formado por componentes (explode/consome os componentes conforme configuração).", "lv": 1}, {"t": "Para que serve a unidade alternativa + factor de conversão?", "b": "Vender/comprar noutra unidade (ex.: caixa = 10 un) convertendo quantidades e preços; o factor pode ser invertido.", "lv": 1}, {"t": "O que são stocks cativos e pré-cativos?", "b": "Reservas de stock: cativo (reservado/comprometido) e pré-cativo (pré-reserva) para controlo de disponibilidade.", "lv": 1}, {"t": "Como funcionam as tabelas de preços?", "b": "Várias tabelas com validades (início/fim); no documento assume a tabela do cliente e o preço válido na data.", "lv": 1}, {"t": "O que é o rappel?", "b": "Desconto retroativo por volumes atingidos (clientes e fornecedores), apurado no fim do período.", "lv": 1}, {"t": "Que módulos opcionais estendem os artigos?", "b": "Cores/tamanhos (vestuário), lotes, números de série (Equipamentos), Ecovalor, terminais portáteis, EDI.", "lv": 1}, {"t": "Tipos de documento de uma série de faturação?", "b": "1/2/3 = Fatura, Fatura Simplificada, Fatura-Recibo (+ND/NC via SAF-T); 4 = documento de transporte (guia); 5 = outro (proforma).", "lv": 2}, {"t": "Mapping SAF-T dos documentos?", "b": "FT (fatura), FS (simplificada), FR (fatura-recibo), NC (crédito), ND (débito), GT/GA/GC (transporte).", "lv": 2}, {"t": "O que uma série define?", "b": "Tipo de documento, mapping SAF-T, numeração e o que movimenta: stocks, conta corrente, tesouraria.", "lv": 2}, {"t": "Que tabela guarda os Documentos de Faturação?", "b": "FT (ex.: campo ft.ndoc = tipo de documento).", "lv": 2}, {"t": "O que a fatura atualiza automaticamente ao gravar?", "b": "Stocks (baixa), conta corrente do cliente (saldo/idades) e ficha do cliente (faturação acumulada).", "lv": 2}, {"t": "Campo obrigatório numa NC/ND?", "b": "Motivo de Retificação (ex.: numa regularização de adiantamento surge 'Retificação de Fatura de Adiantamento').", "lv": 2}, {"t": "Pode existir documento anulado sem motivo?", "b": "Não — o motivo de anulação é obrigatório; em anulações em série pede-se uma vez e aplica-se a todos.", "lv": 2}, {"t": "O que é a Emissão Automática de Faturação?", "b": "Ecrã de preparação que fatura em lote por cópia de dossiers internos/guias (seleção por intervalo de datas, cliente…).", "lv": 2}, {"t": "O que são Dossiers Internos (DI)?", "b": "Documentos parametrizáveis para uso interno (tabela BO): orçamentos, encomendas, propostas, folhas de obra, consignações, avenças.", "lv": 2}, {"t": "Circuito comercial típico com DIs?", "b": "Orçamento → Encomenda de cliente → Guia → Fatura → Recibo (conversões por cópia com opções configuráveis).", "lv": 2}, {"t": "Dossiers especiais que tem de conhecer?", "b": "Stock Inicial, Transferência de Armazém, Preços (cliente/fornecedor), Avenças (recorrência), Composição/Produção.", "lv": 2}, {"t": "O que é a 'data efetiva de entrega'?", "b": "Data em que bens/serviços foram/serão disponibilizados ao adquirente — obrigatória por lei e comunicada no SAF-T.", "lv": 2}, {"t": "Campos de transporte num documento tipo 4?", "b": "Local de carga/descarga, data e hora de início do transporte, matrícula, motorista, Cód. Ident. AT.", "lv": 2}, {"t": "Para que serve o campo 'Linha final'?", "b": "Texto livre impresso no rodapé do documento.", "lv": 2}, {"t": "O que fazem Segmento e Classificação de vendas?", "b": "Permitem análises de faturação por segmento/classificação (herdados da ficha do cliente).", "lv": 2}, {"t": "Recibo de C/C vs recibo de adiantamento?", "b": "C/C liquida documentos já emitidos; adiantamento regista dinheiro antes do documento fiscal e é regularizado depois na fatura.", "lv": 2}, {"t": "Que referências de pagamento o módulo gera?", "b": "Referências Multibanco (cobranças), ficheiros SEPA (débitos diretos/pagamentos), pagamentos online (Unicre/PayPal via web).", "lv": 2}, {"t": "O que é 'Comprar a Encomenda a Fornecedor'?", "b": "Conversão do DI de compra em documento de compra (guia/fatura), com receção total ou parcial.", "lv": 3}, {"t": "O que é o PCMP?", "b": "Preço de Custo Médio Ponderado — recálculo do custo médio do stock a cada entrada valorizada; base da valorização e do CEVMC.", "lv": 3}, {"t": "Que códigos tipificam as operações de armazém?", "b": "Códigos de Movimentos de Stocks (venda, compra, quebra, sobra, transferência, regularização…).", "lv": 3}, {"t": "Como se movimentam stocks entre armazéns?", "b": "Dossier de Transferência de Armazém (ou movimento manual com código próprio).", "lv": 3}, {"t": "O inventário físico gera o quê?", "b": "Acertos automáticos de quebra/sobra no ficheiro de movimentos, regularizando stock teórico = contado.", "lv": 3}, {"t": "Análises de stock essenciais?", "b": "Ruturas, acima do stock máximo, a encomendar (ponto de encomenda), ranking de vendas, margem/contribuição, entradas/saídas com comparação anual.", "lv": 3}, {"t": "O que mostra 'Encomendado a fornecedor' no artigo?", "b": "Quantidades em encomendas de compra pendentes — visível na ficha de stock do artigo.", "lv": 3}, {"t": "O que é o saldo por idades (aging)?", "b": "Dívida distribuída por escalões de antiguidade dos documentos em aberto (0-30, 31-60, 61-90, +90) — base de cobranças e crédito.", "lv": 4}, {"t": "Que tabela guarda os recibos?", "b": "RE.", "lv": 4}, {"t": "O que são Códigos de Conta Corrente?", "b": "Tipos de movimento de C/C (fatura, recibo, adiantamento, juros, regularização…) que classificam os lançamentos.", "lv": 4}, {"t": "Ferramentas de cobrança do módulo?", "b": "Monitor de controlo de dívidas, extractos de conta, Mailing de C/C por documento, cheques em carteira, recibos incobráveis.", "lv": 4}, {"t": "Tesouraria: as 3 visões?", "b": "Real (ocorrida), previsional (vencimentos/títulos previstos) e orçamental (plano aprovado).", "lv": 4}, {"t": "O que se faz com extractos bancários?", "b": "Importam-se/registam-se e reconciliam-se com os movimentos de tesouraria para fechar o mês bancário.", "lv": 4}, {"t": "Gestão de títulos de tesouraria: exemplos?", "b": "Letras e cheques (pré-datados, em carteira) — alimentam previsões e cobranças/pagamentos.", "lv": 4}, {"t": "O que o open banking traz ao Evolution?", "b": "Importação automática de movimentos e reconciliação acelerada + melhores previsões de tesouraria.", "lv": 4}, {"t": "Critérios de comissão suportados?", "b": "Por vendedor, tipo de cliente, família de produtos, etc., com mapas de apuramento.", "lv": 4}, {"t": "O que é o SAF-T (PT)?", "b": "Standard Audit File for Tax — ficheiro XML normalizado de auditoria fiscal (faturação, transportes, inventário, contabilidade).", "lv": 5}, {"t": "Dois métodos de comunicação de documentos de transporte à AT?", "b": "Webservice em tempo real (devolve o Cód. Ident. AT) ou SAF-T (PT) resumido (MovementOfGoods com ShipFrom/ShipTo).", "lv": 5}, {"t": "O que compõe o ATCUD?", "b": "Código de validação da série (atribuído pela AT) + número sequencial do documento; impresso com o QR Code.", "lv": 5}, {"t": "O que acontece a séries sem código de validação?", "b": "O software impede a impressão dos documentos (regra desde 01/01/2021, implementada na v27).", "lv": 5}, {"t": "Limitação dos motivos de isenção com webservice ativo?", "b": "Só são aceites os códigos normalizados M01 a M99 (ex.: M08 = isento art. 9.º); motivos criados pelo utilizador geram aviso.", "lv": 5}, {"t": "O que garante a integridade das faturas?", "b": "Assinatura digital qualificada (hash encadeada por série) + nº de certificado do software validado pela AT.", "lv": 5}, {"t": "Prazo da comunicação de inventário à AT?", "b": "Até 31 de janeiro (empresas abrangidas), por ficheiro SAF-T/CSV/XML conforme volume de negócios.", "lv": 5}, {"t": "Retenção de IRS numa fatura: campos?", "b": "Taxa de retenção e Valor de retenção de IRS (visível no mailing de C/C); o cliente paga o líquido e entrega ao Estado.", "lv": 5}, {"t": "O que é CIUS-PT?", "b": "Especificação portuguesa de faturação eletrónica (obrigatória na contratação pública); suportada via Documentos Eletrónicos/webservices (ex.: SaphetyDoc).", "lv": 5}, {"t": "Novidade 202601 para faturas de fornecedor?", "b": "Com Cegid Docs, faturas CIUS-PT são anexadas em PDF e pré-lançadas automaticamente (arquivo digital legal).", "lv": 5}, {"t": "O que é o SDR (2026)?", "b": "Sistema de Depósito e Recolha: desde 10/04/2026, depósito de 0,10 € por embalagem de bebida de uso único (até 3 L); configuração única de itens SDR, aplicado automaticamente na venda.", "lv": 5}, {"t": "Obrigações Espanha no PHC?", "b": "SII (Suministro Inmediato AEAT) e TicketBAI — parâmetro geral com 4 opções; funções internas de envio de compras/vendas para o SII.", "lv": 5}, {"t": "Ferramentas RGPD do módulo?", "b": "Aviso legal configurável, registo do tratamento de dados, direito ao esquecimento (anonimização), histórico de utilizadores.", "lv": 5}, {"t": "O que são documentos pré-definidos?", "b": "Modelos de contabilização automática: mapeiam documentos do Gestão para lançamentos na Contabilidade (contas de clientes, fornecedores, IVA, vendas/compras).", "lv": 5}, {"t": "O que é o CEVMC?", "b": "Custo das Existências Vendidas e das Mercadorias Consumidas — apurado na Contabilidade a partir dos consumos do Gestão.", "lv": 5}, {"t": "2FA na Segurança Social: desde quando?", "b": "12/05/2026 (obrigatório para empresas) — software atualizado para manter as comunicações (202601).", "lv": 5}, {"t": "O que valida antes de 'fechar o mês' fiscal?", "b": "SAF-T exportado e validado, séries/ATCUD ok, documentos de transporte comunicados, inventário (quando aplicável), integrações contabilísticas corretas.", "lv": 5}, {"t": "Análises Multidimensionais: de onde nascem e em que gama?", "b": "Criam-se a partir de Análises de Utilizador; gama Advanced+ (drill-down por dimensões).", "lv": 6}, {"t": "O que é um snapshot?", "b": "Consulta T-SQL 'fotografada' com variáveis (ex.: #stamp#) exibida em painel/grupo com cor — dados contextuais do registo atual.", "lv": 6}, {"t": "O que é a Impressão Definida pelo Utilizador?", "b": "Personalização de colunas/layout de listagens e impressões pelo utilizador (Advanced+).", "lv": 6}, {"t": "Sistema de Aprovação de Dossiers: que gama?", "b": "Enterprise (circuitos de aprovação de dossiers/documentos); Workflow Operacional aparece no Advanced+.", "lv": 6}, {"t": "Monitores e Itens de Monitor?", "b": "Apresentações sequenciais de dados operacionais com colunas configuráveis (ex.: dívidas, PATs, sincronizações).", "lv": 6}, {"t": "Exportações nativas de listagens?", "b": "Excel (xlsx), PDF e cópia de dados da grelha; importação: Excel para linhas de documentos, câmbios via ODBC.", "lv": 6}, {"t": "O que ativa as ferramentas da Framework PHC?", "b": "Parâmetros gerais ('Utiliza campos do utilizador?', 'Utiliza ecrãs do utilizador?'…) — aparecem depois no menu Supervisor > Framework PHC.", "lv": 6}, {"t": "Onde ficam gravadas as personalizações?", "b": "Na base de dados (framework) — sobrevivem à reinstalação do executável, mas devem ser revalidadas em cada upgrade.", "lv": 6}, {"t": "O que são Painéis de informação/navegação?", "b": "Componentes de UI agregáveis ao menu da aplicação (parâmetros próprios) para acesso rápido a análises/atalhos.", "lv": 6}, {"t": "PHC Dashboard: o que acrescenta?", "b": "Templates de dashboards por módulo (ex.: Gestão) com visão 360º — vendas, C/C, tesouraria num só ecrã.", "lv": 6}, {"t": "Como se descobre a estrutura de uma tabela para uma análise?", "b": "Dicionário de Dados (menu de opções do ecrã posiciona na tabela atual) — campos, tipos e relações.", "lv": 6}, {"t": "Boas práticas de leitura SQL no PHC?", "b": "WITH (NOLOCK) em consultas analíticas, respeitar ref/stamp, não alterar esquemas do core, índices via framework.", "lv": 6}, {"t": "Linguagem de personalização do desktop?", "b": "Xbase (sintaxe Visual FoxPro) — eventos, regras, funções de utilizador.", "lv": 7}, {"t": "Eventos disponíveis nos objetos (lista-chave)?", "b": "Init, Ativar, Desativar, Refrescar, Clique, Duplo Clique, Clique Direito, Ao Entrar, Ao Sair, Após Atualizar, Após não Atualizado, Antes/Depois mudar Linha-Coluna, MouseEnter/Leave/Move/Wheel, Tecla Pressionada.", "lv": 7}, {"t": "Propriedades sempre disponíveis do ObjRecebido?", "b": "Janela (apontador para o ecrã) e Objecto (apontador para o objeto; inclui Value, Parent e MeusDados).", "lv": 7}, {"t": "Para que serve MeusDados?", "b": "Repositório chave-valor do utilizador para passar estado entre eventos: AddParametro, GuardaParametro, ExisteParametro, GetNomeParametro, GetIndexParametro, TotalParametros.", "lv": 7}, {"t": "O que faz Return .F. num evento?", "b": "Cancela o comportamento de raiz do objeto nesse evento (tecla não entra, calendário não abre…). Expressões não usam Return.", "lv": 7}, {"t": "Exemplo de alteração via ObjRecebido.Janela?", "b": "ObjRecebido.Janela.Caption = 'Exemplo' — muda o título do ecrã enquanto aberto (não persiste; repetir no Init).", "lv": 7}, {"t": "Num Campo de Ligação, o que apontam .Lista1/.Procura/.Nossocampo1?", "b": "Sub-objetos do campo composto: botão de lista, botão de procura e campo de texto.", "lv": 7}, {"t": "Campos de Utilizador vs ALTER TABLE?", "b": "Campos de utilizador são geridos pela framework (persistem em upgrades, aparecem nos ecrãs); ALTER TABLE direto quebra suporte/upgrades.", "lv": 7}, {"t": "Regras de Utilizador: para quê?", "b": "Validações de negócio na introdução/gravacao (obrigar campos, bloquear sem stock, validar NIF) — com assistente ou código.", "lv": 7}, {"t": "O que são Instruções Internas?", "b": "Procedimentos/documentação escrita pelo utilizador, associados a cada ecrã principal (manual da casa in-app).", "lv": 7}, {"t": "Função interna CriaAvs?", "b": "Cria avisos/avisos internos a utilizadores (parâmetros incluem stamp do ecrã e userAv) — base de alertas personalizados.", "lv": 7}, {"t": "Função interna U_NAVEGA?", "b": "Navegação programática para registos/ecrãs (interage com o parâmetro 'mostrar último registo ao arrancar').", "lv": 7}, {"t": "Índices de Utilizador: capacidade especial?", "b": "Criar índices SQL sobre tabelas do software via framework, incluindo INCLUDED COLUMNS (v19+).", "lv": 7}, {"t": "O que é um IDU / Ecrã Personalizado?", "b": "Ecrã desenhado pelo utilizador (desenhador; drag-and-drop no POS touch) com objetos ligados a dados, eventos e menus próprios.", "lv": 7}, {"t": "Framework Web: linguagem e ferramentas?", "b": "C# no Editor de Código — Eventos, Regras, Scripts (por URL), Ecrãs/Objetos de utilizador, Monitores, Templates, Valores por Defeito, Filtros, RSS, Log de Código.", "lv": 7}, {"t": "O que são Scripts (web)?", "b": "Programas executados quando se chama um URL específico — endpoints próprios para integrações.", "lv": 7}, {"t": "PromptFunction() — o que é?", "b": "Nova função da framework (202601) para invocar IA (Cegid Pulse) a partir de código; base dos Smart Tools configuráveis/monetizáveis pelos parceiros.", "lv": 7}, {"t": "Relatórios na web usam que tecnologia?", "b": "DevExpress ('Relatórios DevExpress no PHC CS Web' — Clientes, Faturação, Recibos de Adiantamento…).", "lv": 7}, {"t": "Ferramentas de debug do programador PHC?", "b": "Análise Interna (desktop), Log de Código (web), Simulador de SQL, Explorador de Dados, Dicionário de Dados.", "lv": 7}, {"t": "O que é o EyePeak?", "b": "Plataforma de logística/WMS/e-commerce (Cegid Primavera) que sincroniza com o PHC — monitor 'EyePeak Sincronização' no menu Supervisor.", "lv": 8}, {"t": "Sincronização EyePeak: o que inclui?", "b": "Artigos/stocks, séries de documentos de faturação (consistência ERP×EyePeak), fluxos de documentos (ex.: encomendas → guias de fornecedor).", "lv": 8}, {"t": "O que é o PHC CS Web?", "b": "Plataforma web sobre a mesma BD do desktop: aplicações Gestão Web, Front Web (extranet de clientes/fornecedores), POS Web, RH Web…", "lv": 8}, {"t": "Ativação do Cegid Pulse: 3 passos?", "b": "1) Dar acesso ao módulo Cegid Pulse; 2) Ativar Cegid Account na ficha do utilizador; 3) O utilizador faz login (deteção automática).", "lv": 8}, {"t": "O que são os assistentes de negócio (202601)?", "b": "Agentes de IA por área (o primeiro: comercial) que dão insights e cruzam dados do ERP em linguagem natural — simples de configurar pelo utilizador.", "lv": 8}, {"t": "Integração bancária histórica do Gestão?", "b": "WebBanking (ex.: Millennium BCP: saldos e extractos) — no Evolution evolui para open banking.", "lv": 8}, {"t": "Comunidade de utilizadores PHC (B2B)?", "b": "Sistema de troca de documentos cliente-fornecedor em XML (eProcurement) — histórico da plataforma; hoje: EDI/Documentos Eletrónicos e EyePeak.", "lv": 8}, {"t": "Como se enviam documentos por e-mail a partir do PHC?", "b": "Envio direto configurado por SMTP (com idioma/descrições do cliente), anexos via File Storage/Cegid Docs.", "lv": 8}, {"t": "Migração PHC CS perpétuo → Evolution: etapas?", "b": "Diagnóstico e plano (escolher plano/módulos) → migração técnica (dados, configurações, integrações) → suporte pós-arranque; desenvolvimentos/addons mantêm-se.", "lv": 8}, {"t": "Quem vende/implementa o Cegid PHC?", "b": "Rede de parceiros certificados (com especializações setoriais) — diretoria pública no site; parceiros acedem a formação, demos e à Comunidade.", "lv": 8}, {"t": "Onde ler as novidades de cada versão?", "b": "Help Center > Novidades (página por versão, ex.: 202601) + 'Listagem de Novidades' em PDF + artigos do blog.", "lv": 8}, {"t": "Que ferramentas de IA a PHC já tinha antes do Pulse?", "b": "Cris (assistente de gestão) e PHC CS GenAI (templates de perguntas/respostas reutilizáveis) — versão 202501.", "lv": 8}, {"t": "Função interna U_sendmail — para que serve?", "b": "Esta função permite enviar um email para um ou vários destinatários, indicando o Assunto, o Conteúdo e opcionalmente uma lista de ficheiros para enviar como… (Enciclopédia PHC · 📕 Funções PHC)", "lv": 7}, {"t": "Função interna Navega — para que serve?", "b": "Esta função é utilizada para navegar para um ecrã da aplicação. (Enciclopédia PHC · 📕 Funções PHC)", "lv": 7}, {"t": "Função interna Mensagem — para que serve?", "b": "Esta função envia uma mensagem ao utilizador (Enciclopédia PHC · 📕 Funções PHC)", "lv": 7}, {"t": "Função interna Pergunta — para que serve?", "b": "Esta função é utilizada para introduzir uma pergunta ao utilizador. (Enciclopédia PHC · 📕 Funções PHC)", "lv": 7}, {"t": "Função interna Browlist — para que serve?", "b": "Esta função permite mostrar ao utilizador, um cursor em modo de listagem. (Enciclopédia PHC · 📕 Funções PHC)", "lv": 7}, {"t": "Função interna Listtoexcel — para que serve?", "b": "Esta função permite criar uma listagem em Excel a partir de um cursor. (Enciclopédia PHC · 📕 Funções PHC)", "lv": 7}, {"t": "Função interna U_sqlexec — para que serve?", "b": "Esta função permite criar um cursor temporário com base numa expressão Transact SQL (Enciclopédia PHC · 📕 Funções PHC)", "lv": 7}, {"t": "Função interna Ret_grid — para que serve?", "b": "Esta função permite retornar a largura e ordem das colunas e a altura das linhas de uma Grid (grelha). (Enciclopédia PHC · 📕 Funções PHC)", "lv": 7}, {"t": "Xbase: Strtran() — o que faz?", "b": "Esta função retorna uma expressão de carateres, como resultado final. (Enciclopédia PHC · 📕 Xbase/VFP)", "lv": 7}, {"t": "Xbase: Alltrim() — o que faz?", "b": "Esta função retorna uma string sem espaços, removendo os espaços que se encontrem à esquerda e/ ou à direita de uma expressão de carateres. (Enciclopédia PHC · 📕 Xbase/VFP)", "lv": 7}, {"t": "Xbase: Ctod() — o que faz?", "b": "Esta função converte uma expressão do tipo caracter numa expressão do tipo DATE. (Enciclopédia PHC · 📕 Xbase/VFP)", "lv": 7}, {"t": "Xbase: Messagebox() — o que faz?", "b": "Esta função envia uma mensagem para o utilizador através de uma caixa de diálogo (Dialog Box). (Enciclopédia PHC · 📕 Xbase/VFP)", "lv": 7}, {"t": "Onde está a documentação de TODAS as funções internas do PHC?", "b": "Na Enciclopédia PHC (CHM oficial/Help Center): 154 funções internas com parâmetros e exemplos. Neste app: aba 📕 Enciclopédia (versão destilada + pesquisa).", "lv": 7}], "quizzes": [{"lv": 0, "nome": "Plataforma & Instalação", "qs": [{"q": "O Cegid PHC Evolution é o sucessor de que produto?", "o": ["PHC GO", "PHC CS (desktop)", "Cegid Pulse", "PHC FX"], "a": 1, "why": "O Evolution é a evolução natural do PHC CS: mesma plataforma, agora por subscrição com web, IA e cloud incluídos."}, {"q": "O 'exe único' de instalação do PHC faz automaticamente:", "o": ["Apenas copia os ficheiros do programa", "Instala a aplicação, cria/attacha a BD e configura o ODBC", "Instala o SQL Server completo", "Cria a licença na cloud"], "a": 1, "why": "O instalador trata da aplicação + base de dados (criação/attach) + DSN ODBC."}, {"q": "Segundo os termos de licenciamento, o PHC CS funciona exclusivamente sobre:", "o": ["MySQL 5.7+", "Oracle 12+", "SQL Server 2008R2 ou posterior", "PostgreSQL 10+"], "a": 2, "why": "SQL Server é a única BD suportada (2008R2+ nos termos; instalações atuais tipicamente 2012+; Express no Corporate)."}, {"q": "Onde ficam registados os erros de execução dos eventos Xbase do utilizador?", "o": ["No Log de Código da web", "Na Análise Interna", "No Event Viewer do Windows", "No ficheiro error.txt da pasta"], "a": 1, "why": "A Análise Interna guarda os erros dos eventos/código desktop; na web usa-se o Log de Código."}, {"q": "O Dicionário de Dados permite:", "o": ["Editar dados das tabelas", "Consultar campos, tipos e relações de qualquer tabela", "Criar utilizadores", "Exportar o SAF-T"], "a": 1, "why": "Mostra estrutura (campos, descrições, tipos, tamanhos) e relações entre tabelas; acessível via Supervisor > Tratamento da base de dados ou menu de opções do ecrã."}, {"q": "O acordo PHC On dá direito a:", "o": ["Apenas suporte telefónico", "Atualizações e upgrades durante 1 ano + portal com formação e Calendário PHC", "Hardware homologado", "Licenças ilimitadas"], "a": 1, "why": "PHC On = atualizações (incl. legislativas) durante um ano + on.phc.pt (formação online, autoformação, truques e dicas) + Calendário PHC de obrigações."}]}, {"lv": 1, "nome": "Ficheiros", "qs": [{"q": "Na ficha de cliente, o número à direita do nº de cliente indica:", "o": ["A versão do registo", "Sede (0) ou filial/estabelecimento (1-999)", "O código postal", "O tipo de IVA"], "a": 1, "why": "Sede = 0; filiais numeradas de 1 a 999, criadas por duplicação do registo."}, {"q": "O país da morada do cliente fica guardado em que tabela?", "o": ["CL", "CL2 (Clientes - Outros Dados)", "FT", "ZZ"], "a": 1, "why": "O manual indica que o campo País é gravado na tabela 'Clientes - Outros Dados' (CL2)."}, {"q": "Um cliente 'Inativo':", "o": ["É apagado da BD", "Não permite novos documentos mas continua em análises e dossiers antigos faturáveis", "Bloqueia toda a empresa", "Só pode ser reativado pelo suporte"], "a": 1, "why": "Inativos saem das opções de documentos novos; mantêm-se em análises e é possível faturar dossiers anteriores."}, {"q": "O serviço Ignios (Advanced+):", "o": ["Gera o SAF-T", "Preenche automaticamente dados da empresa a partir do NIF", "Comunica guias à AT", "Cria backups na cloud"], "a": 1, "why": "Ao digitar o NIF, a aplicação preenche nome/morada/localidade/código postal com dados disponibilizados pelo serviço Ignios."}, {"q": "Tabelas de preços no PHC Gestão caracterizam-se por:", "o": ["Preço fixo por artigo", "Validades atribuídas — o preço atual é o da tabela válida na data", "Só existirem 2 tabelas", "Serem exclusivas de compras"], "a": 1, "why": "As tabelas têm validades (início/fim) para se saber sempre qual o preço atual; associam-se a clientes/fornecedores."}, {"q": "Uma unidade alternativa com factor de conversão serve para:", "o": ["Traduzir a designação", "Vender/comprar noutra unidade (ex.: caixa=10un) convertendo quantidades e preços", "Definir lotes", "Numerar artigos"], "a": 1, "why": "O factor (e a sua inversão) converte entre unidade base e alternativa nos documentos e stocks."}]}, {"lv": 2, "nome": "Ciclo de Vendas", "qs": [{"q": "Na configuração de uma série, o 'tipo 4' corresponde a:", "o": ["Fatura", "Fatura Simplificada", "Documento de transporte (Guia de Remessa)", "Proforma"], "a": 2, "why": "Tipo 4 = documento de transporte (guias); tipo 5 = outro (proforma); tipos 1-3 cobrem fatura/simplificada/fatura-recibo/ND/NC."}, {"q": "Os tipos de documento para SAF-T são:", "o": ["FA, FB, FC", "FT, FS, FR, NC, ND (e GT no transporte)", "A, B, C, D", "V1, V2, V3"], "a": 1, "why": "O mapping da série define o documento SAF-T: FT, FS, FR, NC, ND; guias vão no SAF-T de transporte (GT...)."}, {"q": "Ao gravar uma fatura que movimenta stocks e C/C, o programa atualiza:", "o": ["Só o PDF", "Stocks (baixa), conta corrente (saldo/ida l suporta 23,75% sobre a matéria coletável (regra geral)."}, {"q": "A DMR (Declaração Mensal de Remunerações) entrega-se:", "o": ["À Segurança Social, anualmente", "À AT, mensalmente (até ao fim do mês seguinte)", "Ao banco, por lote", "Não é obrigatória"], "a": 1, "why": "Declaração mensal à AT com remunerações e retenções por trabalhador; desde 202601 emitida sem valores negativos."}, {"q": "Desde 12/05/2026, o acesso de empresas à Segurança Social Direta exige:", "o": ["Certificado digital", "Autenticação de dois fatores (2FA)", "Novo número de entidade", "VPN"], "a": 1, "why": "2FA obrigatória para empresas — o software foi atualizado (202601) para manter as comunicações."}, {"q": "As tabelas de retenção de IRS com data de vigência (202601) permitem:", "o": ["Uma tabela única para sempre", "Carregar tabelas futuras que coexistem com as anteriores e se aplicam automaticamente pela data", "Ignorar tabelas", "Taxas livres por empresa"], "a": 1, "why": "Transições de tabelas sem sobressaltos: o processamento aplica a tabela vigente na data do recibo."}, {"q": "Numa cessação de contrato, o acerto final inclui tipicamente:", "o": ["Só o salário do mês", "Retribuição do período + férias vencidas não gozadas + proporcionais de subsídios (conforme regime)", "Apenas indemnização", "Nada além do recibo normal"], "a": 1, "why": "O cálculo automático de valores à saída considera férias, subsídios e créditos/débitos pendentes — conferir sempre manualmente."}, {"q": "O pagamento de salários em lote faz-se por:", "o": ["Cheques manuais obrigatórios", "Ficheiro SEPA de transferências validado (IBANs e totais)", "Dinheiro vivo apenas", "MB Way individual"], "a": 1, "why": "O módulo automatiza as transferências de vencimentos via SEPA; valida-se o ficheiro (totais = líquidos) antes da entrega ao banco."}]}, {"lv": 11, "nome": "POS & Retalho", "qs": [{"q": "O documento fiscal típico de uma venda de balcão a consumidor final é:", "o": ["Fatura-recibo sempre", "Fatura Simplificada (FS)", "Nota de crédito", "Proforma"], "a": 1, "why": "FS no talão do POS (com QR/ATCUD); fatura completa quando o cliente pede documento com NIF/requisitos próprios."}, {"q": "No fecho de caixa, a contagem de notas e moedas serve para:", "o": ["Cumprir horário", "Apurar quebras/sobras face ao sistema e responsabilizar o turno", "Somar vendas do mês", "Gerar o SAF-T"], "a": 1, "why": "A diferença física×sistema documenta-se (quebra/sobra) com responsável — base do controlo interno de caixa."}, {"q": "A reconciliação de pagamentos por TPA é a quantas vias?", "o": ["1 (talão)", "2 (talão×fecho)", "3 (talões do terminal × fecho POS × extrato bancário)", "Não é necessária"], "a": 2, "why": "O banco credita dias depois, líquido de comissões: só as três vias apanham diferenças de tempo e custo."}, {"q": "A grelha de cores e tamanhos resolve que problema?", "o": ["Impressão de etiquetas", "Gerir variantes (cor/tamanho) de um artigo-pai sem multiplicar referências", "Preços em moeda estrangeira", "Fechos de caixa"], "a": 1, "why": "Setor vestuário/calçado: stock e vendas por combinação, ficheiro de artigos governável."}, {"q": "Um vale de reembolso é:", "o": ["Dinheiro devolvido em numerário", "Crédito comercial emitido (tipicamente numa devolução) para uso numa compra futura", "Um desconto imediato", "Um documento fiscal de venda"], "a": 1, "why": "Não há saída de dinheiro: o vale resgata-se como meio de pagamento numa venda futura (com validade e política definidas)."}, {"q": "Vender no POS com a série bem configurada atualiza automaticamente:", "o": ["Só o talão", "Stock da loja, tesouraria da caixa e conta corrente (se aplicável)", "Apenas vendas", "Nada — é preciso lançar depois"], "a": 1, "why": "O POS é o braço de balcão do ERP: o talão é um documento de faturação com todos os efeitos (e SAF-T)."}]}, {"lv": 12, "nome": "Suporte & Pós-venda", "qs": [{"q": "PAT significa:", "o": ["Plano de Assistência Técnica", "Pedido de Assistência Técnica", "Programa de Atendimento Telefónico", "Protocolo de Assistência ao Trabalhador"], "a": 1, "why": "É o documento central do pós-venda: do pedido do cliente à resolução e faturação."}, {"q": "Os três registos-mestre do Suporte são:", "o": ["Clientes, faturas, recibos", "Instalações, equipamentos (nº série) e contratos", "Armazéns, lotes, séries", "Diários, contas, movimentos"], "a": 1, "why": "Onde está (instalação), o quê (equipamento com série/garantia) e em que condições (contrato/SLA)."}, {"q": "SLA de suporte mede-se graças a:", "o": ["Memória do técnico", "Estados do PAT com timestamps (resposta e resolução)", "Faturas emitidas", "Nº de telefone"], "a": 1, "why": "Sem estados datados não há tempo de resposta/resolução — nem KPI, nem penalização, nem melhoria."}, {"q": "A fuga de receita clássica do Suporte é:", "o": ["Vender contratos", "PAT resolvido não faturado (horas e peças perdidas)", "Assinar relatórios", "Agendar visitas"], "a": 1, "why": "Por isso o fecho mensal reconcilia PATs resolvidos × documentos faturados."}, {"q": "No modelo de pontos, o cliente:", "o": ["Paga cada intervenção avulso", "Compra pacotes pré-pagos consumidos por intervenção (saldo visível)", "Não paga", "Paga só no fim do ano"], "a": 1, "why": "Receita antecipada + fidelização; o saldo extrai-se por cliente e o consumo regista-se no PAT."}, {"q": "A assinatura digital no relatório de intervenção serve para:", "o": ["Decorar o PDF", "Provar a aceitação do serviço (e de custos extra aprovados) pelo cliente", "Substituir a fatura", "Cumprir o RGPD"], "a": 1, "why": "Capturada no ato (touch), reduz disputas e suporta a faturação do que foi executado/aprovado."}]}], "theory": {"L00": {"c": "Aprender um ERP é como aprender a conduzir: não se aprende a ler o manual — aprende-se ao volante, mas num campo de treino. O ambiente de treino é esse campo: um ambiente onde pode errar à vontade, com um método (prática deliberada + repetição espaçada + provas) que garante que o conhecimento fica. Prática deliberada = treinar tarefas específicas no limite da sua capacidade, com feedback imediato. Repetição espaçada = repetir em intervalos crescentes (1, 2, 4, 7... dias) no momento em que está quase a esquecer — é o que fixa na memória de longo prazo.", "s": [["Ambiente de treino", "Uma instalação PHC isolada (VM ou empresa demo) onde pode apagar, quebrar e repetir sem risco — nunca a BD de produção de um cliente."], ["Evidência/prova", "Registo objetivo de que executou a tarefa (print nomeado, resultado SQL, ficheiro gerado). Sem prova, o cérebro auto-engana-se ('isso eu sei')."], ["Repetição espaçada (SRS)", "Agendar repetições em intervalos crescentes; cada missão volta automaticamente até ficar 'de cor'."], ["Meta cronometrada", "Tempo-alvo de execução: distingue 'sei fazer' de 'sei fazer como um profissional'."]], "e": ["Treinar diretamente na BD de produção de um cliente", "Marcar 'feito' sem prova nem repetição — sensação de progresso sem competência real"]}, "L01": {"c": "O PHC é uma aplicação client/server: o programa no posto de trabalho é apenas o 'volante' — quem guarda e processa os dados é o Microsoft SQL Server. Todo o técnico PHC tem de saber instalar, configurar e diagnosticar esta camada: instância, autenticação, rede (TCP/IP 1433), collation (regra de ordenação/acentos), logins (SQL) vs utilizadores (PHC) e manutenção. A gama Corporate usa tipicamente SQL Server Express (gratuito, com limitações: sem SQL Agent, limite de recursos).", "s": [["Instância", "Uma instalação do motor SQL Server, identificada por nome (MSSQLSERVER = default, ou nomeada como SQLEXPRESS). O PHC liga-se a uma instância."], ["Autenticação mista", "Modo que aceita login Windows E logins SQL com password (ex.: sa). O ODBC do PHC usa normalmente autenticação SQL."], ["TCP/IP 1433", "Protocolo/porta por onde as aplicações falam com o SQL. Vem desativado por omissão no Express — ativá-lo no SQL Server Configuration Manager."], ["Collation", "Regra de ordenação e comparação de texto (acentos, maiúsculas). Deve seguir a recomendação da PHC; collations erradas causam problemas de ordenação/duplicados."], ["Login vs utilizador BD", "Login = identidade no servidor; utilizador = mapeamento desse login dentro de cada base de dados. Sem o mapeamento, o login não vê a BD."], ["HCL", "Hardware Compatibility List — equipamentos (impressoras, TPA, PDA) validados; importante para POS e documentos."]], "e": ["Deixar TCP/IP desativado e perder tempo a 'culpar' o PHC pela falta de ligação", "Usar collation diferente da recomendada e ter comparações de texto inconsistentes", "Esquecer a password do sa sem alternativa de acesso"]}, "L02": {"c": "A instalação do PHC é feita por um executável único que trata de três coisas de uma vez: instala a aplicação, cria/faz attach da base de dados da empresa e configura o ODBC (a 'ponte' padrão entre o programa e o SQL Server). Cada empresa = uma base de dados. Ao abrir, escolhe a empresa (BD) e o utilizador. O licenciamento define plano (Standard→Ultimate), gama funcional (Corporate/Advanced/Enterprise) e módulos ativos — é isto que determina o que consegue configurar e desenvolver.", "s": [["ODBC/DSN", "Camada standard de acesso a dados; o instalador cria o DSN que aponta para o SQL Server. Muitos problemas de ligação resolvem-se testando o ODBC."], ["Empresa = BD", "Multiempresa = várias BDs no mesmo servidor; a seleção de empresa ao entrar decide a BD usada."], ["Licença", "Ficheiro/validação associada ao nº de cliente que ativa plano, gama e módulos. Sem licença válida, funcionalidades ficam bloqueadas."], ["Menus nucleares", "Sistema (parâmetros/utilizadores), Supervisor (framework + tratamento da BD + monitores) e os menus dos módulos (Gestão, etc.)."], ["Barra de status", "Mostra versão, empresa e utilizador — primeiro sítio a confirmar num pedido de suporte ('que versão tem?')."]], "e": ["Não anotar versão/gama/módulos logo no início — todo o resto do suporte depende disso", "Instalar o executável sem validar o ODBC e depois não saber por que não liga"]}, "L03": {"c": "Backups são a apólice de seguro do técnico: uma atualização falhada, um disco morto ou um utilizador 'criativo' podem destruir dados fiscais irrecuperáveis. O ciclo profissional: backup FULL regular (+ logs se aplicável), teste de restauro periódico, e sempre um backup extra antes de qualquer upgrade. Também precisa de saber mover BDs (detach/attach ou backup/restore) para criar clones de teste — a base de todo o desenvolvimento seguro.", "s": [["Backup FULL", "Cópia completa da BD para um ficheiro .bak (WITH COMPRESSION, INIT). Ponto de retorno garantido."], ["Detach/Attach", "Desanexar a BD do servidor (liberta os ficheiros .mdf/.ldf) e anexá-la noutro sítio — forma rápida de clonar."], ["SQL Agent vs Task Scheduler", "O Agent (agendador do SQL) não existe no Express; usa-se o Task Scheduler do Windows com sqlcmd para automatizar backups."], ["sp_spaceused", "Procedure que mostra o espaço usado pela BD — vigiar contra o limite do plano (10 GB em Standard/Plus)."], ["Clone de teste", "Cópia da BD onde se validam upgrades e personalizações antes de tocar em produção."]], "e": ["Fazer backups e nunca testar o restauro (backup não testado = backup inexistente)", "Upgrade sem backup fresco + janela sem utilizadores", "Guardar o .bak no mesmo disco da BD"]}, "L04": {"c": "Segurança no PHC tem duas camadas: o login SQL (ligação à BD) e o utilizador PHC (identidade na aplicação). Dentro da aplicação, os acessos definem-se por Grupos (ou Perfis, conforme parâmetro) e são granulares: por ecrã, por operação (consultar/introduzir/alterar/apagar), por ações especiais (reimprimir, totalizar, anexar) e até por parâmetro. O princípio é o do menor privilégio: cada utilizador vê apenas o que precisa — parâmetros e Supervisor ficam reservados a administradores.", "s": [["Grupos vs Perfis", "Dois modelos de definição de acessos; qual está ativo depende do parâmetro geral 'Definição de tipos de acessos'."], ["Acessos por operação", "Não basta permitir o ecrã Faturação: pode permitir emitir mas proibir reimprimir ou anular."], ["Acessos a parâmetros", "Possível libertar parâmetros específicos a utilizadores não-admin (ex.: gestor comercial altera 1-2 parâmetros)."], ["Histórico/log", "Histórico de utilizadores e (Enterprise, v30+) log de atividade: quem consultou/alterou/apagou o quê — auditoria."]], "e": ["Dar acesso de admin 'para não chatear' — a primeira asneira grave sai cara", "Testar acessos sempre com o utilizador admin (não deteta bloqueios reais)"]}, "L05": {"c": "Três ferramentas separam o técnico que 'acha' do técnico que 'sabe': o Dicionário de Dados (estrutura e relações de QUALQUER tabela — campos, tipos, descrições), o Simulador de SQL (correr consultas dentro do PHC, com variáveis como #stamp#) e a Análise Interna (o log onde ficam os erros do código de utilizador — eventos Xbase). Antes de escrever SQL ou depurar uma personalização, é aqui que se vem. Regra de ouro: nunca adivinhe nomes de tabelas/campos — confirme no dicionário.", "s": [["Dicionário de Dados", "Supervisor → Tratamento da base de dados (ou menu de opções de qualquer ecrã, já posicionado na tabela desse ecrã). Mostra relações desde a versão 2008; duplo-clique navega para a tabela relacionada."], ["Tabelas PHC", "Nomes curtos: CL/CL2 (clientes), FT (faturação), BO (dossiers), RE (recibos)... O dicionário revela o resto."], ["ref / stamp", "ref identifica o registo; stamp marca a 'versão' do registo para concorrência/navegação — aparece em snapshots como #stamp#."], ["Análise Interna", "Log de erros de eventos/código do utilizador. Erro com linha 0 = falha numa expressão (não num programa)."]], "e": ["Fazer SELECT * a tabelas enormes sem NOLOCK/top e bloquear a aplicação", "Alterar dados por SQL sem perceber stamp/concorrência (a app pode sobrescrever ou dar conflito)"]}, "L06": {"c": "O cliente é a entidade central das vendas: a ficha (tabela CL + extensão CL2) guarda identidade (NIF, moradas), classificação comercial (zona, tipo, segmento, idioma) e condições (pagamento, descontos, tabela de preços, vendedor). Conceitos próprios: sede (0) vs filiais/estabelecimentos (1-999) do mesmo número; inativação (bloqueia documentos novos mas preserva histórico/análises); e regras de proteção de dados em clientes com documentos certificados (campos bloqueados a alterações). Alterações de dados podem propagar-se a C/C e documentos — controlado por parâmetro.", "s": [["CL e CL2", "Ficha principal e 'Outros Dados' (ex.: país da morada) — descubra mais campos no Dicionário de Dados."], ["Estabelecimentos", "Sede = 0; filiais 1-999 criadas por duplicação. Útil para empresas com várias moradas de entrega/faturação."], ["Ignios", "Serviço (Advanced+) que preenche nome/morada automaticamente a partir do NIF válido."], ["Inativo", "Sai das opções de documentos novos; mantém-se em análises; dossiers antigos ainda faturáveis."], ["Moradas de Carga/Descarga", "Tabela própria que alimenta os documentos de transporte (ShipFrom/ShipTo no SAF-T)."], ["Propagação de alterações", "O parâmetro 'Quando altera dados do cliente, não atualiza tabelas relacionadas' controla se abreviatura/morada/zona se propagam a C/C, documentos não certificados e recibos."]], "e": ["Apagar clientes em vez de inativar (destrói integridade histórica)", "Alterar NIF/nome de cliente com documentos certificados — a aplicação bloqueia por razões fiscais (e ainda bem)"]}, "L07": {"c": "O fornecedor espelha o cliente no ciclo de compras, com duas tabelas críticas de apoio: Condições de Pagamento (prazos/vencimentos — ex.: 30/60/90 dias, que alimentam a tesouraria previsional e a C/C) e Formas de Pagamento (como se paga: transferência, cheque...). Dados bancários (IBAN) na ficha permitem gerar pagamentos/SEPA. Fornecedores intra-comunitários exigem NIF estrangeiro + país corretos para o IVA e Intrastat.", "s": [["Condição de pagamento", "Define vencimento(s) dos documentos — sem ela bem configurada, previsões de tesouraria e aging ficam errados."], ["Forma de pagamento", "Instrumento (transferência, cheque, MB...) — alimenta tesouraria e ficheiros bancários."], ["Fornecedor intra-UE", "País + NIF válido de outro estado-membro; afeta regras de IVA (autoliquidação/reverse charge) e mapas."]], "e": ["Criar condições de pagamento 'à medida de um caso' e poluir a tabela — desenhe 3-5 condições standard", "Esquecer IBAN e depois não conseguir gerar pagamentos automáticos"]}, "L08": {"c": "O ficheiro de Stocks e Serviços (artigos) é o coração operacional: cada referência tem designação (multi-idioma), família/marca, unidade base e unidade alternativa com factor de conversão (vender caixas de 10), código de barras/EAN, preços (custo, venda por tabela) e regras de aprovisionamento (stock mín/máx, ponto de encomenda). Serviços são 'artigos sem stock'. O custo de stock valoriza-se por PCMP (ver L23). Tudo o que se configura aqui ecoa em vendas, compras, armazém e fiscalidade.", "s": [["Família/Marca", "Agrupamentos para análises, comissões e preços (comissões podem variar por família)."], ["Unidade alternativa + factor", "Caixa = 10 unidades; o factor converte quantidades/preços nos documentos; existe opção de inversão do factor."], ["Stock mín/máx e ponto de encomenda", "Alimentam as análises de rutura e 'a encomendar' — a base do aprovisionamento."], ["Serviço vs artigo", "Serviço não movimenta stock; o resto do ciclo (faturação, C/C) funciona igual."], ["EAN/código de barras", "Usado em POS, PDAs e documentos eletrónicos."]], "e": ["Criar artigos duplicados por falta de convenção de referências (defina uma: ex., FAM-TAM-COR)", "Esquecer o factor de conversão e faturar 1 caixa como 1 unidade"]}, "L09": {"c": "Dois conceitos que evitam duplicação e fricção comercial. Compostos (kits): um artigo 'conjunto' formado por componentes — a configuração define como se comporta na faturação/stock (vende-se o conjunto, consomem-se os componentes). Referências alternativas: o MESMO artigo com códigos usados pelo cliente ou pelo fornecedor — ao digitar a referência do cliente no documento, o PHC assume o artigo certo. Elimina o clássico 'o meu código não é o seu'.", "s": [["Composto/Kit", "Artigo pai com lista de componentes e quantidades; útil para packs, conjuntos e produções simples."], ["Referência alternativa (cliente)", "Código do artigo na linguagem do cliente — pesquisável nos documentos."], ["Referência alternativa (fornecedor)", "Código do fornecedor para o artigo — essencial em compras e encomendas."]], "e": ["Criar um artigo novo para cada kit em vez de usar compostos (stock dos componentes nunca baixa)", "Confundir referência alternativa com designação por cliente (são mecanismos distintos)"]}, "L10": {"c": "Stock existe SEMPRE num armazém (pode haver vários: principal, loja, trânsito...). Artigos com lotes ganham rastreabilidade (lote, validade) — obrigatório em sectores como alimentar/farma; números de série (módulo Equipamentos) identificam unidades individuais. Para carregar stocks de arranque não se usam compras: usa-se o Dossier de Stock Inicial, uma regularização valorizada sem fornecedor. Movimentos de stock são tipificados por Códigos de Movimentos (entrada, saída, quebra, sobra, transferência...).", "s": [["Armazém", "Local lógico de stock; cada movimento indica origem/destino."], ["Lote", "Sub-divisão do stock com validade/rastreio; entradas e saídas referenciam o lote."], ["Nº de série", "Identificador único por unidade (com PHC Equipamentos) — para garantias e manutenção."], ["Dossier de Stock Inicial", "DI que carrega existências de arranque (com lotes e valores) sem documento de compra."], ["Códigos de movimentos", "Tipificam operações de stock para análises e controlo."]], "e": ["Dar entrada inicial por fatura de compra 'falsa' (distorce compras, IVA e PCMP)", "Ativar lotes num artigo já com stock e não regularizar o lote das quantidades antigas"]}, "L11": {"c": "Preço não é um número — é uma política. O PHC suporta várias tabelas de preços COM VALIDADES (a tabela do cliente + a data do documento determinam o preço), tipos de desconto (percentual/valor), descontos em cascata (Desc.1, Desc.2) e descontos automáticos por critérios (tipo de cliente, artigo, quantidade, valor). Promoções/campanhas e rappel completam o arsenal comercial. Configurar isto bem = menos erros de faturação e menos 'descontos inventados' à última hora.", "s": [["Tabela de preços com validade", "Conjunto nomeado de preços (ex.: Revenda, Retalho, Promo) com início/fim; o documento assume o preço válido na data."], ["Tabela do cliente", "Cada cliente/fornecedor tem a sua tabela associada — base da negociação."], ["Desconto em cascata", "Desc.1 aplicado e depois Desc.2 sobre o resultado — a ordem importa."], ["Promoções/campanhas", "Descontos temporários por artigo/família com datas; há opções específicas na gama Advanced/Enterprise."], ["Rappel", "Desconto retroativo por volume atingido no período (cliente ou fornecedor)."]], "e": ["Criar tabelas de preços sem validade e ter dois preços 'válidos' em conflito", "Mudar preços na tabela errada e o documento continuar a assumir a antiga (verifique qual tabela o cliente usa)"]}, "L12": {"c": "As tabelas base são a 'gramática' fiscal e organizacional do módulo: taxas de IVA (23/13/6/isento por zona fiscal), Motivos de Isenção com códigos normalizados M01-M99 (o webservice da AT só aceita estes), países (zona fiscal/moeda), moedas e câmbios (com importação via ODBC), idiomas (designações multi-idioma dos artigos) e tabelas de utilizador (listas controladas para campos extra — ex.: Zonas). Erros aqui propagam-se a todos os documentos e ao SAF-T.", "s": [["Taxa de IVA", "Percentagem + enquadramento por país/zona; artigos e documentos referenciam a taxa."], ["Motivo de isenção (M01-M99)", "Código legal que justifica IVA zero (ex.: M08 — art. 9.º). Com envio por webservice, só os códigos M são aceites."], ["País/zona fiscal", "Determina IVA nacional, intra-UE ou extracomunitário (e regras como operações triangulares)."], ["Moeda/câmbio", "Documentos em moeda estrangeira usam a taxa de câmbio (importável via ODBC)."], ["Tabela de utilizador", "Lista controlada criada na framework para alimentar campos extra (ex.: Zona do cliente)."]], "e": ["Criar motivos de isenção 'caseiros' fora de M01-M99 e o webservice da AT rejeitar", "Esquecer atualizar câmbios e faturar USD ao câmbio do ano passado"]}, "L13": {"c": "A série é o objeto de configuração mais importante da faturação: dá identidade a um documento. Define o TIPO (1/2/3 = fatura/simplificada/fatura-recibo e ND/NC; 4 = documento de transporte/guia; 5 = outro/proforma), o mapping SAF-T (FT, FS, FR, ND, NC, GT...), a numeração, e O QUE MOVIMENTA: stocks? conta corrente? tesouraria? Além disso concentra opções fiscais (ATCUD/código de validação, motivos de isenção nas linhas, validação de locais de carga/descarga, envio de SMS ao motorista) e de impressão. Série mal configurada = documento legalmente errado.", "s": [["Tipo de documento 1-5", "Classifica o comportamento: 4 e 5 não são faturas (transporte e proforma); 1-3 geram documentos fiscais FT/FS/FR/ND/NC."], ["Mapping SAF-T", "A série declara como o documento entra no SAF-T — inconsistência aqui invalida o ficheiro."], ["Movimenta stocks/C/C/tesouraria", "Três interruptores que decidem o efeito do documento (proforma tipicamente não movimenta nada)."], ["Numeração", "Sequência por série (e ano) — deve garantir numeração sequencial e cronológica exigida por lei."], ["Código de validação da série", "Dado pela AT após comunicação da série; sem ele o ATCUD não se forma e a impressão é bloqueada."]], "e": ["Criar séries 'só para testar' no meio das reais (numeração e SAF-T poluem-se — teste em BD clonada)", "Esquecer de definir o que movimenta e descobrir que as guias baixaram stock duas vezes"]}, "L14": {"c": "Emitir um documento fiscal no PHC dispara uma reação em cadeia automática: baixa de stock nos artigos, lançamento na conta corrente do cliente (com efeito no aging), atualização de acumulados na ficha do cliente e, se configurado, movimento previsto de tesouraria. Por isso 'gravar' não é um clique trivial — com processamento assíncrono ativo, o documento fica em estado 'não processado' até concluir. Documentos certificados não se alteram nem apagam: corrigem-se por NC e anulam-se com motivo obrigatório (a hash encadeada garante a integridade auditável).", "s": [["Atualização automática", "Stock + C/C + ficha do cliente num só gesto — a integração é o valor do ERP."], ["Processamento assíncrono", "Gravação em background (parâmetro); se algo inibir, o documento marca-se 'não processado' — verifique este estado em problemas."], ["Anulação vs eliminação", "Documento certificado anula-se (com motivo obrigatório), nunca se elimina; o registo fica para auditoria/SAF-T."], ["Totais/IVA", "O documento calcula por linha (preço × qty − descontos + IVA) e totals por taxa — base do SAF-T."]], "e": ["Apagar/alterar documentos de testes emitidos em séries certificadas (use séries de teste na BD clonada)", "Ignorar o estado 'não processado' e assumir que a fatura está fechada"]}, "L15": {"c": "Retalho e balcão têm regras próprias: Fatura Simplificada (FS) para vendas a consumidor final (fatura e recebe num só documento), vendas a dinheiro, e o cliente genérico 'Consumidor Final' com NIF 999999990 quando o comprador não dá NIF. A FS comunica-se no SAF-T como FS. Layouts devem incluir QR/ATCUD como em qualquer documento fiscalmente relevante. Controlo de reimpressão por acessos evita 'faturas fantasma'.", "s": [["FS vs FT", "FS = documento único para venda a dinheiro/consumidor final; FT = fatura clássica (pode exigir recibo separado para pagamento)."], ["Consumidor final", "Cliente genérico (NIF 999999990) para vendas sem identificação do comprador."], ["NIF obrigatório", "Há regras sobre quando é obrigatório pedir NIF (ex.: valores acima de certo montante / pedidos do cliente) — o software valida."], ["Reimpressão controlada", "Acesso próprio para reimprimir — cada reimpressão fica registada (documentos certificados)."]], "e": ["Emitir FS em série com mapping SAF-T errado (FS vs FT)", "Deixar qualquer utilizador reimprimir sem acesso controlado"]}, "L16": {"c": "Depois de emitida, uma fatura certificada não se 'desfaz' — corrige-se. Nota de Crédito (NC) anula/devolve (total ou parcial, com ou sem reposição de stock conforme a série); Nota de Débito (ND) acrescenta valor em falta. Ambas exigem Motivo de Retificação e ligam-se ao documento original. A regularização de recibos de adiantamento gera NC automática ('Retificação de Fatura de Adiantamento'). No SAF-T, NC/ND aparecem com os seus tipos próprios — e a cadeia de hashes mantém-se íntegra.", "s": [["NC total vs parcial", "Anula o documento inteiro ou apenas linhas/valores; parcial pode devolver só os artigos das linhas creditadas."], ["Motivo de Retificação", "Campo obrigatório que justifica a NC/ND (exige-se por lei e no SAF-T)."], ["Ligação ao original", "A NC referencia a fatura retificada — essencial para auditoria e para a AT."], ["Recibos incobráveis", "Tratamento específico de dívidas consideradas incobráveis (com implicações fiscais)."]], "e": ["Emitir NC sem repor stock quando houve devolução física (ou repor quando não houve)", "NC sem motivo de retificação — o SAF-T/e-fatura rejeitam ou invalidam"]}, "L17": {"c": "Dossiers Internos (DI) são o 'rascunho estruturado' do circuito comercial: documentos parametrizáveis pelo utilizador (tabela BO) que não são fiscais mas organizam o processo — Orçamentos/Propostas, Encomendas de Cliente, Folhas de Obra, Consignações, Avenças. O poder está nas conversões (cópias): orçamento → encomenda → guia → fatura, com opções de cópia configuráveis, mantendo o rasto. Encomendas podem reservar stock (quantidade reservada), e o estado/fecho do dossier controla o que ainda está pendente. Aprovação de dossiers (circuito formal) existe na gama Enterprise.", "s": [["DI (BO)", "Documento interno configurável: o utilizador cria tipos à medida do processo da empresa."], ["Conversão/cópia", "Passagem de um documento a outro (DI→fatura, guia→fatura...) com mapeamento de linhas e fecho do anterior."], ["Stock reservado", "A encomenda de cliente pode cativar/reservar quantidade — visível na ficha do artigo."], ["Análises de DI", "Pendentes, convertidos, taxas de conversão — gestão comercial."], ["Aprovação de dossiers", "Circuito de aprovação formal (Enterprise); workflow operacional aparece no Advanced+."]], "e": ["Usar Excel para orçamentos/encomendas quando o DI já dá rasto, conversão e análises", "Converter parcialmente sem fechar linhas pendentes — fica 'encomenda fantasma' a reservar stock para sempre"]}, "L18": {"c": "Documento de transporte (guia de remessa, tipo 4) acompanha mercadorias em circulação e tem obrigações próprias: locais de carga e descarga (tabelas de Moradas de Carga e Descarga → ShipFrom/ShipTo no SAF-T), data e HORA de início do transporte, matrícula e motorista. Antes de a mercadoria circular, a guia deve ser comunicada à AT — por webservice em tempo real (devolve o Cód. Ident. AT, que pode seguir por SMS ao motorista) ou por SAF-T (PT) resumido. A 'data efetiva de entrega' é obrigatória por lei em documentos fiscais. Guias convertem-se em fatura no fim.", "s": [["Tipo 4 = transporte", "Série própria com validações de transporte; não é fatura mas entra no SAF-T de transporte (GT)."], ["Webservice vs SAF-T resumido", "Os dois métodos de comunicação à AT; o parâmetro 'Método de envio de documentos de transporte' decide."], ["Cód. Ident. AT", "Código devolvido pelo webservice que prova a comunicação — pode ir por SMS ao motorista (série + módulo SMS)."], ["ShipFrom/ShipTo", "Elementos XML do SAF-T com locais de carga/descarga."], ["Data efetiva de entrega", "Quando bens/serviços foram/serão disponibilizados — obrigatória e comunicada no SAF-T."]], "e": ["Emitir guia com data/hora de transporte já passada sem comunicação (coima)", "Esquecer locais de carga/descarga com a validação ativa — gravação bloqueada (e é mesmo assim)"]}, "L19": {"c": "O dinheiro entra pelo lado da C/C: recibos (tabela RE) liquidam documentos de conta corrente, total ou parcialmente (liquidação). Recibo de adiantamento regista dinheiro recebido ANTES da fatura — depois é regularizado contra ela (podendo gerar NC de retificação automática). Cada liquidação atualiza saldos e aging. Recibos podem estornar-se/anular-se com efeito inverso. Este circuito é a base das cobranças e do reporting financeiro.", "s": [["Liquidação", "Casar recibos com faturas (total/parcial) — o que sobra fica como saldo pendente."], ["Recibo de adiantamento", "Entrada de dinheiro sem documento fiscal ainda emitido; regulariza-se na fatura futura."], ["Estorno/anulação de recibo", "Desfaz a liquidação e repõe a dívida (com rasto)."], ["Cheques em carteira", "Títulos recebidos ainda não cobrados — gestão própria na C/C."]], "e": ["Registar recebimento sem liquidar o documento (aging fica errado e as cobranças duplicam trabalho)", "Adiantamento esquecido sem regularizar — vira saldo 'misterioso' na C/C"]}, "L20": {"c": "Quando o volume cresce, faturar um a um é insustentável. A Emissão Automática de Faturação fatura em lote: um ecrã de preparação lista dossiers/guias por período/cliente e emite as faturas correspondentes de uma vez. O Dossier de Avenças automatiza a faturação recorrente (mensalidades, contratos) — configura-se uma vez e gera a fatura de cada período. E há importação de linhas de Excel para documentos (listas grandes de artigos). Juntas, estas ferramentas cortam horas de trabalho repetitivo.", "s": [["Emissão automática (preparação)", "Ecrã que agrupa documentos a faturar (por intervalo de datas, cliente, série) e emite em massa por cópia."], ["Dossier de Avenças", "Faturação recorrente parametrizada (periodicidade, artigos, cliente) — o motor gera o documento do período."], ["Importar Excel para Linhas", "Carregar centenas de linhas de um documento a partir de uma folha de cálculo."]], "e": ["Correr emissão automática sem testar o filtro de datas/estado (fatura dossiers já faturados ou errados)", "Avenças mal parametrizadas gerarem faturas duplicadas mês após mês sem ninguém dar por isso"]}, "L21": {"c": "O que o cliente vê é a impressão: layouts/templates definem cabeçalho, logótipo, colunas, rodapés, QR Code e ATCUD, e condições de impressão ('imprimir quando', cópias, rascunho). Na gama Advanced+ há Impressão Definida pelo Utilizador (ajustar colunas/ordens de listagens) e Definição de Assinaturas. Documentos fiscalmente relevantes TÊM de imprimir QR + ATCUD — o template é parte da conformidade, não cosmética. Exportação PDF é o canal para e-mail/arquivo (com File Storage/Cegid Docs).", "s": [["Template de documento", "Desenho da impressão (campos, ordem, logótipo, totais, certificação/QR/ATCUD)."], ["Imprimir quando", "Regras de impressão automática (ao gravar, nº de cópias, rascunho vs definitivo)."], ["Impressão Definida pelo Utilizador", "Personalização de colunas/totais de listagens pelo utilizador (Advanced+)."], ["QR + ATCUD no layout", "Obrigatórios nos documentos fiscalmente relevantes desde 2021 — o template tem de os conter."], ["File Storage", "Anexos/PDFs podem ir para diretoria física (não fiscalmente relevantes) ou BD."]], "e": ["Editar templates em produção sem backup do template original", "Layout sem QR/ATCUD após atualização — documentos saem não conformes"]}, "L22": {"c": "O ciclo de compras espelha o de vendas: Encomenda a Fornecedor (DI) → receção (guia/fatura de compra) → C/C do fornecedor → pagamento. A conversão 'Comprar a Encomenda a Fornecedor' gera o documento de compra a partir do DI, suportando receções parciais (o remanescente fica pendente na encomenda). 'Encomendado a fornecedor' na ficha do artigo mostra a pipeline de aprovisionamento. Análises de encomendas pendentes evitam ruturas e duplicações.", "s": [["Encomenda a Fornecedor (DI)", "Documento interno de compra: o que se pretende receber, de quem, a que preço."], ["Comprar a Encomenda", "Conversão do DI em documento de compra (total ou parcial)."], ["Receção parcial", "Entrada de só parte das quantidades; a encomenda mantém o resto pendente."], ["Encomendado a fornecedor", "Campo da ficha do artigo com as quantidades em pipeline de compra."]], "e": ["Rececionar sem encomenda (perde-se o controlo do que falta) ou receber duas vezes a mesma linha", "Não fechar linhas canceladas — ficam 'encomendadas' para sempre e distorcem o aprovisionamento"]}, "L23": {"c": "A fatura de compra não é só um custo: é o evento que REVALORIZA o stock. Cada entrada valorizada recalcula o PCMP (Preço de Custo Médio Ponderado): novo PCMP = (valor stock anterior + valor entrada) / (qty anterior + qty entrada). É o PCMP que valoriza saídas, margens, inventário e o CEVMC na contabilidade. Compras distinguem IVA dedutível/não dedutível, podem ter custos acessórios e alimentam a C/C do fornecedor (e a tesouraria previsional).", "s": [["PCMP", "Custo médio ponderado recalculado a cada entrada valorizada — base de margens e valor de stock."], ["Margem/contribuição", "Preço de venda vs PCMP — as análises de rentabilidade dependem do custo estar certo."], ["IVA na compra", "Dedutível (recupera) ou não; artigos isentos usam motivo de isenção."], ["Custos acessórios", "Fretes/taxas que devem integrar o custo do artigo (conforme configuração)."], ["CEVMC", "Custo das existências vendidas/consumidas apurado na Contabilidade a partir dos consumos."]], "e": ["Lançar compras a custo 0 'para despachar' — destrói PCMP, margens e inventário valorizado", "Não conferir o novo PCMP após entradas grandes (erro de preço de compra passa para todas as vendas seguintes)"]}, "L24": {"c": "Adiantamentos a fornecedores = dinheiro entregue antes da fatura (sinal, pagamento antecipado). Registam-se como pagamento de adiantamento na C/C do fornecedor e são regularizados quando a fatura chega. Em empresas com muitos adiantamentos, o controlo (pendentes, antiguidade, regularizações) evita pagamentos duplicados e 'buracos' na tesouraria. A aprovação de pagamentos (configurável; circuitos formais nas gamas superiores) é o controlo interno que autoriza cada saída de dinheiro.", "s": [["Pagamento de adiantamento", "Saída de dinheiro sem fatura ainda — fica como saldo adiantado na C/C do fornecedor."], ["Regularização", "Quando a fatura chega, o adiantamento abate-lhe o valor (total/parcial)."], ["Aprovação de pagamentos", "Circuito que exige autorização antes de pagar (gestão de aprovações; Enterprise tem aprovação de dossiers)."]], "e": ["Pagar 'por fora' sem registar adiantamento e depois pagar a fatura inteira (duplicação)", "Adiantamentos antigos sem regularizar — saldo do fornecedor nunca fecha"]}, "L25": {"c": "Todo o stock mexe por movimentos tipificados (Códigos de Movimentos de Stocks): vendas e compras geram movimentos automáticos; quebras/sobras, transferências e regularizações usam movimentos manuais ou dossiers próprios (ex.: Dossier de Transferência de Armazém). O histórico de movimentos é a 'caixa negra' do armazém: quem moveu, quando, de/para onde, porquê. Stock cativo/pré-cativo reserva quantidades. Terminais portáteis (PDA) aceleram operações físicas.", "s": [["Código de movimento", "Tipo da operação de stock (entrada, saída, quebra, sobra, transferência...) — base das análises."], ["Dossier de Transferência", "Move quantidades entre armazéns com rasto documental."], ["Stock cativo/pré-cativo", "Reservas (comprometidas ou indicativas) que reduzem a disponibilidade efetiva."], ["Histórico de movimentos", "Rasto completo por artigo/lote/armazém — ferramenta de auditoria de stock."], ["PDA/terminais portáteis", "Captura física (contagens, picking) integrada no módulo."]], "e": ["Corrigir stock 'direto' sem código de movimento adequado (perde-se o porquê)", "Transferir sem documento e os dois armazéns ficarem desacertados sem rasto"]}, "L26": {"c": "O inventário físico é o momento da verdade: contar o que existe e confrontar com o stock teórico do sistema. Diferenças geram acertos automáticos — quebra (faltam) ou sobra (excedem) — lançados no ficheiro de movimentos, que corrigem quantidades E valor (via PCMP). Além da gestão interna, há a obrigação fiscal: comunicação do inventário à AT até 31 de janeiro (empresas abrangidas), por ficheiro (formatos conforme volume). Contagens cíclicas (por família/armazém) reduzem a dor do inventário anual.", "s": [["Stock teórico vs contado", "O sistema sabe quanto 'deveria' haver; a contagem diz quanto há; a diferença é o acerto."], ["Quebra/Sobra", "Acerto negativo/positivo lançado automaticamente no movimento de stock."], ["Valor de inventário", "Quantidades × PCMP — o valor das existências para balanço/CEVMC."], ["Comunicação à AT", "Ficheiro de inventário (SAF-T/CSV/XML conforme regras) entregue até 31 de janeiro."]], "e": ["Fazer contagem com movimentos a acontecer em simultâneo (congelar operações durante a contagem)", "Contar sem lotes quando o artigo é lotado — o acerto fica impossível de aplicar"]}, "L27": {"c": "Gestão de stock é decisão: o que comprar, quando, quanto, e onde está o dinheiro parado. As análises standard dão as respostas — ruturas (sem stock para vender), acima do máximo (capital empatado), ponto de encomenda (quando pedir), ranking de vendas (o que gira), margem/contribuição (o que ganha). Cruzar valor de stock (PCMP × qty) com rotação revela o 'stock morto'. O técnico expert sabe configurar estas análises e transformá-las em rotina semanal de compras.", "s": [["Rutura", "Artigo com stock ≤ 0 (ou abaixo do mínimo) que impede vendas — custo de oportunidade."], ["Ponto de encomenda", "Nível que dispara a recomendação de compra (considera lead time e consumo)."], ["Ranking/ABC", "Ordenação por vendas/margem — os A (20% dos artigos, 80% do valor) merecem controlo fino."], ["Rotação vs stock morto", "Sai pouco e vale muito = candidato a promoção/descontinuação."]], "e": ["Comprar 'por intuição' ignorando ponto de encomenda e stock máximo", "Não exportar as análises para partilhar com a direção (decisões ficam no técnico)"]}, "L28": {"c": "A conta corrente (C/C) é o livro de dívidas e créditos: cada cliente/fornecedor tem movimentos tipificados por Códigos de C/C (fatura, recibo, adiantamento, juros...) que determinam o saldo. O aging (saldos por idades) distribui a dívida por escalões de atraso — é O indicador de risco de crédito. Extractos de conta comunicam a posição ao cliente; o mailing de C/C prepara avisos de cobrança por documento. Recibos incobráveis tratam dívidas perdidas (com regras fiscais).", "s": [["Códigos de C/C", "Tipos de movimento da conta corrente — classificam e filtram os lançamentos."], ["Aging (saldos por idades)", "Dívida por escalões (0-30, 31-60, 61-90, +90) — base de cobrança e provisionamento."], ["Extracto de conta", "Documento periódico com movimentos e saldo — comunicação formal com o cliente."], ["Mailing de C/C", "Preparação de avisos/carta de cobrança por documento em atraso."], ["Recibos incobráveis", "Registo e tratamento fiscal de dívidas consideradas perdidas."]], "e": ["Lançar 'acertos' na C/C sem código adequado (o aging deixa de fazer sentido)", "Discutir saldos com clientes sem extracto de conta (cada um tem 'a sua' versão)"]}, "L29": {"c": "Cobrança é processo, não improviso: um monitor que liste dívidas por atraso/valor, uma rotina semanal (quem contacta, quando, com que argumento), registo das promessas de pagamento e escalada (aviso → carta → incobrável). O PHC dá as peças: Monitor de controlo de dívidas, extractos, mailing de C/C por documento e envio por e-mail (SMTP). O técnico configura o sistema; a disciplina de uso é que recupera o dinheiro.", "s": [["Monitor de dívidas", "Vista operacional de valores em atraso com critérios (dias, montante) e ordenações — o 'painel de controlo' das cobranças."], ["Mailing de C/C", "Geração de avisos de cobrança por documento (carta/e-mail)."], ["Promessa de pagamento", "Registo do compromisso do cliente (nota/anexo) para seguimento — sem registo, a equipa perde o fio."], ["Escalada", "Sequência aviso → contacto → carta → jurídico/incobrável, com prazos definidos por política interna."]], "e": ["Cobrar sem extracto/validos atualizados (o cliente contesta e a conversa reinicia)", "Não registar interações — três pessoas ligam ao mesmo cliente no mesmo dia"]}, "L30": {"c": "O fecho bancário mensal garante que 'o que o ERP diz' = 'o que o banco diz'. Contas de Tesouraria representam caixas e bancos (com IBAN); movimentos tipificados por Códigos de Tesouraria; o extracto bancário importa-se/regista-se e reconcilia-se movimento a movimento (detetando omissões, duplicações, comissões não registadas). Para cobranças/pagamentos em massa há ficheiros SEPA (débitos diretos, transferências), referências Multibanco e, no Evolution, open banking (importação automática e reconciliação acelerada).", "s": [["Conta de Tesouraria", "Cada caixa/banco é uma conta com movimentos próprios; transferências movem entre contas."], ["Extracto bancário", "Lista oficial de movimentos do banco — importa-se ou digita-se para reconciliar."], ["Reconciliação", "Casar extracto × movimentos do ERP; diferenças = erros a corrigir (nunca 'tapar')."], ["SEPA", "Standard europeu: ficheiros de débitos diretos (cobranças) e transferências (pagamentos em lote)."], ["Referências Multibanco", "Entidade/referência geradas por documento/cliente para pagamento fácil e identificação automática."], ["Open banking", "No Evolution: ligação direta aos bancos para movimentos e previsões (sem ficheiros manuais)."]], "e": ["Reconciliar 'por totais' em vez de movimento a movimento (erros escondem-se)", "Esquecer comissões bancárias — o saldo nunca fecha e ninguém sabe porquê"]}, "L31": {"c": "Tesouraria tem três camadas: REAL (o que já aconteceu), PREVISIONAL (o que vai acontecer — alimentada por documentos por vencer, títulos, avenças) e ORÇAMENTAL (o plano aprovado). Comparar as três responde às pergun
